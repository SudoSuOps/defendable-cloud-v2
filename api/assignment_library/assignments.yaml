            severity:
              enum:
              - low
              - medium
              - high
            evidence_reference:
              type: string
      assumptions:
        type: array
        items:
          type: string
      open_questions:
        type: array
        items:
          type: string
      final_output:
        type: string
        enum:
        - PASS
        - FAIL
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
        properties:
          all_required_sections_completed:
            type: boolean
            const: true
          all_numbers_have_sources:
            type: boolean
            const: true
          assumptions_labeled:
            type: boolean
            const: true
          missing_inputs_disclosed:
            type: boolean
            const: true
  deterministic_checks:
  - description: requested_action must be present
    condition: requested_action.present == true
    pass_on_true: true
  - description: requested_action must be marked specific
    condition: requested_action.specific == true
    pass_on_true: true
  - description: requested_action must be marked actionable
    condition: requested_action.actionable == true
    pass_on_true: true
  - description: specificity_score must be at least 3
    condition: requested_action.specificity_score >= 3
    pass_on_true: true
  - description: final_output must be PASS only when all conditions met
    condition: final_output == "PASS" implies requested_action.present == true AND
      requested_action.specific == true AND requested_action.actionable == true AND
      requested_action.specificity_score >= 3
    pass_on_true: true
  math_checks: []
  evidence_checks:
  - check_id: action_text_evidence
    description: The requested action text must be quoted verbatim from the document
      with line reference
    evidence_must_match_claim: true
  - check_id: specificity_reasoning
    description: The reason field must explain the specificity_score with concrete
      evidence from the text
    required: true
  flag_rules:
  - flag_id: action_missing
    condition: requested_action.present == false
    severity: honey
    message: No requested action found in the document
  - flag_id: action_not_specific
    condition: requested_action.present == true AND requested_action.specific == false
    severity: honey
    message: Requested action exists but is not specific
  - flag_id: action_not_actionable
    condition: requested_action.present == true AND requested_action.actionable ==
      false
    severity: honey
    message: Requested action exists but is not actionable
  - flag_id: low_specificity_score
    condition: requested_action.specificity_score < 3
    severity: jelly
    message: Specificity score is below threshold (3)
  - flag_id: false_pass
    condition: final_output == "PASS" AND (requested_action.present == false OR requested_action.specific
      == false OR requested_action.actionable == false OR requested_action.specificity_score
      < 3)
    severity: propolis
    message: final_output is PASS but action clarity requirements not met
  severity_mapping:
    honey: Minor issue — requested action is vague or missing one element
    jelly: Moderate issue — requested action is present but lacks specificity or actionability
    propolis: Critical issue — no requested action at all, or false PASS reported
  receipt_type: eval_receipt
  recommended_human_review: false
  sample_submission_shape:
    assignment_id: doc_requested_action_clarity_v1
    agent_summary: Document contains a specific, actionable request.
    inputs_used:
    - document_draft
    missing_inputs: []
    claims:
    - claim: Requested action is present in the document
      evidence_reference: 'Paragraph 3: ''Please review the attached proposal and
        send feedback by Friday, March 15'''
      confidence: provided
    - claim: Requested action is specific
      evidence_reference: Action specifies WHAT (review proposal), WHO (recipient),
        and WHEN (Friday, March 15)
      confidence: provided
    requested_action:
      present: true
      text: Please review the attached proposal and send feedback by Friday, March
        15
      specific: true
      actionable: true
      specificity_score: 4
      reason: Action clearly states WHAT (review proposal), includes a deadline (WHEN),
        and the recipient knows exactly what to do
    calculations: []
    risks: []
    assumptions: []
    open_questions: []
    final_output: PASS
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: doc_tone_policy_compliance_v1
  name: Tone and Policy Compliance
  lane: document_draft_eval
  version: '1.0'
  purpose: Verify that the document draft uses an appropriate tone and addresses all
    required policy checklist items. Documents must match the specified tone requirement
    and demonstrate compliance with organizational policy items.
  operator_instructions: Provide the agent with a document draft and a list of required
    policy checklist items. The agent must classify the tone against an enumerated
    set, check each policy item, and return structured JSON.
  agent_prompt: "You are evaluating a document draft for tone appropriateness and\
    \ policy compliance.\n\nGiven the document draft and the required policy checklist,\
    \ perform the following:\n1. Classify the document's tone into exactly one of\
    \ these enum values: [formal, informal, neutral, persuasive, instructional, urgent]\n\
    2. Compare the detected tone against the required_tone. If they match, tone_compliant\
    \ is true.\n3. For EACH item in the policy_checklist, determine if it is addressed\
    \ in the document. An item is \"addressed\" if the document contains content that\
    \ clearly covers that policy requirement.\n4. Count addressed and missed items.\n\
    \nReturn a single JSON object with this exact structure:\n{\n  \"assignment_id\"\
    : \"doc_tone_policy_compliance_v1\",\n  \"agent_summary\": \"One sentence summary\"\
    ,\n  \"inputs_used\": [\"list of inputs examined\"],\n  \"missing_inputs\": [\"\
    any missing inputs\"],\n  \"claims\": [\n    {\"claim\": \"\", \"evidence_reference\"\
    : \"\", \"confidence\": \"provided | inferred | missing\"}\n  ],\n  \"tone_analysis\"\
    : {\n    \"detected_tone\": \"formal | informal | neutral | persuasive | instructional\
    \ | urgent\",\n    \"required_tone\": \"the required tone from inputs\",\n   \
    \ \"tone_compliant\": true\n  },\n  \"policy_checklist\": [\n    {\"item\": \"\
    \", \"addressed\": true, \"evidence\": \"reference to where addressed\"}\n  ],\n\
    \  \"policy_compliance_ratio\": 0.0,\n  \"calculations\": [\n    {\"name\": \"\
    policy_compliance_ratio\", \"formula\": \"addressed_items / total_items\", \"\
    inputs\": {}, \"result\": 0.0, \"units\": \"ratio\", \"assumptions\": []}\n  ],\n\
    \  \"risks\": [\n    {\"risk\": \"\", \"severity\": \"low | medium | high\", \"\
    evidence_reference\": \"\"}\n  ],\n  \"assumptions\": [],\n  \"open_questions\"\
    : [],\n  \"final_output\": \"PASS or FAIL\",\n  \"self_check\": {\n    \"all_required_sections_completed\"\
    : true,\n    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\"\
    : true,\n    \"missing_inputs_disclosed\": true\n  }\n}\n\nScoring rules:\n- policy_compliance_ratio\
    \ = (number of addressed items) / (total number of items)\n- PASS if tone_compliant\
    \ == true AND policy_compliance_ratio >= 1.0 (all items addressed)\n- FAIL if\
    \ tone_compliant == false OR any policy item is not addressed\n- All policy checklist\
    \ items must be evaluated — no omissions\n\nReturn only the JSON. No markdown\
    \ fences, no prose.\n"
  required_inputs:
  - name: document_draft
    type: string
    description: The document draft text to evaluate
    required: true
  - name: required_tone
    type: string
    description: 'The required tone enum value: formal, informal, neutral, persuasive,
      instructional, urgent'
    required: true
  - name: policy_checklist
    type: array
    description: List of policy items that must be addressed in the document
    required: true
  expected_outputs:
  - tone_analysis object with detected_tone, required_tone, tone_compliant
  - policy_checklist array with item, addressed, evidence per item
  - policy_compliance_ratio float
  - final_output PASS or FAIL
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - tone_analysis
    - policy_checklist
    - policy_compliance_ratio
    - calculations
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
    properties:
      assignment_id:
        type: string
        const: doc_tone_policy_compliance_v1
      agent_summary:
        type: string
        minLength: 1
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      claims:
        type: array
        items:
          type: object
          required:
          - claim
          - evidence_reference
          - confidence
          properties:
            claim:
              type: string
            evidence_reference:
              type: string
            confidence:
              enum:
              - provided
              - inferred
              - missing
      tone_analysis:
        type: object
        required:
        - detected_tone
        - required_tone
        - tone_compliant
        properties:
          detected_tone:
            enum:
            - formal
            - informal
            - neutral
            - persuasive
            - instructional
            - urgent
          required_tone:
            enum:
            - formal
            - informal
            - neutral
            - persuasive
            - instructional
            - urgent
          tone_compliant:
            type: boolean
      policy_checklist:
        type: array
        items:
          type: object
          required:
          - item
          - addressed
          - evidence
          properties:
            item:
              type: string
            addressed:
              type: boolean
            evidence:
              type: string
      policy_compliance_ratio:
        type: number
        minimum: 0
        maximum: 1
      calculations:
        type: array
        items:
          type: object
          required:
          - name
          - formula
          - inputs
          - result
          - units
          - assumptions
      risks:
        type: array
        items:
          type: object
          required:
          - risk
          - severity
          - evidence_reference
          properties:
            risk:
              type: string
            severity:
              enum:
              - low
              - medium
              - high
            evidence_reference:
              type: string
      assumptions:
        type: array
        items:
          type: string
      open_questions:
        type: array
        items:
          type: string
      final_output:
        type: string
        enum:
        - PASS
        - FAIL
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
        properties:
          all_required_sections_completed:
            type: boolean
            const: true
          all_numbers_have_sources:
            type: boolean
            const: true
          assumptions_labeled:
            type: boolean
            const: true
          missing_inputs_disclosed:
            type: boolean
            const: true
  deterministic_checks:
  - description: detected_tone must match one of the enum values
    condition: detected_tone in ["formal", "informal", "neutral", "persuasive", "instructional",
      "urgent"]
    pass_on_true: true
  - description: required_tone must match one of the enum values
    condition: required_tone in ["formal", "informal", "neutral", "persuasive", "instructional",
      "urgent"]
    pass_on_true: true
  - description: tone_compliant must be true when detected_tone equals required_tone
    condition: tone_compliant == (detected_tone == required_tone)
    pass_on_true: true
  - description: policy_compliance_ratio must equal addressed_items / total_items
    condition: abs(policy_compliance_ratio - (addressed_count / total_count)) < 0.001
    pass_on_true: true
  - description: PASS requires tone compliance and all policy items addressed
    condition: final_output == "PASS" implies tone_compliant == true AND policy_compliance_ratio
      == 1.0
    pass_on_true: true
  math_checks:
  - formula_id: policy_compliance_ratio_formula
    description: Calculate policy compliance ratio as addressed items divided by total
      items
    formula: policy_compliance_ratio = addressed_items / total_items
    expected_precision: 0.01
    variables:
    - name: addressed_items
      type: integer
    - name: total_items
      type: integer
    result_field: policy_compliance_ratio
  evidence_checks:
  - check_id: tone_evidence
    description: The detected_tone classification must be supported by quoted evidence
      from the document
    evidence_must_match_claim: true
  - check_id: policy_item_evidence
    description: Each policy_checklist item marked addressed=true must have a non-empty
      evidence field citing document location
    required: true
  flag_rules:
  - flag_id: tone_mismatch
    condition: tone_compliant == false
    severity: honey
    message: Document tone does not match required tone
  - flag_id: policy_partial_compliance
    condition: policy_compliance_ratio < 1.0 AND policy_compliance_ratio >= 0.5
    severity: jelly
    message: Some but not all policy checklist items are addressed
  - flag_id: policy_low_compliance
    condition: policy_compliance_ratio < 0.5
    severity: honey
    message: Less than half of policy checklist items are addressed
  - flag_id: false_pass_tone
    condition: final_output == "PASS" AND tone_compliant == false
    severity: propolis
    message: final_output is PASS but tone is not compliant
  - flag_id: false_pass_policy
    condition: final_output == "PASS" AND policy_compliance_ratio < 1.0
    severity: propolis
    message: final_output is PASS but not all policy items are addressed
  severity_mapping:
    honey: Minor issue — tone mismatch, or partial policy compliance above 50%
    jelly: Moderate issue — significant policy gaps (50-99% compliance)
    propolis: Critical issue — false PASS, or less than 50% policy compliance
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: doc_tone_policy_compliance_v1
    agent_summary: Tone is formal as required; all 4 policy checklist items addressed.
    inputs_used:
    - document_draft
    - required_tone
    - policy_checklist
    missing_inputs: []
    claims:
    - claim: Document tone is formal
      evidence_reference: Uses 'Dear Sir/Madam', formal closing, no contractions
      confidence: provided
    - claim: All policy items are addressed
      evidence_reference: Section 2 covers all four required items
      confidence: provided
    tone_analysis:
      detected_tone: formal
      required_tone: formal
      tone_compliant: true
    policy_checklist:
    - item: Data privacy notice included
      addressed: true
      evidence: Paragraph 2 states 'All data is handled per GDPR guidelines'
    - item: Conflict of interest disclosure
      addressed: true
      evidence: Footer contains signed conflict of interest statement
    - item: Approval authority cited
      addressed: true
      evidence: Document states 'Approved by the Board of Directors'
    - item: Retention period stated
      addressed: true
      evidence: 'Section 5: ''Documents retained for 7 years per policy'''
    policy_compliance_ratio: 1.0
    calculations:
    - name: policy_compliance_ratio
      formula: addressed_items / total_items
      inputs:
        addressed_items: 4
        total_items: 4
      result: 1.0
      units: ratio
      assumptions: []
    risks: []
    assumptions: []
    open_questions: []
    final_output: PASS
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: evx_claim_evidence_pairing_v1
  name: Claim-Evidence Pairing
  lane: evidence_extraction_eval
  version: '1.0'
  purpose: 'Evaluate the agent''s ability to match stated claims against supporting
    evidence in provided documents. The agent must identify which claims are supported
    by evidence, which lack evidence, and classify the nature of each match.

    '
  operator_instructions: 'Provide a list of claims (5-10 claims) and 1-3 source documents
    that may or may not contain supporting evidence. Include a mix of supported claims,
    partially supported claims, and unsupported claims. Source documents should contain
    both direct evidence and indirect/contextual evidence.

    '
  agent_prompt: "You are given a list of claims and one or more source documents.\
    \ Your task is to match each claim to supporting evidence found in the documents.\n\
    For each claim, return an object with exactly these fields: - \"claim\": the exact\
    \ claim text as provided - \"evidence\": the specific text from the source document\
    \ that supports or contradicts the claim - \"match_type\": one of [\"direct\"\
    , \"indirect\", \"unsupported\", \"contradicted\"] where:\n    - \"direct\" =\
    \ evidence directly and explicitly supports the claim\n    - \"indirect\" = evidence\
    \ supports the claim through inference or context\n    - \"unsupported\" = no\
    \ evidence found in any source document\n    - \"contradicted\" = evidence in\
    \ source documents directly contradicts the claim\n- \"source_document\": identifier\
    \ of the document containing the evidence (null if unsupported) - \"confidence\"\
    : one of [\"high\", \"medium\", \"low\"] indicating certainty of the match\nReturn\
    \ ONLY a JSON object with this exact shape: {\n  \"assignment_id\": \"evx_claim_evidence_pairing_v1\"\
    ,\n  \"agent_summary\": \"<summary of claim-evidence pairing results>\",\n  \"\
    inputs_used\": [\"<document identifiers>\", \"claims_list\"],\n  \"missing_inputs\"\
    : [],\n  \"claim_evidence_pairs\": [\n    {\"claim\": \"Revenue grew 10%\", \"\
    evidence\": \"Revenue increased by 10 percent to $11M\", \"match_type\": \"direct\"\
    , \"source_document\": \"doc_1\", \"confidence\": \"high\"}\n  ],\n  \"claims\"\
    : [],\n  \"calculations\": [],\n  \"risks\": [],\n  \"assumptions\": [],\n  \"\
    open_questions\": [],\n  \"final_output\": \"<summary>\",\n  \"self_check\": {\n\
    \    \"all_required_sections_completed\": true,\n    \"all_numbers_have_sources\"\
    : true,\n    \"assumptions_labeled\": true,\n    \"missing_inputs_disclosed\"\
    : true\n  }\n}\nRules: - Every claim in the input list must appear in claim_evidence_pairs.\
    \ - evidence must be an exact or near-exact quote from the source, not paraphrased.\
    \ - If match_type is \"unsupported\", set evidence to null and source_document\
    \ to null. - If match_type is \"contradicted\", the evidence field must contain\
    \ the contradicting text. - Do not fabricate evidence. If not found, classify\
    \ as unsupported. - confidence must reflect actual certainty; do not default to\
    \ \"high\".\n"
  required_inputs:
  - name: claims_list
    type: array_of_strings
    description: List of claim statements to evaluate.
    count: 5-10
  - name: source_documents
    type: array_of_text
    description: One or more source documents to search for evidence.
    count: 1-3
  expected_outputs:
  - claim_evidence_pairs array with claim, evidence, match_type, source_document,
    confidence
  - All input claims accounted for
  - Evidence quotes traceable to source documents
  - Self-check object
  required_output_schema:
    type: object
    required:
    - assignment_id
    - claim_evidence_pairs
    - inputs_used
    - missing_inputs
    - self_check
    properties:
      assignment_id:
        type: string
        const: evx_claim_evidence_pairing_v1
      claim_evidence_pairs:
        type: array
        items:
          type: object
          required:
          - claim
          - evidence
          - match_type
          - source_document
          - confidence
          properties:
            claim:
              type: string
              minLength: 1
            evidence:
              type:
              - string
              - 'null'
            match_type:
              type: string
              enum:
              - direct
              - indirect
              - unsupported
              - contradicted
            source_document:
              type:
              - string
              - 'null'
            confidence:
              type: string
              enum:
              - high
              - medium
              - low
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - description: Every claim in the input claims_list must appear in claim_evidence_pairs[].claim.
    method: Set equality check — input claims set equals output claims set.
  - description: match_type must be one of [direct, indirect, unsupported, contradicted].
    method: Enum validation against schema.
  - description: confidence must be one of [high, medium, low].
    method: Enum validation against schema.
  - description: If match_type is unsupported, evidence and source_document must be
      null.
    method: Conditional null check on evidence and source_document fields.
  - description: If match_type is direct or indirect, evidence and source_document
      must be non-null.
    method: Conditional non-null check on evidence and source_document fields.
  - description: claim_evidence_pairs array length must equal input claims_list length.
    method: Length equality check.
  math_checks: []
  evidence_checks:
  - description: For direct/indirect matches, verify evidence text exists in the stated
      source document.
    method: Substring search evidence against source_documents.
  - description: Verify unsupported claims truly have no supporting evidence in any
      source document.
    method: Manual or keyword search review of source_documents for each unsupported
      claim.
  - description: Verify contradicted claims have evidence that actually contradicts
      (not merely omits).
    method: Semantic comparison of evidence text against claim text.
  flag_rules:
  - flag_id: missing_claim
    condition: Input claim not present in claim_evidence_pairs
    severity: propolis
  - flag_id: fabricated_evidence
    condition: evidence text not found in any source document
    severity: honey
  - flag_id: invalid_match_type
    condition: match_type not in [direct, indirect, unsupported, contradicted]
    severity: honey
  - flag_id: unsupported_with_evidence
    condition: match_type is unsupported AND evidence is non-null
    severity: jelly
  - flag_id: direct_without_source
    condition: match_type is direct/indirect AND source_document is null
    severity: jelly
  - flag_id: invalid_confidence
    condition: confidence not in [high, medium, low]
    severity: honey
  - flag_id: claim_count_mismatch
    condition: len(claim_evidence_pairs) != len(input claims_list)
    severity: propolis
  - flag_id: self_check_false
    condition: any self_check boolean is false
    severity: jelly
  severity_mapping:
    honey: Minor error — fabricated evidence or invalid enum on single pair
    jelly: Moderate error — logical inconsistency in match_type/evidence pairing
    propolis: Critical error — missing claims or claim count mismatch
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: evx_claim_evidence_pairing_v1
    agent_summary: 'Paired 7 claims: 4 direct, 1 indirect, 2 unsupported'
    inputs_used:
    - claims_list
    - doc_1
    - doc_2
    missing_inputs: []
    claims: []
    calculations: []
    risks: []
    assumptions:
    - Evidence quotes are exact substrings of source documents
    open_questions: []
    claim_evidence_pairs:
    - claim: Revenue grew 10% in FY2024
      evidence: Revenue increased by 10 percent year-over-year to $11 million
      match_type: direct
      source_document: doc_1
      confidence: high
    - claim: Company has 500+ employees
      evidence: Headcount exceeds five hundred staff members globally
      match_type: indirect
      source_document: doc_1
      confidence: medium
    - claim: CEO resigned in January 2024
      evidence: null
      match_type: unsupported
      source_document: null
      confidence: low
    final_output: 4 claims directly supported, 1 indirectly supported, 2 unsupported
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: evx_contradiction_detection_v1
  name: Contradiction Detection
  lane: evidence_extraction_eval
  version: '1.0'
  purpose: 'Evaluate the agent''s ability to find contradictory statements across
    multiple source documents, report confidence in each detected contradiction, and
    propose a resolution or explanation for the discrepancy.

    '
  operator_instructions: 'Provide 2-4 source documents that contain at least 2-4 explicit
    contradictions and at least 2 non-contradictory statements that could be mistaken
    for contradictions (near-paraphrases or different timeframes). Include contradictions
    in both numeric facts and qualitative claims. Vary the obviousness of contradictions
    (some direct, some requiring inference).

    '
  agent_prompt: "You are given multiple source documents. Your task is to find ALL\
    \ contradictory statements between any two documents (or within the same document).\n\
    For each contradiction found, return an object with exactly these fields: - \"\
    statement_a\": the exact text of the first contradictory statement - \"source_a\"\
    : identifier of the document containing statement_a - \"statement_b\": the exact\
    \ text of the second contradictory statement - \"source_b\": identifier of the\
    \ document containing statement_b - \"contradiction_type\": one of [\"direct\"\
    , \"temporal\", \"quantitative\", \"qualitative\"] where:\n    - \"direct\" =\
    \ statements cannot both be true under any interpretation\n    - \"temporal\"\
    \ = statements differ due to different time periods\n    - \"quantitative\" =\
    \ numeric values conflict\n    - \"qualitative\" = descriptive claims conflict\n\
    - \"confidence\": one of [\"high\", \"medium\", \"low\"] indicating how certain\
    \ the contradiction is - \"resolution\": a brief explanation of why the contradiction\
    \ exists or how it could be resolved (max 200 chars)\nReturn ONLY a JSON object\
    \ with this exact shape: {\n  \"assignment_id\": \"evx_contradiction_detection_v1\"\
    ,\n  \"agent_summary\": \"<summary of contradictions found>\",\n  \"inputs_used\"\
    : [\"<document identifiers>\"],\n  \"missing_inputs\": [],\n  \"contradictions\"\
    : [\n    {\"statement_a\": \"Revenue was $10M\", \"source_a\": \"doc_1\", \"statement_b\"\
    : \"Revenue was $12M\", \"source_b\": \"doc_2\", \"contradiction_type\": \"quantitative\"\
    , \"confidence\": \"high\", \"resolution\": \"Different fiscal years; doc_1 refers\
    \ to FY2023, doc_2 to FY2024\"}\n  ],\n  \"claims\": [],\n  \"calculations\":\
    \ [],\n  \"risks\": [],\n  \"assumptions\": [],\n  \"open_questions\": [],\n \
    \ \"final_output\": \"<summary>\",\n  \"self_check\": {\n    \"all_required_sections_completed\"\
    : true,\n    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\"\
    : true,\n    \"missing_inputs_disclosed\": true\n  }\n}\nRules: - Report EVERY\
    \ genuine contradiction you find. Do not omit. - Do NOT report paraphrases or\
    \ non-contradictory restatements as contradictions. - statement_a and statement_b\
    \ must be exact or near-exact quotes from the documents. - If source_a == source_b,\
    \ the contradiction is within the same document. - If no contradictions exist,\
    \ return contradictions as empty array and state in final_output. - resolution\
    \ must attempt to explain the cause of the contradiction (e.g., different dates,\
    \ errors, interpretations). - confidence must reflect actual certainty, not default\
    \ to \"high\".\n"
  required_inputs:
  - name: source_documents
    type: array_of_text
    description: Two or more documents to compare for contradictions.
    count: 2-4
  expected_outputs:
  - contradictions array with statement_a, source_a, statement_b, source_b, contradiction_type,
    confidence, resolution
  - No false positives (paraphrases misreported as contradictions)
  - Resolution field explaining each detected contradiction
  - Self-check object
  required_output_schema:
    type: object
    required:
    - assignment_id
    - contradictions
    - inputs_used
    - missing_inputs
    - self_check
    properties:
      assignment_id:
        type: string
        const: evx_contradiction_detection_v1
      contradictions:
        type: array
        items:
          type: object
          required:
          - statement_a
          - source_a
          - statement_b
          - source_b
          - contradiction_type
          - confidence
          - resolution
          properties:
            statement_a:
              type: string
              minLength: 1
            source_a:
              type: string
            statement_b:
              type: string
              minLength: 1
            source_b:
              type: string
            contradiction_type:
              type: string
              enum:
              - direct
              - temporal
              - quantitative
              - qualitative
            confidence:
              type: string
              enum:
              - high
              - medium
              - low
            resolution:
              type: string
              minLength: 1
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - description: All contradiction_type values must be in [direct, temporal, quantitative,
      qualitative].
    method: Enum validation against schema.
  - description: All confidence values must be in [high, medium, low].
    method: Enum validation against schema.
  - description: statement_a and statement_b must be non-empty strings.
    method: String length check > 0.
  - description: source_a and source_b must reference documents present in inputs_used.
    method: Cross-reference against inputs_used array.
  - description: resolution must be non-empty for every contradiction.
    method: String length check > 0.
  - description: contradictions array must not contain duplicate pairs (same statement_a
      and statement_b regardless of order).
    method: Deduplication check by normalized pair comparison.
  math_checks: []
  evidence_checks:
  - description: Verify statement_a exists in source_a document.
    method: Substring search statement_a against source_a.
  - description: Verify statement_b exists in source_b document.
    method: Substring search statement_b against source_b.
  - description: Verify each reported contradiction is genuinely contradictory, not
      merely a paraphrase.
    method: Semantic review of statement pair by evaluator.
  - description: Verify no genuine contradictions were missed (check source documents
      for any unstated contradictions).
    method: Manual or automated comparison of source documents.
  flag_rules:
  - flag_id: false_positive_contradiction
    condition: statement pair is a paraphrase or restatement, not a genuine contradiction
    severity: honey
  - flag_id: invalid_contradiction_type
    condition: contradiction_type not in [direct, temporal, quantitative, qualitative]
    severity: honey
  - flag_id: invalid_confidence
    condition: confidence not in [high, medium, low]
    severity: honey
  - flag_id: fabricated_statement
    condition: statement_a or statement_b not found in respective source document
    severity: honey
  - flag_id: missing_resolution
    condition: resolution is empty or null
    severity: jelly
  - flag_id: duplicate_contradiction
    condition: same statement pair reported more than once
    severity: honey
  - flag_id: unreferenced_source
    condition: source_a or source_b not in inputs_used
    severity: honey
  - flag_id: self_check_false
    condition: any self_check boolean is false
    severity: jelly
  severity_mapping:
    honey: Minor error — false positive or fabricated statement in one contradiction
    jelly: Moderate error — missing resolution or structural issue
    propolis: Critical error — systemic false positives or missed genuine contradictions
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: evx_contradiction_detection_v1
    agent_summary: Found 3 contradictions across 2 documents
    inputs_used:
    - doc_1
    - doc_2
    missing_inputs: []
    claims: []
    calculations: []
    risks: []
    assumptions:
    - Near-identical statements with different timeframes counted as temporal, not
      direct
    open_questions: []
    contradictions:
    - statement_a: The company employs 450 staff members
      source_a: doc_1
      statement_b: Total headcount is 520 employees
      source_b: doc_2
      contradiction_type: quantitative
      confidence: high
      resolution: doc_1 is from Q1 2024, doc_2 is from Q3 2024; hiring occurred between
        periods
    - statement_a: Product X is our top seller
      source_a: doc_1
      statement_b: Product Y generates the most revenue
      source_b: doc_2
      contradiction_type: qualitative
      confidence: medium
      resolution: 'Different metrics: top seller by volume vs. revenue generator;
        may both be true'
    final_output: 'Detected 3 contradictions: 1 quantitative, 1 qualitative, 1 temporal'
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: evx_entity_extraction_v1
  name: Named Entity Extraction
  lane: evidence_extraction_eval
  version: '1.0'
  purpose: 'Evaluate the agent''s ability to extract named entities (people, organizations,
    locations, dates) from provided source documents with exact source references
    and position markers. Every extracted entity must be traceable to its origin.

    '
  operator_instructions: 'Provide the agent with 1-3 source documents (text, PDF-converted
    markdown, or HTML-converted text) containing a mix of named entities. Documents
    should contain at minimum 10 distinct entities across the four target types. Include
    edge cases such as abbreviated names, nested organizations, relative dates, and
    locations mentioned by context rather than explicit place names.

    '
  agent_prompt: "You are given one or more source documents. Your task is to extract\
    \ ALL named entities of the following types: person, organization, location, date.\n\
    For each entity found, return an object with exactly these fields: - \"type\"\
    : one of [\"person\", \"organization\", \"location\", \"date\"] - \"value\": the\
    \ exact text of the entity as it appears in the source - \"source_document\":\
    \ identifier of the document (use \"doc_1\", \"doc_2\", etc.) - \"position\":\
    \ an object with \"start_char\" (integer, 0-based) and \"end_char\" (integer)\n\
    Return ONLY a JSON object with this exact shape: {\n  \"assignment_id\": \"evx_entity_extraction_v1\"\
    ,\n  \"agent_summary\": \"<brief description of extraction results>\",\n  \"inputs_used\"\
    : [\"<list of document identifiers processed>\"],\n  \"missing_inputs\": [],\n\
    \  \"entities\": [\n    {\"type\": \"person\", \"value\": \"Jane Doe\", \"source_document\"\
    : \"doc_1\", \"position\": {\"start_char\": 42, \"end_char\": 50}}\n  ],\n  \"\
    claims\": [],\n  \"calculations\": [],\n  \"risks\": [],\n  \"assumptions\": [],\n\
    \  \"open_questions\": [],\n  \"final_output\": \"<summary of extraction>\",\n\
    \  \"self_check\": {\n    \"all_required_sections_completed\": true,\n    \"all_numbers_have_sources\"\
    : true,\n    \"assumptions_labeled\": true,\n    \"missing_inputs_disclosed\"\
    : true\n  }\n}\nRules: - Extract EVERY instance; do not deduplicate. - If source\
    \ documents are missing or empty, return missing_inputs. - Do not infer entities\
    \ not present in the text. - Position must be character-accurate against the provided\
    \ text. - If you cannot locate an entity's character position, set position to\
    \ null and note in assumptions.\n"
  required_inputs:
  - name: source_documents
    type: array_of_text
    description: One or more text documents to extract entities from.
    count: 1-3
  expected_outputs:
  - entities array with type, value, source_document, position
  - Missing inputs disclosed if applicable
  - Self-check object confirming completeness
  required_output_schema:
    type: object
    required:
    - assignment_id
    - entities
    - inputs_used
    - missing_inputs
    - self_check
    properties:
      assignment_id:
        type: string
        const: evx_entity_extraction_v1
      entities:
        type: array
        items:
          type: object
          required:
          - type
          - value
          - source_document
          - position
          properties:
            type:
              type: string
              enum:
              - person
              - organization
              - location
              - date
            value:
              type: string
              minLength: 1
            source_document:
              type: string
            position:
              type:
              - object
              - 'null'
              required:
              - start_char
              - end_char
              properties:
                start_char:
                  type: integer
                  minimum: 0
                end_char:
                  type: integer
                  minimum: 0
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - description: All entity types must be from the allowed enum [person, organization,
      location, date].
    method: Schema validation against required_output_schema.
  - description: Every entity value must be non-empty string.
    method: JSON property check value.length > 0.
  - description: Every entity must reference a source_document present in inputs_used.
    method: Cross-reference entities[].source_document against inputs_used array.
  - description: If no source documents provided, missing_inputs must be non-empty.
    method: Check missing_inputs array length > 0 when no inputs supplied.
  - description: Position end_char must be greater than or equal to start_char.
    method: For each entity with non-null position, assert end_char >= start_char.
  math_checks: []
  evidence_checks:
  - description: Random sample 20% of entities; verify value exists at stated character
      position in source document.
    method: Manual or automated spot-check of entity position accuracy.
  - description: Verify no hallucinated entities by checking that value text exists
      in at least one source document.
    method: String search each entity.value against all source_documents.
  flag_rules:
  - flag_id: hallucinated_entity
    condition: entity.value is NOT found in any source document
    severity: honey
  - flag_id: invalid_entity_type
    condition: entity.type is not in [person, organization, location, date]
    severity: honey
  - flag_id: missing_position
    condition: entity.position is null without explanation in assumptions
    severity: jelly
  - flag_id: empty_entity_value
    condition: entity.value is empty string or whitespace-only
    severity: honey
  - flag_id: invalid_position_range
    condition: entity.position.start_char > entity.position.end_char
    severity: honey
  - flag_id: unreferenced_source
    condition: entity.source_document not in inputs_used
    severity: honey
  - flag_id: missing_inputs_not_disclosed
    condition: inputs missing AND missing_inputs array is empty
    severity: propolis
  - flag_id: self_check_false
    condition: any self_check boolean is false
    severity: jelly
  severity_mapping:
    honey: Minor error — individual entity issue, does not invalidate full extraction
    jelly: Moderate error — structural omission or inaccuracy requiring correction
    propolis: Critical error — missing inputs not disclosed or output structurally
      invalid
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: evx_entity_extraction_v1
    agent_summary: Extracted 47 named entities across 2 source documents
    inputs_used:
    - doc_1
    - doc_2
    missing_inputs: []
    claims: []
    calculations: []
    risks: []
    assumptions:
    - Character positions based on UTF-8 encoding of provided text
    open_questions: []
    entities:
    - type: person
      value: Dr. Sarah Chen
      source_document: doc_1
      position:
        start_char: 156
        end_char: 170
    - type: organization
      value: Acme Corp
      source_document: doc_1
      position:
        start_char: 312
        end_char: 321
    - type: location
      value: Berlin
      source_document: doc_2
      position:
        start_char: 89
        end_char: 95
    - type: date
      value: March 15, 2024
      source_document: doc_2
      position:
        start_char: 205
        end_char: 219
    final_output: 'Extracted 47 entities: 12 persons, 8 organizations, 15 locations,
      12 dates'
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: evx_numerical_fact_extraction_v1
  name: Numerical Fact Extraction
  lane: evidence_extraction_eval
  version: '1.0'
  purpose: 'Evaluate the agent''s ability to extract all numerical facts from source
    documents, preserving units, surrounding context, source reference, and extraction
    confidence. Numerical facts must be machine-checkable and traceable to origin
    text.

    '
  operator_instructions: 'Provide 1-3 documents containing a variety of numerical
    facts (dollar amounts, percentages, counts, measurements, dates with numbers,
    ratios). Include at least 15 distinct numerical values. Mix formats (e.g., "$5M",
    "5 million", "5,000,000", "4.5%", "3x"). Include edge cases like ranges ("10-15%")
    and approximations ("approximately 500").

    '
  agent_prompt: "Extract every numerical fact from the provided source documents.\n\
    For each numerical fact, return an object with exactly these fields: - \"value\"\
    : the numeric value as a number (extract the primary number; for ranges, use the\
    \ midpoint or list both in context) - \"units\": the unit of measurement as a\
    \ string (e.g., \"USD\", \"percent\", \"years\", \"employees\", \"x\", \"ratio\"\
    , \"square_feet\") - \"context\": the surrounding sentence or phrase providing\
    \ meaning to the number (max 200 chars) - \"source_document\": identifier of the\
    \ document (\"doc_1\", \"doc_2\", etc.) - \"confidence\": one of [\"explicit\"\
    , \"inferred\", \"ambiguous\"] where:\n    - \"explicit\" = number appears directly\
    \ as a stated fact\n    - \"inferred\" = number derived from nearby text (e.g.,\
    \ \"$5M\" implies 5000000 USD)\n    - \"ambiguous\" = number's meaning is unclear\
    \ from context\n\nReturn ONLY a JSON object with this exact shape: {\n  \"assignment_id\"\
    : \"evx_numerical_fact_extraction_v1\",\n  \"agent_summary\": \"<brief description\
    \ of numerical facts extracted>\",\n  \"inputs_used\": [\"<document identifiers>\"\
    ],\n  \"missing_inputs\": [],\n  \"facts\": [\n    {\"value\": 5000000, \"units\"\
    : \"USD\", \"context\": \"Company revenue was $5M in FY2024\", \"source_document\"\
    : \"doc_1\", \"confidence\": \"inferred\"}\n  ],\n  \"claims\": [],\n  \"calculations\"\
    : [],\n  \"risks\": [],\n  \"assumptions\": [],\n  \"open_questions\": [],\n \
    \ \"final_output\": \"<summary>\",\n  \"self_check\": {\n    \"all_required_sections_completed\"\
    : true,\n    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\"\
    : true,\n    \"missing_inputs_disclosed\": true\n  }\n}\nRules: - Do NOT skip\
    \ any number appearing in the text. - value must be a JSON number (integer or\
    \ float), not a string. - units must be normalized (use \"USD\" not \"$\", \"\
    percent\" not \"%\"). - context must contain the original surrounding text, not\
    \ paraphrased. - If a number has multiple interpretations, list it once with confidence\
    \ \"ambiguous\" and explain in assumptions.\n"
  required_inputs:
  - name: source_documents
    type: array_of_text
    description: One or more text documents containing numerical facts.
    count: 1-3
  expected_outputs:
  - facts array with value, units, context, source_document, confidence
  - Normalized units
  - Confidence classification per fact
  - Self-check object
  required_output_schema:
    type: object
    required:
    - assignment_id
    - facts
    - inputs_used
    - missing_inputs
    - self_check
    properties:
      assignment_id:
        type: string
        const: evx_numerical_fact_extraction_v1
      facts:
        type: array
        items:
          type: object
          required:
          - value
          - units
          - context
          - source_document
          - confidence
          properties:
            value:
              type: number
            units:
              type: string
              minLength: 1
            context:
              type: string
              minLength: 1
            source_document:
              type: string
            confidence:
              type: string
              enum:
              - explicit
              - inferred
              - ambiguous
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - description: All fact values must be JSON numbers (not strings).
    method: Type-check facts[].value is number.
  - description: All confidence values must be in [explicit, inferred, ambiguous].
    method: Enum validation against schema.
  - description: All units must be non-empty strings.
    method: String length check > 0.
  - description: Every fact must reference a source_document present in inputs_used.
    method: Cross-reference facts[].source_document against inputs_used.
  - description: facts array must not be empty if source documents contain numbers.
    method: If source has numbers, assert facts.length > 0.
  - description: context field must not be empty.
    method: String length check > 0.
  math_checks:
  - description: Verify normalized values are arithmetically correct (e.g., "$5M"
      = 5000000).
    method: Spot-check facts[].value against original text context.
  - description: Verify percentage values are converted to numeric form (e.g., "4.5%"
      = 4.5, not 0.045).
    method: Spot-check facts[].value and facts[].units alignment.
  evidence_checks:
  - description: Random sample 20% of facts; verify context string exists in source
      document.
    method: Substring search context against source_documents.
  - description: Verify no hallucinated facts by checking context exists in at least
      one source document.
    method: String search each facts[].context against all source_documents.
  flag_rules:
  - flag_id: value_is_string
    condition: facts[].value is not a JSON number
    severity: honey
  - flag_id: missing_units
    condition: facts[].units is empty or null
    severity: jelly
  - flag_id: invalid_confidence
    condition: facts[].confidence not in [explicit, inferred, ambiguous]
    severity: honey
  - flag_id: hallucinated_fact
    condition: facts[].context not found in any source document
    severity: honey
  - flag_id: unreferenced_source
    condition: facts[].source_document not in inputs_used
    severity: honey
  - flag_id: empty_facts_array_with_numbers
    condition: source has numbers AND facts array is empty
    severity: propolis
  - flag_id: missing_inputs_not_disclosed
    condition: inputs missing AND missing_inputs array is empty
    severity: propolis
  - flag_id: self_check_false
    condition: any self_check boolean is false
    severity: jelly
  severity_mapping:
    honey: Minor error — individual fact issue, does not invalidate full extraction
    jelly: Moderate error — normalization or confidence misclassification
    propolis: Critical error — empty extraction when numbers exist or missing inputs
      not disclosed
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: evx_numerical_fact_extraction_v1
    agent_summary: Extracted 23 numerical facts from 2 documents
    inputs_used:
    - doc_1
    - doc_2
    missing_inputs: []
    claims: []
    calculations: []
    risks: []
    assumptions:
    - Normalized all currency to USD
    - Percentages stored as numeric percent values, not decimals
    open_questions: []
    facts:
    - value: 5000000
      units: USD
      context: The company reported revenue of $5M for fiscal year 2024
      source_document: doc_1
      confidence: inferred
    - value: 4.5
      units: percent
      context: Interest rate increased by 4.5% year-over-year
      source_document: doc_1
      confidence: explicit
    - value: 127
      units: employees
      context: Headcount grew to 127 full-time employees
      source_document: doc_2
      confidence: explicit
    final_output: 'Extracted 23 numerical facts: 8 currency, 6 percentages, 4 counts,
      5 measurements'
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: evx_temporal_fact_sequencing_v1
  name: Temporal Fact Sequencing
  lane: evidence_extraction_eval
  version: '1.0'
  purpose: 'Evaluate the agent''s ability to extract dated facts from documents, sequence
    them chronologically, and identify temporal gaps or missing dates. The agent must
    parse various date formats and associate each date with the correct event.

    '
  operator_instructions: 'Provide 1-3 documents containing dated events in non-chronological
    order. Include at least 8-12 distinct dated facts using varied date formats (e.g.,
    "Jan 15, 2023", "Q2 2024", "last Tuesday", "2021-03-10", "the following month").
    Include at least one relative date that requires reference point inference and
    at least two events with imprecise dates. Include one intentional chronological
    gap (>6 months).

    '
  agent_prompt: "Extract all dated facts from the provided source documents and sequence\
    \ them chronologically.\nFor each dated fact, return an object with exactly these\
    \ fields: - \"date\": the date in ISO 8601 format (YYYY-MM-DD) if parseable; for\
    \ ranges use the start date; for imprecise dates use the earliest possible date;\
    \ for relative dates, resolve based on context - \"date_original\": the original\
    \ date text as it appeared in the document - \"date_precision\": one of [\"exact\"\
    , \"month_only\", \"quarter_only\", \"year_only\", \"relative\", \"range_start\"\
    , \"ambiguous\"] - \"event\": a brief description of the event associated with\
    \ the date (max 150 chars) - \"source_document\": identifier of the document (\"\
    doc_1\", \"doc_2\", etc.) - \"gap_flag\": boolean — set to true if this event\
    \ marks the start or end of a chronological gap > 6 months from the previous/next\
    \ event\nAdditionally, compute and return: - \"timeline_gaps\": an array of objects\
    \ describing identified gaps, each with \"gap_start_date\", \"gap_end_date\",\
    \ \"gap_duration_months\" (number), and \"description\"\nReturn ONLY a JSON object\
    \ with this exact shape: {\n  \"assignment_id\": \"evx_temporal_fact_sequencing_v1\"\
    ,\n  \"agent_summary\": \"<summary of timeline extraction>\",\n  \"inputs_used\"\
    : [\"<document identifiers>\"],\n  \"missing_inputs\": [],\n  \"timeline\": [\n\
    \    {\"date\": \"2024-03-15\", \"date_original\": \"March 15, 2024\", \"date_precision\"\
    : \"exact\", \"event\": \"Product launch\", \"source_document\": \"doc_1\", \"\
    gap_flag\": false}\n  ],\n  \"timeline_gaps\": [\n    {\"gap_start_date\": \"\
    2023-06-01\", \"gap_end_date\": \"2024-01-15\", \"gap_duration_months\": 7.5,\
    \ \"description\": \"No events recorded between June 2023 and January 2024\"}\n\
    \  ],\n  \"claims\": [],\n  \"calculations\": [],\n  \"risks\": [],\n  \"assumptions\"\
    : [],\n  \"open_questions\": [],\n  \"final_output\": \"<summary>\",\n  \"self_check\"\
    : {\n    \"all_required_sections_completed\": true,\n    \"all_numbers_have_sources\"\
    : true,\n    \"assumptions_labeled\": true,\n    \"missing_inputs_disclosed\"\
    : true\n  }\n}\nRules: - Timeline must be sorted chronologically by date (ascending).\
    \ - Extract EVERY dated event; do not skip any. - Normalize all dates to ISO 8601\
    \ YYYY-MM-DD format. - For relative dates (\"last month\", \"the following year\"\
    ), resolve using the nearest reference date in the document. - gap_flag should\
    \ be true for events immediately before or after a >6-month gap. - timeline_gaps\
    \ must contain all chronological gaps exceeding 6 months. - If a date is unresolvable,\
    \ use \"date\": null, \"date_precision\": \"ambiguous\", and explain in assumptions.\n"
  required_inputs:
  - name: source_documents
    type: array_of_text
    description: One or more documents containing dated events.
    count: 1-3
  expected_outputs:
  - timeline array sorted chronologically with date, date_original, date_precision,
    event, source_document, gap_flag
  - timeline_gaps array describing all >6-month gaps
  - Normalized ISO 8601 dates
  - Self-check object
  required_output_schema:
    type: object
    required:
    - assignment_id
    - timeline
    - timeline_gaps
    - inputs_used
    - missing_inputs
    - self_check
    properties:
      assignment_id:
        type: string
        const: evx_temporal_fact_sequencing_v1
      timeline:
        type: array
        items:
          type: object
          required:
          - date
          - date_original
          - date_precision
          - event
          - source_document
          - gap_flag
          properties:
            date:
              type:
              - string
              - 'null'
              pattern: ^\d{4}-\d{2}-\d{2}$
            date_original:
              type: string
              minLength: 1
            date_precision:
              type: string
              enum:
              - exact
              - month_only
              - quarter_only
              - year_only
              - relative
              - range_start
              - ambiguous
            event:
              type: string
              minLength: 1
            source_document:
              type: string
            gap_flag:
              type: boolean
      timeline_gaps:
        type: array
        items:
          type: object
          required:
          - gap_start_date
          - gap_end_date
          - gap_duration_months
          - description
          properties:
            gap_start_date:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
            gap_end_date:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
            gap_duration_months:
              type: number
              minimum: 0
            description:
              type: string
              minLength: 1
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - description: Timeline array must be sorted chronologically by date (ascending).
    method: Iterate timeline and assert each date >= previous date (nulls handled
      gracefully).
  - description: All date_precision values must be in [exact, month_only, quarter_only,
      year_only, relative, range_start, ambiguous].
    method: Enum validation against schema.
  - description: All non-null dates must match ISO 8601 YYYY-MM-DD pattern.
    method: Regex validation ^\d{4}-\d{2}-\d{2}$.
  - description: Every timeline entry must reference a source_document present in
      inputs_used.
    method: Cross-reference timeline[].source_document against inputs_used.
  - description: timeline_gaps gap_duration_months must equal the month difference
      between gap_start_date and gap_end_date (approximate is acceptable).
    method: Date arithmetic verification.
  - description: timeline_gaps entries must only exist if there is a chronological
      gap > 6 months.
    method: Assert gap_duration_months > 6 for all timeline_gaps entries.
  - description: gap_flag must be true for events bounding a gap listed in timeline_gaps.
    method: Cross-reference gap_flag true events against timeline_gaps boundaries.
  math_checks:
  - description: Verify gap_duration_months is arithmetically correct from gap_start_date
      and gap_end_date.
    method: Calculate months between dates and compare to stated gap_duration_months.
  - description: Verify relative date resolutions are mathematically correct (e.g.,
      "the following month" from "2024-01-15" = "2024-02-15").
    method: Recalculate relative dates from context and compare.
  evidence_checks:
  - description: Random sample 25% of timeline entries; verify event description is
      supported by source text.
    method: Substring or semantic search event against source_documents.
  - description: Verify timeline_gaps correspond to actual gaps in the extracted timeline
      (not fabricated).
    method: Recalculate gaps from timeline array and compare to timeline_gaps.
  flag_rules:
  - flag_id: timeline_not_sorted
    condition: timeline is not in chronological order by date
    severity: honey
  - flag_id: invalid_date_precision
    condition: date_precision not in allowed enum
    severity: honey
  - flag_id: invalid_date_format
    condition: non-null date does not match YYYY-MM-DD pattern
    severity: honey
  - flag_id: fabricated_event
    condition: event description not found in source document
    severity: honey
  - flag_id: incorrect_gap_duration
    condition: gap_duration_months is off by >1 month from actual date difference
    severity: jelly
  - flag_id: missing_gap_flag
    condition: timeline event bounds a gap but gap_flag is false
    severity: jelly
  - flag_id: unreferenced_source
    condition: timeline[].source_document not in inputs_used
    severity: honey
  - flag_id: self_check_false
    condition: any self_check boolean is false
    severity: jelly
  severity_mapping:
    honey: Minor error — single event issue or date format problem
    jelly: Moderate error — gap calculation or flagging inaccuracy
    propolis: Critical error — timeline fundamentally misordered or gaps completely
      missed
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: evx_temporal_fact_sequencing_v1
    agent_summary: Extracted 10 dated events, identified 1 chronological gap
    inputs_used:
    - doc_1
    - doc_2
    missing_inputs: []
    claims: []
    calculations: []
    risks: []
    assumptions:
    - Relative date 'the following month' resolved based on preceding date in same
      paragraph
    - Quarter references mapped to first day of quarter
    open_questions: []
    timeline:
    - date: '2023-01-10'
      date_original: January 10, 2023
      date_precision: exact
      event: Company founded
      source_document: doc_1
      gap_flag: false
    - date: '2023-06-15'
      date_original: mid-June 2023
      date_precision: month_only
      event: Series A funding closed
      source_document: doc_1
      gap_flag: true
    - date: '2024-02-01'
      date_original: February 2024
      date_precision: month_only
      event: Product beta launched
      source_document: doc_2
      gap_flag: true
    - date: '2024-03-15'
      date_original: March 15, 2024
      date_precision: exact
      event: Public launch event
      source_document: doc_2
      gap_flag: false
    timeline_gaps:
    - gap_start_date: '2023-06-15'
      gap_end_date: '2024-02-01'
      gap_duration_months: 7.5
      description: No dated events between June 2023 and February 2024 (>6 month gap)
    final_output: 10 events sequenced; 1 gap exceeding 6 months identified between
      June 2023 and February 2024
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: fin_compound_interest_roi_v1
  name: Compound Interest and ROI
  lane: financial_math_reasoning_eval
  version: '1.0'
  purpose: Calculate compound interest (future value) and Return on Investment (ROI)
    from principal, rate, time period, and investment values. These are fundamental
    investment metrics that must be computed with all inputs and steps disclosed.
  operator_instructions: Provide the agent with principal, annual interest rate, time
    period, initial investment, and final value. The agent must compute compound interest
    (future value) and ROI with exact formulas, show all inputs and steps, and return
    structured JSON.
  agent_prompt: "You are calculating Compound Interest (Future Value) and Return on\
    \ Investment (ROI).\n\nGiven the financial inputs, compute the following with\
    \ exact formulas:\n\n1. Compound Interest (Future Value) = Principal * (1 + Rate)\
    \ ^ Time\n2. Total Interest Earned = Future Value - Principal\n3. ROI = ((Final\
    \ Value - Initial Investment) / Initial Investment) * 100\n\nReturn a single JSON\
    \ object with this exact structure:\n{\n  \"assignment_id\": \"fin_compound_interest_roi_v1\"\
    ,\n  \"agent_summary\": \"One sentence summary\",\n  \"inputs_used\": [\"principal\"\
    , \"annual_rate\", \"time_years\", \"initial_investment\", \"final_value\"],\n\
    \  \"missing_inputs\": [\"any missing inputs\"],\n  \"claims\": [\n    {\"claim\"\
    : \"\", \"evidence_reference\": \"\", \"confidence\": \"provided | inferred |\
    \ missing\"}\n  ],\n  \"calculations\": [\n    {\n      \"name\": \"compound_interest_future_value\"\
    ,\n      \"formula\": \"Principal * (1 + Rate) ^ Time\",\n      \"inputs\": {\"\
    principal\": 0, \"annual_rate\": 0, \"time_years\": 0},\n      \"result\": 0,\n\
    \      \"units\": \"currency\",\n      \"assumptions\": []\n    },\n    {\n  \
    \    \"name\": \"total_interest_earned\",\n      \"formula\": \"Future Value -\
    \ Principal\",\n      \"inputs\": {\"future_value\": 0, \"principal\": 0},\n \
    \     \"result\": 0,\n      \"units\": \"currency\",\n      \"assumptions\": []\n\
    \    },\n    {\n      \"name\": \"roi\",\n      \"formula\": \"((Final Value -\
    \ Initial Investment) / Initial Investment) * 100\",\n      \"inputs\": {\"final_value\"\
    : 0, \"initial_investment\": 0},\n      \"result\": 0,\n      \"units\": \"percent\"\
    ,\n      \"assumptions\": []\n    }\n  ],\n  \"risks\": [\n    {\"risk\": \"\"\
    , \"severity\": \"low | medium | high\", \"evidence_reference\": \"\"}\n  ],\n\
    \  \"assumptions\": [],\n  \"open_questions\": [],\n  \"final_output\": \"PASS\
    \ or FAIL\",\n  \"self_check\": {\n    \"all_required_sections_completed\": true,\n\
    \    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\": true,\n\
    \    \"missing_inputs_disclosed\": true\n  }\n}\n\nRules:\n- ALL input values\
    \ must be echoed in each calculation's inputs sub-object\n- result must be a numeric\
    \ value (not a string)\n- annual_rate must be in decimal form (e.g., 0.07 for\
    \ 7%)\n- time_years must be a positive number\n- initial_investment must not be\
    \ zero (division by zero in ROI)\n- final_output is PASS if all 3 calculations\
    \ are present with numeric results AND initial_investment != 0\n- final_output\
    \ is FAIL if initial_investment == 0\n- Show formulas exactly as specified\n-\
    \ compound_interest_future_value and total_interest_earned are in currency units\n\
    - roi is expressed as a percentage\n\nReturn only the JSON. No markdown fences,\
    \ no prose.\n"
  required_inputs:
  - name: principal
    type: number
    description: Initial principal amount for compound interest
    required: true
  - name: annual_rate
    type: number
    description: Annual interest rate as decimal (e.g., 0.07 for 7%)
    required: true
  - name: time_years
    type: number
    description: Time period in years
    required: true
  - name: initial_investment
    type: number
    description: Initial investment amount for ROI calculation
    required: true
  - name: final_value
    type: number
    description: Final value of the investment for ROI calculation
    required: true
  expected_outputs:
  - calculations array with compound_interest_future_value, total_interest_earned,
    roi
  - Each calculation must have name, formula, inputs, result (numeric), units, assumptions
  - final_output PASS or FAIL
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - calculations
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
    properties:
      assignment_id:
        type: string
        const: fin_compound_interest_roi_v1
      agent_summary:
        type: string
        minLength: 1
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      claims:
        type: array
        items:
          type: object
          required:
          - claim
          - evidence_reference
          - confidence
          properties:
            claim:
              type: string
            evidence_reference:
              type: string
            confidence:
              enum:
              - provided
              - inferred
              - missing
      calculations:
        type: array
        minItems: 3
        items:
          type: object
          required:
          - name
          - formula
          - inputs
          - result
          - units
          - assumptions
          properties:
            name:
              type: string
            formula:
              type: string
            inputs:
              type: object
            result:
              type: number
            units:
              type: string
            assumptions:
              type: array
              items:
                type: string
      risks:
        type: array
        items:
          type: object
          required:
          - risk
          - severity
          - evidence_reference
          properties:
            risk:
              type: string
            severity:
              enum:
              - low
              - medium
              - high
            evidence_reference:
              type: string
      assumptions:
        type: array
        items:
          type: string
      open_questions:
        type: array
        items:
          type: string
      final_output:
        type: string
        enum:
        - PASS
        - FAIL
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
        properties:
          all_required_sections_completed:
            type: boolean
            const: true
          all_numbers_have_sources:
            type: boolean
            const: true
          assumptions_labeled:
            type: boolean
            const: true
          missing_inputs_disclosed:
            type: boolean
            const: true
  deterministic_checks:
  - description: Must have exactly 3 calculations
    condition: calculations.length == 3
    pass_on_true: true
  - description: All calculation results must be numeric
    condition: all calc in calculations have typeof calc.result == "number"
    pass_on_true: true
  - description: Future value must equal principal * (1 + rate) ^ time
    condition: abs(fv_result - (principal * pow(1 + annual_rate, time_years))) < 0.01
    pass_on_true: true
  - description: Total interest must equal future value minus principal
    condition: abs(interest_result - (fv_result - principal)) < 0.01
    pass_on_true: true
  - description: ROI must equal ((final - initial) / initial) * 100
    condition: abs(roi_result - ((final_value - initial_investment) / initial_investment
      * 100)) < 0.01
    pass_on_true: true
  - description: Initial investment must not be zero
    condition: initial_investment != 0
    pass_on_true: true
  math_checks:
  - formula_id: compound_interest_formula
    description: Future Value = Principal * (1 + Rate) ^ Time
    formula: future_value = principal * (1 + annual_rate) ^ time_years
    expected_precision: 0.01
    variables:
    - name: principal
      type: number
    - name: annual_rate
      type: number
    - name: time_years
      type: number
    result_field: calculations[?name=='compound_interest_future_value'].result
  - formula_id: total_interest_formula
    description: Total Interest = Future Value - Principal
    formula: total_interest = future_value - principal
    expected_precision: 0.01
    variables:
    - name: future_value
      type: number
    - name: principal
      type: number
    result_field: calculations[?name=='total_interest_earned'].result
  - formula_id: roi_formula
    description: ROI = ((Final Value - Initial Investment) / Initial Investment) *
      100
    formula: roi = ((final_value - initial_investment) / initial_investment) * 100
    expected_precision: 0.01
    variables:
    - name: final_value
      type: number
    - name: initial_investment
      type: number
    result_field: calculations[?name=='roi'].result
  evidence_checks:
  - check_id: all_inputs_echoed
    description: All five input values must appear across the calculations' inputs
      sub-objects
    evidence_must_match_claim: true
  - check_id: formulas_exact_match
    description: All three formulas must match the exact specified formula strings
    required: true
  flag_rules:
  - flag_id: missing_calculation
    condition: calculations.length < 3
    severity: propolis
    message: Not all 3 required calculations are present
  - flag_id: non_numeric_result
    condition: any calculation has non-numeric result
    severity: propolis
    message: One or more calculation results are not numeric
  - flag_id: future_value_mismatch
    condition: abs(fv_calc - (principal * (1 + annual_rate) ^ time_years)) >= 0.01
    severity: propolis
    message: Compound interest future value does not match formula
  - flag_id: interest_mismatch
    condition: abs(interest_calc - (fv_calc - principal)) >= 0.01
    severity: propolis
    message: Total interest earned does not match future value minus principal
  - flag_id: roi_mismatch
    condition: abs(roi_calc - ((final_value - initial_investment) / initial_investment
      * 100)) >= 0.01
    severity: propolis
    message: ROI calculation does not match formula
  - flag_id: zero_initial_investment
    condition: initial_investment == 0
    severity: honey
    message: Initial investment is zero — ROI is undefined
  - flag_id: false_pass_zero_investment
    condition: final_output == "PASS" AND initial_investment == 0
    severity: propolis
    message: final_output is PASS but initial investment is zero
  severity_mapping:
    honey: Minor issue — initial investment is zero (ROI undefined)
    jelly: Moderate issue — missing calculation metadata or incomplete assumptions
    propolis: Critical issue — formula result mismatch, non-numeric results, missing
      calculations, or false PASS
  receipt_type: eval_receipt
  recommended_human_review: false
  sample_submission_shape:
    assignment_id: fin_compound_interest_roi_v1
    agent_summary: Future value is $1,225.04 after 3 years at 7%; ROI is 25%.
    inputs_used:
    - principal
    - annual_rate
    - time_years
    - initial_investment
    - final_value
    missing_inputs: []
    claims:
    - claim: Future value after 3 years is $1,225.04
      evidence_reference: 'Calculation: 1000 * (1.07) ^ 3 = 1225.04'
      confidence: provided
    - claim: ROI is 25%
      evidence_reference: 'Calculation: ((125000 - 100000) / 100000) * 100 = 25%'
      confidence: provided
    calculations:
    - name: compound_interest_future_value
      formula: Principal * (1 + Rate) ^ Time
      inputs:
        principal: 1000
        annual_rate: 0.07
        time_years: 3
      result: 1225.04
      units: USD
      assumptions:
      - Annual compounding
    - name: total_interest_earned
      formula: Future Value - Principal
      inputs:
        future_value: 1225.04
        principal: 1000
      result: 225.04
      units: USD
      assumptions: []
    - name: roi
      formula: ((Final Value - Initial Investment) / Initial Investment) * 100
      inputs:
        final_value: 125000
        initial_investment: 100000
      result: 25.0
      units: percent
      assumptions: []
    risks: []
    assumptions:
    - Interest compounds annually
    - ROI period matches investment horizon
    open_questions: []
    final_output: PASS
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: fin_ebitda_npv_v1
  name: EBITDA and NPV Calculation
  lane: financial_math_reasoning_eval
  version: '1.0'
  purpose: Calculate EBITDA from its components (revenue, COGS, operating expenses,
    depreciation, amortization) and compute Net Present Value from a cash flow series
    and discount rate. These are core financial analysis computations.
  operator_instructions: Provide the agent with EBITDA components and a cash flow
    series with discount rate. The agent must compute EBITDA, then NPV using the discount
    rate, show all component values and intermediate steps, and return structured
    JSON.
  agent_prompt: "You are calculating EBITDA and Net Present Value (NPV).\n\nGiven\
    \ the financial inputs, compute the following with exact formulas:\n\nPART 1 —\
    \ EBITDA:\n1. EBITDA = Revenue - COGS - Operating Expenses + Depreciation + Amortization\n\
    \   (or equivalently: EBITDA = Operating Income + Depreciation + Amortization)\n\
    \nPART 2 — NPV:\n2. For each cash flow in the cash_flows array:\n   discounted_cf\
    \ = cash_flow / ((1 + discount_rate) ^ year)\n3. NPV = sum of all discounted_cf\
    \ values\n\nReturn a single JSON object with this exact structure:\n{\n  \"assignment_id\"\
    : \"fin_ebitda_npv_v1\",\n  \"agent_summary\": \"One sentence summary\",\n  \"\
    inputs_used\": [\"revenue\", \"cogs\", \"operating_expenses\", \"depreciation\"\
    , \"amortization\", \"cash_flows\", \"discount_rate\"],\n  \"missing_inputs\"\
    : [\"any missing inputs\"],\n  \"claims\": [\n    {\"claim\": \"\", \"evidence_reference\"\
    : \"\", \"confidence\": \"provided | inferred | missing\"}\n  ],\n  \"calculations\"\
    : [\n    {\n      \"name\": \"ebitda\",\n      \"formula\": \"Revenue - COGS -\
    \ Operating Expenses + Depreciation + Amortization\",\n      \"inputs\": {\"revenue\"\
    : 0, \"cogs\": 0, \"operating_expenses\": 0, \"depreciation\": 0, \"amortization\"\
    : 0},\n      \"result\": 0,\n      \"units\": \"currency\",\n      \"assumptions\"\
    : []\n    },\n    {\n      \"name\": \"npv\",\n      \"formula\": \"SUM(cash_flow_t\
    \ / (1 + discount_rate) ^ t) for t = 0 to n\",\n      \"inputs\": {\"cash_flows\"\
    : [], \"discount_rate\": 0},\n      \"intermediate_steps\": [{\"year\": 0, \"\
    cash_flow\": 0, \"discount_factor\": 0, \"discounted_cf\": 0}],\n      \"result\"\
    : 0,\n      \"units\": \"currency\",\n      \"assumptions\": []\n    }\n  ],\n\
    \  \"risks\": [\n    {\"risk\": \"\", \"severity\": \"low | medium | high\", \"\
    evidence_reference\": \"\"}\n  ],\n  \"assumptions\": [],\n  \"open_questions\"\
    : [],\n  \"final_output\": \"PASS or FAIL\",\n  \"self_check\": {\n    \"all_required_sections_completed\"\
    : true,\n    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\"\
    : true,\n    \"missing_inputs_disclosed\": true\n  }\n}\n\nRules:\n- ALL input\
    \ values must be echoed in each calculation's inputs sub-object\n- result must\
    \ be a numeric value (not a string)\n- The NPV calculation MUST include intermediate_steps\
    \ showing year-by-year discounted cash flows\n- Year 0 cash flow is typically\
    \ negative (initial investment) and has discount_factor = 1.0\n- discount_rate\
    \ must be in decimal form (e.g., 0.10 for 10%)\n- final_output is PASS if both\
    \ EBITDA and NPV have numeric results with intermediate_steps for NPV\n- final_output\
    \ is FAIL if discount_rate < 0 or if intermediate_steps are missing\n- Show formulas\
    \ exactly as specified\n\nReturn only the JSON. No markdown fences, no prose.\n"
  required_inputs:
  - name: revenue
    type: number
    description: Total revenue
    required: true
  - name: cogs
    type: number
    description: Cost of goods sold
    required: true
  - name: operating_expenses
    type: number
    description: Total operating expenses
    required: true
  - name: depreciation
    type: number
    description: Depreciation expense
    required: true
  - name: amortization
    type: number
    description: Amortization expense
    required: true
  - name: cash_flows
    type: array
    description: Array of cash flows by year (index 0 = year 0 initial investment,
      typically negative)
    required: true
  - name: discount_rate
    type: number
    description: Discount rate as decimal (e.g., 0.10 for 10%)
    required: true
  expected_outputs:
  - calculations array with ebitda and npv entries
  - ebitda calculation with all component inputs and numeric result
  - npv calculation with cash_flows, discount_rate, intermediate_steps, and numeric
    result
  - final_output PASS or FAIL
  required_output_schema:
