    / total_required_fields - source_present (boolean): whether source field is present
    and non-empty - source_value (string or null): the actual source value - license_present
    (boolean): whether license field is present and non-empty - license_value (string
    or null): the actual license value - license_osi_approved (boolean or null): whether
    license is OSI-approved open source - hash_manifest_present (boolean): whether
    hash manifest is present - hash_manifest_match (boolean or null): whether computed
    hash matches declared hash (null if cannot verify) - creation_date_present (boolean):
    whether creation_date field is present and non-empty - creation_date_value (string
    or null): the actual creation date - missing_provenance_fields (list of strings):
    required fields that are missing Each of the 5 required fields (source, license,
    hash_manifest, creation_date, data_quality_statement) must be checked. Return
    provenance_completeness_rate as a number. List every missing field.

    '
  required_inputs:
  - dataset_metadata_or_data_card
  - expected_schema_or_requirements
  - computed_hash_optional
  expected_outputs:
  - provenance_completeness_rate
  - source_present
  - source_value
  - license_present
  - license_value
  - hash_manifest_present
  - hash_manifest_match
  - creation_date_present
  - creation_date_value
  - missing_provenance_fields
  required_output_schema:
    type: object
    required:
    - assignment_id
    - provenance_completeness_rate
    - source_present
    - license_present
    - hash_manifest_present
    - creation_date_present
    - missing_provenance_fields
    - claims
    - self_check
  deterministic_checks:
  - check_id: completeness_rate_range
    description: provenance_completeness_rate must be between 0.0 and 1.0
    assertion: 0.0 <= result.provenance_completeness_rate <= 1.0
  - check_id: missing_fields_consistent
    description: Any field with _present == false must appear in missing_provenance_fields
    assertion: all(f in result.missing_provenance_fields for f in ['source','license','hash_manifest','creation_date','data_quality_statement']
      if not result.get(f+'_present', True))
  - check_id: completeness_rate_formula
    description: Rate must equal present fields divided by 5
    assertion: result.provenance_completeness_rate == (5 - len(result.missing_provenance_fields))
      / 5.0
  math_checks:
  - formula_id: provenance_completeness_rate
    formula: present_required_fields / 5
    description: Fraction of provenance fields present out of 5 required
    output_field: provenance_completeness_rate
  evidence_checks:
  - evidence_field: source_value
    description: Must quote actual source string found in metadata
    required: true
  - evidence_field: license_value
    description: Must quote actual license string found in metadata
    required: true
  - evidence_field: hash_manifest_match
    description: If computed_hash provided, must verify match
    required: false
  flag_rules:
  - flag_id: missing_source
    condition: source_present == false
    severity: high
    description: Dataset source is missing
  - flag_id: missing_license
    condition: license_present == false
    severity: high
    description: Dataset license is missing
  - flag_id: hash_manifest_missing
    condition: hash_manifest_present == false
    severity: medium
    description: Hash manifest is missing
  - flag_id: hash_mismatch
    condition: hash_manifest_match == false
    severity: high
    description: Computed hash does not match declared hash
  - flag_id: missing_creation_date
    condition: creation_date_present == false
    severity: medium
    description: Creation date is missing
  severity_mapping:
    honey: All 5 provenance fields present, hash matches
    jelly: 1 provenance field missing, or hash cannot be verified
    propolis: 2+ provenance fields missing, or hash mismatch, or license missing
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: dataset_provenance_completeness_v1
    provenance_completeness_rate: 0.8
    source_present: true
    source_value: https://example.com/dataset
    license_present: true
    license_value: MIT
    license_osi_approved: true
    hash_manifest_present: true
    hash_manifest_match: null
    creation_date_present: false
    creation_date_value: null
    missing_provenance_fields:
    - creation_date
    - data_quality_statement
- assignment_id: dataset_schema_validation_v1
  name: Dataset Schema Validation
  lane: dataset_quality_eval
  version: '1.0'
  purpose: Validate that a dataset's actual schema matches its declared specification
    including field names, types, and required fields.
  operator_instructions: Provide the dataset path or sample and the declared schema
    specification. Agent must compare each column/field against specification and
    report compliance.
  agent_prompt: 'You are evaluating a dataset''s schema compliance. REQUIRED OUTPUT:
    Return a JSON object with these exact fields: - assignment_id (string): use "dataset_schema_validation_v1"
    - agent_summary (string): summary of findings - inputs_used (list of strings):
    inputs you used - missing_inputs (list of strings): any missing inputs - claims
    (list of objects): each with claim (string), evidence_reference (string), confidence
    (one of: "provided", "inferred", "missing") - calculations (list of objects):
    each with name, formula, inputs (object), result (number or null), units (string),
    assumptions (list of strings) - risks (list of objects): each with risk (string),
    severity ("low"|"medium"|"high"), evidence_reference (string) - assumptions (list
    of strings) - open_questions (list of strings) - final_output (string): your conclusion
    - self_check (object): all_required_sections_completed (boolean), all_numbers_have_sources
    (boolean), assumptions_labeled (boolean), missing_inputs_disclosed (boolean) Also
    include these schema-specific fields: - schema_compliance_rate (number between
    0 and 1) - field_checks (list of objects): each with field_name (string), declared_type
    (string), actual_type (string), compliant (boolean) - missing_required_fields
    (list of strings) - extra_fields_detected (list of strings) Compute schema_compliance_rate
    as: compliant_field_count / total_required_fields. Return as a number. If data
    is missing, set missing_inputs and flag the issue.

    '
  required_inputs:
  - dataset_sample_or_path
  - declared_schema_specification
  expected_outputs:
  - schema_compliance_rate
  - field_checks
  - missing_required_fields
  - extra_fields_detected
  - compliance_summary
  required_output_schema:
    type: object
    required:
    - assignment_id
    - schema_compliance_rate
    - field_checks
    - missing_required_fields
    - extra_fields_detected
    - claims
    - self_check
  deterministic_checks:
  - check_id: schema_rate_between_0_and_1
    description: schema_compliance_rate must be a float between 0.0 and 1.0 inclusive
    assertion: result.schema_compliance_rate >= 0.0 and result.schema_compliance_rate
      <= 1.0
  - check_id: all_required_fields_accounted
    description: Every field in declared_schema must appear in field_checks
    assertion: len(result.field_checks) >= len(required_fields_from_input)
  - check_id: missing_fields_listed
    description: Any non-compliant required field must be in missing_required_fields
    assertion: all(not f.compliant for f in result.field_checks if f.field_name in
      required_fields) implies f.field_name in result.missing_required_fields
  math_checks:
  - formula_id: schema_compliance_rate
    formula: compliant_field_count / total_required_fields
    description: Fraction of required fields that match declared type
    output_field: schema_compliance_rate
  evidence_checks:
  - evidence_field: field_checks
    description: Each field check must reference a specific field from the declared
      schema
    required: true
  - evidence_field: actual_type
    description: Must report actual detected type, not just boolean
    required: true
  flag_rules:
  - flag_id: schema_compliance_below_100
    condition: schema_compliance_rate < 1.0
    severity: medium
    description: Schema is not fully compliant
  - flag_id: missing_required_field
    condition: len(missing_required_fields) > 0
    severity: high
    description: One or more required fields are missing or non-compliant
  - flag_id: extra_fields_present
    condition: len(extra_fields_detected) > 0
    severity: low
    description: Undeclared fields detected in dataset
  severity_mapping:
    honey: Schema fully compliant (100%) with no extra fields
    jelly: Schema partially compliant (>=80% but <100%) or has extra fields only
    propolis: Schema compliance below 80% or any required field missing
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: dataset_schema_validation_v1
    schema_compliance_rate: 0.95
    field_checks:
    - field_name: user_id
      declared_type: int
      actual_type: int
      compliant: true
    - field_name: signup_date
      declared_type: date
      actual_type: string
      compliant: false
    missing_required_fields:
    - signup_date
    extra_fields_detected:
    - unnamed_col_12
    claims: []
    self_check:
      all_required_sections_completed: true
- assignment_id: dataset_train_test_integrity_v1
  name: Train/Test Split Integrity
  lane: dataset_quality_eval
  version: '1.0'
  purpose: Verify there is no data leakage between train and test sets. Confirm actual
    split ratios are within 5% of declared ratios.
  operator_instructions: Provide train and test datasets, or their row identifiers.
    Agent must check for overlap, compute actual split ratio, and compare against
    declared ratio.
  agent_prompt: 'You are verifying train/test split integrity. REQUIRED OUTPUT: Return
    a JSON object with these exact fields: - assignment_id (string): use "dataset_train_test_integrity_v1"
    - agent_summary (string) - inputs_used (list of strings) - missing_inputs (list
    of strings) - claims (list of objects): claim, evidence_reference, confidence
    ("provided"|"inferred"|"missing") - calculations (list of objects): name, formula,
    inputs, result, units, assumptions - risks (list of objects): risk, severity ("low"|"medium"|"high"),
    evidence_reference - assumptions (list of strings) - open_questions (list of strings)
    - final_output (string) - self_check (object): all_required_sections_completed
    (boolean), all_numbers_have_sources (boolean), assumptions_labeled (boolean),
    missing_inputs_disclosed (boolean) Also include: - train_rows (integer) - test_rows
    (integer) - total_rows (integer) - actual_train_ratio (number): train_rows / total_rows
    - declared_train_ratio (number or null) - ratio_difference (number or null): abs(actual_train_ratio
    - declared_train_ratio) - ratio_within_tolerance (boolean): ratio_difference <=
    0.05, or true if declared_train_ratio is null - overlap_detected (boolean): whether
    any rows appear in both train and test - overlap_count (integer or null): number
    of overlapping rows, 0 if none - overlap_percentage (number or null): overlap_count
    / total_rows - leakage_flag (boolean): true if overlap_detected or not ratio_within_tolerance
    Compute actual_train_ratio as train_rows / total_rows. Compute ratio_difference
    as abs(actual_train_ratio - declared_train_ratio) if declared_train_ratio is provided.
    Flag leakage_flag as true if overlap_detected == true OR ratio_within_tolerance
    == false. Return numeric values as numbers, not prose.

    '
  required_inputs:
  - train_dataset_or_identifiers
  - test_dataset_or_identifiers
  - declared_train_ratio_optional
  expected_outputs:
  - train_rows
  - test_rows
  - total_rows
  - actual_train_ratio
  - declared_train_ratio
  - ratio_difference
  - ratio_within_tolerance
  - overlap_detected
  - overlap_count
  - overlap_percentage
  - leakage_flag
  required_output_schema:
    type: object
    required:
    - assignment_id
    - train_rows
    - test_rows
    - total_rows
    - actual_train_ratio
    - overlap_detected
    - overlap_count
    - leakage_flag
    - calculations
    - self_check
  deterministic_checks:
  - check_id: row_counts_consistent
    description: train_rows + test_rows must equal total_rows
    assertion: result.train_rows + result.test_rows == result.total_rows
  - check_id: actual_ratio_formula
    description: actual_train_ratio must equal train_rows / total_rows
    assertion: abs(result.actual_train_ratio - (result.train_rows / result.total_rows))
      < 1e-9
  - check_id: overlap_count_nonnegative
    description: overlap_count must be >= 0
    assertion: result.overlap_count >= 0
  - check_id: overlap_percentage_formula
    description: overlap_percentage must equal overlap_count / total_rows
    assertion: result.overlap_percentage == result.overlap_count / result.total_rows
  - check_id: leakage_flag_logic
    description: leakage_flag must be true when overlap detected or ratio out of tolerance
    assertion: result.leakage_flag == (result.overlap_detected or not result.ratio_within_tolerance)
  math_checks:
  - formula_id: actual_train_ratio
    formula: train_rows / total_rows
    description: Actual fraction of data in training set
    output_field: actual_train_ratio
  - formula_id: ratio_difference
    formula: abs(actual_train_ratio - declared_train_ratio)
    description: Absolute difference between actual and declared train ratio
    output_field: ratio_difference
  - formula_id: overlap_percentage
    formula: overlap_count / total_rows
    description: Percentage of total data that overlaps between splits
    output_field: overlap_percentage
  evidence_checks:
  - evidence_field: overlap_detected
    description: Must be based on actual row-by-row comparison, not estimate
    required: true
  - evidence_field: overlap_count
    description: Must be exact count, not estimate
    required: true
  - evidence_field: actual_train_ratio
    description: Must be computed from actual row counts
    required: true
  flag_rules:
  - flag_id: data_leakage_detected
    condition: overlap_detected == true
    severity: high
    description: Train and test sets contain overlapping rows (data leakage)
  - flag_id: split_ratio_mismatch
    condition: ratio_within_tolerance == false
    severity: medium
    description: Actual train ratio differs from declared by more than 5%
  - flag_id: clean_split
    condition: leakage_flag == false
    severity: low
    description: No leakage detected and split ratio within tolerance
  severity_mapping:
    honey: No overlap, ratio within 2% of declared
    jelly: No overlap, ratio within 5% of declared, or ratio cannot be checked
    propolis: Any overlap detected, or ratio difference > 5%
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: dataset_train_test_integrity_v1
    train_rows: 8000
    test_rows: 2000
    total_rows: 10000
    actual_train_ratio: 0.8
    declared_train_ratio: 0.8
    ratio_difference: 0.0
    ratio_within_tolerance: true
    overlap_detected: false
    overlap_count: 0
    overlap_percentage: 0.0
    leakage_flag: false
- assignment_id: doc_exhibits_attachments_v1
  name: Exhibits and Attachments Review
  lane: document_draft_eval
  version: '1.0'
  purpose: Verify that all exhibits and attachments are properly listed, referenced
    within the document body, and correctly labeled. Documents with missing references
    or unlabeled exhibits fail attachment completeness standards.
  operator_instructions: Provide the agent with a document draft. The agent must extract
    all exhibits/attachments, verify each is referenced in the body text, check labeling
    correctness, and return structured JSON.
  agent_prompt: "You are evaluating a document draft for exhibit and attachment completeness.\n\
    \nGiven the document draft, perform the following:\n1. Extract ALL exhibits and\
    \ attachments — these may be labeled as \"Exhibit A\", \"Attachment 1\", \"Appendix\
    \ I\", or similar.\n2. For each exhibit/attachment, record its label, description,\
    \ and whether it is referenced in the body of the document.\n3. Check if every\
    \ exhibit/attachment listed has at least one in-body reference.\n4. Check if labels\
    \ follow a consistent format (e.g., all \"Exhibit X\" or all \"Attachment N\"\
    ).\n\nReturn a single JSON object with this exact structure:\n{\n  \"assignment_id\"\
    : \"doc_exhibits_attachments_v1\",\n  \"agent_summary\": \"One sentence summary\"\
    ,\n  \"inputs_used\": [\"list of inputs examined\"],\n  \"missing_inputs\": [\"\
    any missing inputs\"],\n  \"claims\": [\n    {\"claim\": \"\", \"evidence_reference\"\
    : \"\", \"confidence\": \"provided | inferred | missing\"}\n  ],\n  \"exhibits\"\
    : [\n    {\"label\": \"\", \"description\": \"\", \"referenced_in_body\": true,\
    \ \"body_reference_location\": \"\"}\n  ],\n  \"attachments_referenced_in_body\"\
    : true,\n  \"all_labels_consistent\": true,\n  \"total_exhibits\": 0,\n  \"referenced_count\"\
    : 0,\n  \"unreferenced_count\": 0,\n  \"calculations\": [\n    {\"name\": \"reference_ratio\"\
    , \"formula\": \"referenced_count / total_exhibits\", \"inputs\": {}, \"result\"\
    : 0.0, \"units\": \"ratio\", \"assumptions\": []}\n  ],\n  \"risks\": [\n    {\"\
    risk\": \"\", \"severity\": \"low | medium | high\", \"evidence_reference\": \"\
    \"}\n  ],\n  \"assumptions\": [],\n  \"open_questions\": [],\n  \"final_output\"\
    : \"PASS or FAIL\",\n  \"self_check\": {\n    \"all_required_sections_completed\"\
    : true,\n    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\"\
    : true,\n    \"missing_inputs_disclosed\": true\n  }\n}\n\nScoring rules:\n- reference_ratio\
    \ = referenced_count / total_exhibits\n- attachments_referenced_in_body must be\
    \ true if ALL exhibits are referenced in the body\n- all_labels_consistent must\
    \ be true if all exhibit labels follow the same naming convention\n- PASS if total_exhibits\
    \ >= 0 AND attachments_referenced_in_body == true AND all_labels_consistent ==\
    \ true\n- FAIL if any exhibit is not referenced in the body OR labels are inconsistent\n\
    - If no exhibits exist (total_exhibits == 0), final_output should be PASS with\
    \ a note\n\nReturn only the JSON. No markdown fences, no prose.\n"
  required_inputs:
  - name: document_draft
    type: string
    description: The document draft text containing exhibits and attachments
    required: true
  expected_outputs:
  - exhibits array with label, description, referenced_in_body, body_reference_location
    per exhibit
  - attachments_referenced_in_body boolean
  - all_labels_consistent boolean
  - reference_ratio float
  - final_output PASS or FAIL
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - exhibits
    - attachments_referenced_in_body
    - all_labels_consistent
    - total_exhibits
    - referenced_count
    - unreferenced_count
    - calculations
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
    properties:
      assignment_id:
        type: string
        const: doc_exhibits_attachments_v1
      agent_summary:
        type: string
        minLength: 1
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      claims:
        type: array
        items:
          type: object
          required:
          - claim
          - evidence_reference
          - confidence
          properties:
            claim:
              type: string
            evidence_reference:
              type: string
            confidence:
              enum:
              - provided
              - inferred
              - missing
      exhibits:
        type: array
        items:
          type: object
          required:
          - label
          - description
          - referenced_in_body
          - body_reference_location
          properties:
            label:
              type: string
            description:
              type: string
            referenced_in_body:
              type: boolean
            body_reference_location:
              type: string
      attachments_referenced_in_body:
        type: boolean
      all_labels_consistent:
        type: boolean
      total_exhibits:
        type: integer
        minimum: 0
      referenced_count:
        type: integer
        minimum: 0
      unreferenced_count:
        type: integer
        minimum: 0
      calculations:
        type: array
        items:
          type: object
          required:
          - name
          - formula
          - inputs
          - result
          - units
          - assumptions
      risks:
        type: array
        items:
          type: object
          required:
          - risk
          - severity
          - evidence_reference
          properties:
            risk:
              type: string
            severity:
              enum:
              - low
              - medium
              - high
            evidence_reference:
              type: string
      assumptions:
        type: array
        items:
          type: string
      open_questions:
        type: array
        items:
          type: string
      final_output:
        type: string
        enum:
        - PASS
        - FAIL
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
        properties:
          all_required_sections_completed:
            type: boolean
            const: true
          all_numbers_have_sources:
            type: boolean
            const: true
          assumptions_labeled:
            type: boolean
            const: true
          missing_inputs_disclosed:
            type: boolean
            const: true
  deterministic_checks:
  - description: total_exhibits must equal referenced_count plus unreferenced_count
    condition: total_exhibits == referenced_count + unreferenced_count
    pass_on_true: true
  - description: attachments_referenced_in_body must be true when all exhibits are
      referenced
    condition: attachments_referenced_in_body == (unreferenced_count == 0)
    pass_on_true: true
  - description: reference_ratio must equal referenced_count / total_exhibits
    condition: abs(reference_ratio - (referenced_count / max(total_exhibits, 1)))
      < 0.001
    pass_on_true: true
  - description: PASS requires all exhibits referenced and labels consistent
    condition: final_output == "PASS" implies attachments_referenced_in_body == true
      AND all_labels_consistent == true
    pass_on_true: true
  - description: Each exhibit must have body_reference_location when referenced_in_body
      is true
    condition: for all exhibits, referenced_in_body == true implies body_reference_location
      is non-empty
    pass_on_true: true
  math_checks:
  - formula_id: reference_ratio_formula
    description: Calculate reference ratio as referenced exhibits divided by total
      exhibits
    formula: reference_ratio = referenced_count / total_exhibits
    expected_precision: 0.01
    variables:
    - name: referenced_count
      type: integer
    - name: total_exhibits
      type: integer
    result_field: reference_ratio
  evidence_checks:
  - check_id: exhibit_labels_verified
    description: Each exhibit label must match the exact text used in the document
    evidence_must_match_claim: true
  - check_id: body_references_verified
    description: Each body_reference_location must cite a specific paragraph, line,
      or section where the exhibit is referenced
    required: true
  - check_id: label_consistency_check
    description: all_labels_consistent must be based on actual analysis of naming
      patterns
    required: true
  flag_rules:
  - flag_id: unreferenced_exhibits
    condition: unreferenced_count > 0
    severity: jelly
    message: One or more exhibits are not referenced in the document body
  - flag_id: inconsistent_labels
    condition: all_labels_consistent == false
    severity: honey
    message: Exhibit labels do not follow a consistent naming convention
  - flag_id: false_pass_unreferenced
    condition: final_output == "PASS" AND unreferenced_count > 0
    severity: propolis
    message: final_output is PASS but exhibits are unreferenced
  - flag_id: false_pass_labels
    condition: final_output == "PASS" AND all_labels_consistent == false
    severity: propolis
    message: final_output is PASS but exhibit labels are inconsistent
  - flag_id: missing_body_reference_location
    condition: any exhibit has referenced_in_body == true AND body_reference_location
      == ""
    severity: jelly
    message: Referenced exhibit lacks body reference location
  severity_mapping:
    honey: Minor issue — inconsistent labeling format
    jelly: Moderate issue — one or more exhibits not referenced in body
    propolis: Critical issue — false PASS when exhibits are unreferenced or inconsistently
      labeled
  receipt_type: eval_receipt
  recommended_human_review: false
  sample_submission_shape:
    assignment_id: doc_exhibits_attachments_v1
    agent_summary: 2 exhibits found, both referenced in body, labels are consistent.
    inputs_used:
    - document_draft
    missing_inputs: []
    claims:
    - claim: Exhibit A is referenced in body
      evidence_reference: 'Paragraph 3: ''See Exhibit A for quarterly results'''
      confidence: provided
    - claim: Exhibit B is referenced in body
      evidence_reference: 'Paragraph 5: ''Details in Exhibit B'''
      confidence: provided
    exhibits:
    - label: Exhibit A
      description: Q3 2024 Financial Summary
      referenced_in_body: true
      body_reference_location: Paragraph 3
    - label: Exhibit B
      description: Project Timeline Gantt Chart
      referenced_in_body: true
      body_reference_location: Paragraph 5
    attachments_referenced_in_body: true
    all_labels_consistent: true
    total_exhibits: 2
    referenced_count: 2
    unreferenced_count: 0
    calculations:
    - name: reference_ratio
      formula: referenced_count / total_exhibits
      inputs:
        referenced_count: 2
        total_exhibits: 2
      result: 1.0
      units: ratio
      assumptions: []
    risks: []
    assumptions: []
    open_questions: []
    final_output: PASS
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: doc_facts_evidence_basis_v1
  name: Facts and Evidence Basis
  lane: document_draft_eval
  version: '1.0'
  purpose: Verify that every factual claim in the document draft references supporting
    evidence, and that any facts without evidence are explicitly disclosed as missing.
    Documents must not present unsupported assertions as established facts.
  operator_instructions: Provide the agent with a document draft. The agent must extract
    every factual claim, check whether each claim has a cited evidence source, collect
    all missing facts, and return structured JSON. Factual claims are statements presented
    as true, not opinions or hypotheses.
  agent_prompt: "You are evaluating a document draft for factual grounding.\n\nGiven\
    \ the document draft, perform the following steps:\n1. Extract EVERY factual claim\
    \ — a statement presented as objectively true (not opinion, not hypothesis).\n\
    2. For each factual claim, determine whether it has a supporting evidence reference\
    \ in the document (citation, source document, data reference, etc.).\n3. List\
    \ all factual claims with their evidence references in the facts_used array.\n\
    4. List all factual claims that lack evidence in the missing_facts array.\n5.\
    \ For each claim, set confidence to \"provided\" if evidence is in the document,\
    \ \"inferred\" if the agent can infer it from context, or \"missing\" if no evidence\
    \ exists.\n\nReturn a single JSON object with this exact structure:\n{\n  \"assignment_id\"\
    : \"doc_facts_evidence_basis_v1\",\n  \"agent_summary\": \"One sentence summary\"\
    ,\n  \"inputs_used\": [\"list of inputs examined\"],\n  \"missing_inputs\": [\"\
    any missing inputs\"],\n  \"claims\": [\n    {\"claim\": \"\", \"evidence_reference\"\
    : \"\", \"confidence\": \"provided | inferred | missing\"}\n  ],\n  \"facts_used\"\
    : [\n    {\"claim\": \"\", \"evidence_reference\": \"\", \"confidence\": \"provided\
    \ | inferred | missing\"}\n  ],\n  \"missing_facts\": [\n    {\"claim\": \"\"\
    , \"reason_missing\": \"\", \"severity\": \"low | medium | high\"}\n  ],\n  \"\
    total_claims\": 0,\n  \"claims_with_evidence\": 0,\n  \"claims_without_evidence\"\
    : 0,\n  \"evidence_ratio\": 0.0,\n  \"calculations\": [\n    {\"name\": \"evidence_ratio\"\
    , \"formula\": \"claims_with_evidence / total_claims\", \"inputs\": {}, \"result\"\
    : 0.0, \"units\": \"ratio\", \"assumptions\": []}\n  ],\n  \"risks\": [\n    {\"\
    risk\": \"\", \"severity\": \"low | medium | high\", \"evidence_reference\": \"\
    \"}\n  ],\n  \"assumptions\": [],\n  \"open_questions\": [],\n  \"final_output\"\
    : \"PASS or FAIL\",\n  \"self_check\": {\n    \"all_required_sections_completed\"\
    : true,\n    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\"\
    : true,\n    \"missing_inputs_disclosed\": true\n  }\n}\n\nScoring rules:\n- evidence_ratio\
    \ = claims_with_evidence / total_claims (as a float)\n- PASS if evidence_ratio\
    \ >= 0.80 AND no high-severity missing facts\n- FAIL if evidence_ratio < 0.80\
    \ OR any missing_fact has severity \"high\"\n- total_claims must equal facts_used.length\
    \ + missing_facts.length\n- Every factual claim in the document MUST appear in\
    \ either facts_used OR missing_facts\n\nReturn only the JSON. No markdown fences,\
    \ no prose.\n"
  required_inputs:
  - name: document_draft
    type: string
    description: The document draft text containing factual claims to evaluate
    required: true
  expected_outputs:
  - facts_used array with claim, evidence_reference, confidence per fact
  - missing_facts array with claim, reason_missing, severity per fact
  - evidence_ratio float
  - final_output PASS or FAIL
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - facts_used
    - missing_facts
    - total_claims
    - claims_with_evidence
    - claims_without_evidence
    - evidence_ratio
    - calculations
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
    properties:
      assignment_id:
        type: string
        const: doc_facts_evidence_basis_v1
      agent_summary:
        type: string
        minLength: 1
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      claims:
        type: array
        items:
          type: object
          required:
          - claim
          - evidence_reference
          - confidence
          properties:
            claim:
              type: string
            evidence_reference:
              type: string
            confidence:
              enum:
              - provided
              - inferred
              - missing
      facts_used:
        type: array
        items:
          type: object
          required:
          - claim
          - evidence_reference
          - confidence
          properties:
            claim:
              type: string
            evidence_reference:
              type: string
            confidence:
              enum:
              - provided
              - inferred
              - missing
      missing_facts:
        type: array
        items:
          type: object
          required:
          - claim
          - reason_missing
          - severity
          properties:
            claim:
              type: string
            reason_missing:
              type: string
            severity:
              enum:
              - low
              - medium
              - high
      total_claims:
        type: integer
        minimum: 0
      claims_with_evidence:
        type: integer
        minimum: 0
      claims_without_evidence:
        type: integer
        minimum: 0
      evidence_ratio:
        type: number
        minimum: 0
        maximum: 1
      calculations:
        type: array
        items:
          type: object
          required:
          - name
          - formula
          - inputs
          - result
          - units
          - assumptions
      risks:
        type: array
        items:
          type: object
          required:
          - risk
          - severity
          - evidence_reference
          properties:
            risk:
              type: string
            severity:
              enum:
              - low
              - medium
              - high
            evidence_reference:
              type: string
      assumptions:
        type: array
        items:
          type: string
      open_questions:
        type: array
        items:
          type: string
      final_output:
        type: string
        enum:
        - PASS
        - FAIL
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
        properties:
          all_required_sections_completed:
            type: boolean
            const: true
          all_numbers_have_sources:
            type: boolean
            const: true
          assumptions_labeled:
            type: boolean
            const: true
          missing_inputs_disclosed:
            type: boolean
            const: true
  deterministic_checks:
  - description: total_claims must equal sum of claims_with_evidence and claims_without_evidence
    condition: total_claims == claims_with_evidence + claims_without_evidence
    pass_on_true: true
  - description: evidence_ratio must equal claims_with_evidence / total_claims
    condition: abs(evidence_ratio - (claims_with_evidence / max(total_claims, 1)))
      < 0.001
    pass_on_true: true
  - description: PASS requires evidence_ratio >= 0.80
    condition: final_output == "PASS" implies evidence_ratio >= 0.80
    pass_on_true: true
  - description: PASS requires no high-severity missing facts
    condition: final_output == "PASS" implies no missing_fact has severity == "high"
    pass_on_true: true
  - description: Every factual claim must be accounted for
    condition: facts_used.length + missing_facts.length == total_claims
    pass_on_true: true
  math_checks:
  - formula_id: evidence_ratio_formula
    description: Calculate evidence ratio as claims with evidence divided by total
      claims
    formula: evidence_ratio = claims_with_evidence / total_claims
    expected_precision: 0.01
    variables:
    - name: claims_with_evidence
      type: integer
    - name: total_claims
      type: integer
    result_field: evidence_ratio
  evidence_checks:
  - check_id: fact_claims_complete
    description: Every factual claim in the document must appear in either facts_used
      or missing_facts
    evidence_must_match_claim: true
  - check_id: evidence_references_verifiable
    description: Each evidence_reference in facts_used must point to a specific location
      or source in the document
    required: true
  - check_id: missing_facts_explained
    description: Each missing_fact must have a non-empty reason_missing explaining
      why evidence is absent
    required: true
  flag_rules:
  - flag_id: low_evidence_ratio
    condition: evidence_ratio < 0.50
    severity: honey
    message: Evidence ratio is below 50% — majority of claims lack evidence
  - flag_id: medium_evidence_gap
    condition: evidence_ratio >= 0.50 AND evidence_ratio < 0.80
    severity: jelly
    message: Evidence ratio is between 50% and 80% — significant gaps in fact support
  - flag_id: high_severity_missing_fact
    condition: any missing_fact has severity == "high"
    severity: propolis
    message: At least one factual claim with high severity lacks evidence
  - flag_id: false_pass_low_ratio
    condition: final_output == "PASS" AND evidence_ratio < 0.80
    severity: propolis
    message: final_output is PASS but evidence ratio is below 0.80 threshold
  - flag_id: claim_count_mismatch
    condition: total_claims != claims_with_evidence + claims_without_evidence
    severity: propolis
    message: Claim count arithmetic does not match
  severity_mapping:
    honey: Minor issue — evidence ratio below 50%, or individual low-severity missing
      facts
    jelly: Moderate issue — evidence ratio between 50-80%, or medium-severity missing
      facts
    propolis: Critical issue — high-severity missing facts, false PASS, or arithmetic
      errors in claim counts
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: doc_facts_evidence_basis_v1
    agent_summary: Document contains 5 factual claims; 4 have evidence (80% ratio).
    inputs_used:
    - document_draft
    missing_inputs: []
    claims:
    - claim: Company revenue grew 15% in 2024
      evidence_reference: 'Cited: Annual Report 2024, page 3'
      confidence: provided
    - claim: Market share increased to 25%
      evidence_reference: No source cited
      confidence: missing
    facts_used:
    - claim: Company revenue grew 15% in 2024
      evidence_reference: Annual Report 2024, page 3
      confidence: provided
    - claim: Employee count is 500
      evidence_reference: HR dashboard export dated Jan 2024
      confidence: provided
    - claim: Headquarters is in Austin, TX
      evidence_reference: Company website About page
      confidence: provided
    - claim: CEO is Jane Smith
      evidence_reference: Press release dated 2023-06-15
      confidence: provided
    missing_facts:
    - claim: Market share increased to 25%
      reason_missing: No citation or data source provided for market share figure
      severity: medium
    total_claims: 5
    claims_with_evidence: 4
    claims_without_evidence: 1
    evidence_ratio: 0.8
    calculations:
    - name: evidence_ratio
      formula: claims_with_evidence / total_claims
      inputs:
        claims_with_evidence: 4
        total_claims: 5
      result: 0.8
      units: ratio
      assumptions: []
    risks:
    - risk: Market share claim lacks supporting evidence
      severity: medium
      evidence_reference: Paragraph 2 — no citation found
    assumptions: []
    open_questions: []
    final_output: PASS
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: doc_recipient_sender_subject_v1
  name: Document Header Completeness
  lane: document_draft_eval
  version: '1.0'
  purpose: Verify that the generated document contains all required header fields
    — recipient, sender, subject, and date — and that each field is non-empty and
    properly formatted. Missing or empty header fields indicate an incomplete document
    draft that fails minimum readiness standards.
  operator_instructions: Provide the agent with a document draft (raw text or structured
    dict). The agent must inspect the header section and return a JSON object reporting
    the presence, absence, and validity of each header field. Do not accept prose
    responses; enforce the JSON schema.
  agent_prompt: "You are evaluating a document draft for header completeness.\n\n\
    Given the document draft provided by the user, inspect it for these four header\
    \ fields:\n1. recipient — Who the document is addressed to\n2. sender — Who wrote\
    \ or is sending the document\n3. subject — The topic or purpose of the document\n\
    4. date — The date of the document (must be a valid date string)\n\nReturn a single\
    \ JSON object with this exact structure:\n{\n  \"assignment_id\": \"doc_recipient_sender_subject_v1\"\
    ,\n  \"agent_summary\": \"One sentence summary of header completeness status\"\
    ,\n  \"inputs_used\": [\"list of inputs you examined\"],\n  \"missing_inputs\"\
    : [\"any inputs not provided\"],\n  \"claims\": [\n    {\"claim\": \"\", \"evidence_reference\"\
    : \"\", \"confidence\": \"provided | inferred | missing\"}\n  ],\n  \"header_fields\"\
    : {\n    \"recipient\": {\"present\": true, \"value\": \"\", \"valid\": true},\n\
    \    \"sender\": {\"present\": true, \"value\": \"\", \"valid\": true},\n    \"\
    subject\": {\"present\": true, \"value\": \"\", \"valid\": true},\n    \"date\"\
    : {\"present\": true, \"value\": \"\", \"valid\": true, \"is_date_format\": true}\n\
    \  },\n  \"calculations\": [],\n  \"risks\": [],\n  \"assumptions\": [],\n  \"\
    open_questions\": [],\n  \"final_output\": \"PASS or FAIL with reason\",\n  \"\
    self_check\": {\n    \"all_required_sections_completed\": true,\n    \"all_numbers_have_sources\"\
    : true,\n    \"assumptions_labeled\": true,\n    \"missing_inputs_disclosed\"\
    : true\n  }\n}\n\nRules:\n- A field is \"present\" if it exists and is non-empty.\n\
    - A field is \"valid\" if it contains meaningful content (not placeholder text\
    \ like \"TBD\", \"N/A\", \"[Fill in]\")\n- \"is_date_format\" must be true only\
    \ if the date string is parseable as a date (YYYY-MM-DD, MM/DD/YYYY, etc.)\n-\
    \ final_output must be \"PASS\" only if ALL four fields are present AND valid.\n\
    - If any field is missing, invalid, or contains placeholder text, final_output\
    \ must be \"FAIL\".\n- Return only the JSON. No markdown fences, no prose explanation.\n"
  required_inputs:
