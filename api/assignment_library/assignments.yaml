    formula: gross_potential_rent * occupancy_rate
    inputs:
      gross_potential_rent: 1440000
      occupancy_rate: 0.92
    expected_result: 1324800.0
    tolerance: 1.0
  - formula_id: noi
    formula: effective_gross_income - operating_expenses
