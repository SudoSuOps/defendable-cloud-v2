# DefendableCloud Assignment Library v1.0
# Total Assignments: 50
# Generated: 2026-05-27
# Lanes: 10
#
# This file contains all eval assignments used by DefendableCloud Flight Sheets.
# Each assignment is a self-contained eval prompt with deterministic checks,
# math validation, evidence requirements, and referee flag rules.
#
# Usage:
#   1. A Flight Sheet selects assignments by assignment_id
#   2. The assignment prompt is sent to the target AI agent
#   3. The agent returns structured JSON per required_output_schema
#   4. The referee runs deterministic_checks, math_checks, evidence_checks
#   5. Flag rules produce severity-classified flags (honey/jelly/propolis)
#   6. Human review gate decides final approval
#   7. Receipt is generated upon approval
#
# See schema.assignment.json for the validation schema.
# See referee_flag_catalog.yaml for reusable flags.
# See formula_catalog.yaml for reusable formulas.

assignments:
- assignment_id: client_actionability_review_v1
  name: Deliverable Actionability Review
  lane: client_deliverable_readiness_eval
  version: '1.0'
  purpose: 'Verify that the deliverable contains clear, actionable next steps with
    assigned responsible parties and specific deadlines. A deliverable without actionability
    requires follow-up work before it is client-ready.

    '
  operator_instructions: 'Provide the deliverable document and any accompanying action
    items list or project plan. The operator must not modify or pre-screen the document.
    Upload all files as inputs.

    '
  agent_prompt: "You are a client deliverable readiness evaluator. Inspect the provided\
    \ deliverable document for actionability. Identify all action items, next steps,\
    \ recommendations, or to-do items present in the document.\nFor each action item\
    \ found, extract: - action_id (string: sequential identifier, e.g., \"A001\")\
    \ - requested_action (string: the specific action to be taken) - responsible_party\
    \ (string: the person, team, or role assigned; \"\" if not named) - deadline (string:\
    \ the specific deadline or date; \"\" if not specified) - deadline_type (string:\
    \ \"date\", \"duration\", \"milestone\", or \"unspecified\") - source_location\
    \ (string: page number or section where this action was found)\nAfter extracting\
    \ all action items, compute: - total_actions_found (integer) - actions_with_named_party\
    \ (integer: count where responsible_party != \"\") - actions_with_deadline (integer:\
    \ count where deadline != \"\") - actions_fully_specified (integer: count where\
    \ both responsible_party AND deadline are non-empty)\nReturn a single JSON object\
    \ with this exact structure: {\n  \"assignment_id\": \"client_actionability_review_v1\"\
    ,\n  \"agent_summary\": \"<one-sentence summary>\",\n  \"inputs_used\": [\"<list\
    \ inputs>\"],\n  \"missing_inputs\": [\"<list missing inputs>\"],\n  \"claims\"\
    : [\n    {\n      \"claim\": \"<specific claim>\",\n      \"evidence_reference\"\
    : \"<page/section reference>\",\n      \"confidence\": \"provided | inferred |\
    \ missing\"\n    }\n  ],\n  \"calculations\": [\n    {\n      \"name\": \"total_actions_found\"\
    ,\n      \"formula\": \"count(action_items)\",\n      \"inputs\": {},\n      \"\
    result\": 0,\n      \"units\": \"count\",\n      \"assumptions\": [\"assumed all\
    \ numbered/bulleted directives are action items\"]\n    },\n    {\n      \"name\"\
    : \"actions_with_named_party\",\n      \"formula\": \"count(action_items where\
    \ responsible_party != '')\",\n      \"inputs\": {},\n      \"result\": 0,\n \
    \     \"units\": \"count\",\n      \"assumptions\": []\n    },\n    {\n      \"\
    name\": \"actions_with_deadline\",\n      \"formula\": \"count(action_items where\
    \ deadline != '')\",\n      \"inputs\": {},\n      \"result\": 0,\n      \"units\"\
    : \"count\",\n      \"assumptions\": []\n    },\n    {\n      \"name\": \"actions_fully_specified\"\
    ,\n      \"formula\": \"count(action_items where responsible_party != '' AND deadline\
    \ != '')\",\n      \"inputs\": {},\n      \"result\": 0,\n      \"units\": \"\
    count\",\n      \"assumptions\": []\n    },\n    {\n      \"name\": \"actionability_ratio\"\
    ,\n      \"formula\": \"actions_fully_specified / total_actions_found\",\n   \
    \   \"inputs\": {},\n      \"result\": 0.0,\n      \"units\": \"ratio (0.0 to\
    \ 1.0)\",\n      \"assumptions\": [\"ratio is 0 if total_actions_found is 0\"\
    ]\n    }\n  ],\n  \"action_items\": [\n    {\n      \"action_id\": \"A001\",\n\
    \      \"requested_action\": \"\",\n      \"responsible_party\": \"\",\n     \
    \ \"deadline\": \"\",\n      \"deadline_type\": \"\",\n      \"source_location\"\
    : \"\"\n    }\n  ],\n  \"risks\": [\n    {\n      \"risk\": \"<risk description>\"\
    ,\n      \"severity\": \"low | medium | high\",\n      \"evidence_reference\"\
    : \"\"\n    }\n  ],\n  \"assumptions\": [\"<assumptions>\"],\n  \"open_questions\"\
    : [\"<open questions>\"],\n  \"final_output\": \"<PASS, CONDITIONAL_PASS, or FAIL>\"\
    ,\n  \"self_check\": {\n    \"all_required_sections_completed\": true,\n    \"\
    all_numbers_have_sources\": true,\n    \"assumptions_labeled\": true,\n    \"\
    missing_inputs_disclosed\": true\n  }\n}\nRules for final_output: - \"PASS\":\
    \ At least one action item exists, AND at least 80% of action items\n  have both\
    \ a named responsible_party AND a specified deadline\n  (actionability_ratio >=\
    \ 0.80).\n- \"CONDITIONAL_PASS\": At least one action item exists, but fewer than\
    \ 80%\n  are fully specified (0 < actionability_ratio < 0.80).\n- \"FAIL\": No\
    \ action items found (total_actions_found == 0), OR no action\n  items have either\
    \ a responsible_party or a deadline.\n"
  required_inputs:
  - name: deliverable_document
    type: file
    description: The client deliverable document to inspect
  - name: action_items_list
    type: file
    description: Optional separate action items list or project plan
    optional: true
  expected_outputs:
  - action_items array with action_id, requested_action, responsible_party, deadline,
    deadline_type, source_location
  - calculations array with computed counts and ratios
  - final_output verdict (PASS, CONDITIONAL_PASS, FAIL)
  - risks array with severity ratings
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - calculations
    - action_items
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
    properties:
      action_items:
        type: array
        items:
          type: object
          required:
          - action_id
          - requested_action
          - responsible_party
          - deadline
          - deadline_type
          - source_location
      calculations:
        type: array
        items:
          type: object
          required:
          - name
          - formula
          - inputs
          - result
          - units
          - assumptions
      final_output:
        type: string
        enum:
        - PASS
        - CONDITIONAL_PASS
        - FAIL
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - check: final_output is one of PASS, CONDITIONAL_PASS, FAIL
    match_field: final_output
    expected_values:
    - PASS
    - CONDITIONAL_PASS
    - FAIL
  - check: action_items is an array
    match_field: action_items
    type: array
  - check: Every action item has all required fields
    match_field: action_items
    required_keys:
    - action_id
    - requested_action
    - responsible_party
    - deadline
    - deadline_type
    - source_location
  - check: calculations array has exactly 5 entries
    match_field: len(calculations)
    expected_value: 5
  - check: Each calculation has name, formula, inputs, result, units, assumptions
    match_field: calculations
    required_keys:
    - name
    - formula
    - inputs
    - result
    - units
    - assumptions
  - check: total_actions_found equals length of action_items array
    match_field: calculations
    condition: calculations entry with name 'total_actions_found' must have result
      == len(action_items)
  - check: self_check.all_required_sections_completed is true
    match_field: self_check.all_required_sections_completed
    expected_value: true
  math_checks:
  - check: actionability_ratio = actions_fully_specified / total_actions_found (handle
      division by zero)
    match_field: calculations
    formula_check: entry with name 'actionability_ratio' has result equal to (actions_fully_specified
      result / total_actions_found result), or 0.0 if total_actions_found is 0
  - check: PASS requires actionability_ratio >= 0.80
    match_field: final_output
    condition: if final_output == 'PASS', then calculations entry with name 'actionability_ratio'
      must have result >= 0.80
  - check: CONDITIONAL_PASS requires 0 < actionability_ratio < 0.80
    match_field: final_output
    condition: if final_output == 'CONDITIONAL_PASS', then 0 < actionability_ratio
      result < 0.80
  - check: FAIL requires total_actions_found == 0 OR actionability_ratio == 0
    match_field: final_output
    condition: if final_output == 'FAIL', then total_actions_found == 0 OR actions_fully_specified
      == 0
  evidence_checks:
  - check: Every claim has a non-empty evidence_reference
    match_field: claims
    condition: all claims must have evidence_reference != '' and evidence_reference
      != null
  - check: Every action item has a non-empty source_location
    match_field: action_items
    condition: all action_items must have source_location != '' and source_location
      != null
  - check: If responsible_party is empty, agent should flag in risks
    match_field: risks
    condition: if any action_item has responsible_party == '', risks should contain
      an entry referencing that gap
  - check: If deadline is empty, agent should flag in risks
    match_field: risks
    condition: if any action_item has deadline == '', risks should contain an entry
      referencing that gap
  flag_rules:
  - flag_id: no_action_items_found
    condition: len(action_items) == 0
    severity: high
    message: No action items found in the deliverable - document is not actionable
  - flag_id: unnamed_responsible_parties
    condition: calculations entry with name 'actions_with_named_party' has result
      < calculations entry with name 'total_actions_found' result
    severity: medium
    message: Some action items lack a named responsible party
  - flag_id: missing_deadlines
    condition: calculations entry with name 'actions_with_deadline' has result < calculations
      entry with name 'total_actions_found' result
    severity: medium
    message: Some action items lack specified deadlines
  - flag_id: low_actionability_ratio
    condition: calculations entry with name 'actionability_ratio' has result > 0 AND
      result < 0.80
    severity: medium
    message: Actionability ratio is below 80% threshold
  - flag_id: incomplete_self_check
    condition: self_check.all_required_sections_completed != true
    severity: high
    message: Agent did not complete all required self-check sections
  severity_mapping:
    honey: 'Some action items missing deadlines but all have responsible parties.
      Actionability ratio between 60-80%. Result: CONDITIONAL_PASS.'
    jelly: 'Multiple action items missing responsible parties OR deadlines. Actionability
      ratio between 20-60%. Result: CONDITIONAL_PASS with mandatory remediation.'
    propolis: 'No action items found at all, OR no action items have either responsible
      parties or deadlines (0% actionability). Document is not client-ready. Result:
      FAIL.'
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    inputs:
      deliverable_document: project_status_report_week12.pdf
      action_items_list: 'null'
    expected_final_output: PASS | CONDITIONAL_PASS | FAIL
    notes: Human reviewer should verify that extracted responsible parties and deadlines
      match the org chart and project timeline.
- assignment_id: client_branding_completeness_v1
  name: Branding and Formatting Completeness
  lane: client_deliverable_readiness_eval
  version: '1.0'
  purpose: 'Verify that client branding elements (logo, brand colors, approved fonts,
    headers, footers) are present and correctly applied in the deliverable. Ensure
    the document format matches the client''s template specification.

    '
  operator_instructions: 'Provide the deliverable document (PDF, DOCX, or rendered
    page) and the client''s branding template specification. The operator must not
    modify the deliverable before submission. Upload both files as inputs.

    '
  agent_prompt: "You are a client deliverable readiness evaluator. Inspect the provided\
    \ deliverable document and the client's branding template specification.\nCheck\
    \ for the presence and correctness of each branding element listed in the template\
    \ spec. For each element, record: - element_name (string) - present (boolean:\
    \ true if found, false if missing) - matches_template (boolean: true if matches\
    \ spec, false if deviates) - deviation_notes (string: empty if matches, description\
    \ of deviation if not)\nBranding elements to check: 1. Client logo (position,\
    \ size, resolution) 2. Primary brand colors (background, accents, text) 3. Approved\
    \ fonts (header font, body font) 4. Header (content, height, page position) 5.\
    \ Footer (content, height, page position, page numbers) 6. Margins (top, bottom,\
    \ left, right as specified) 7. Cover page layout (if specified in template)\n\
    Return a single JSON object with this exact structure: {\n  \"assignment_id\"\
    : \"client_branding_completeness_v1\",\n  \"agent_summary\": \"<one-sentence summary\
    \ of branding check result>\",\n  \"inputs_used\": [\"<list each input file or\
    \ source used>\"],\n  \"missing_inputs\": [\"<list any expected but missing inputs>\"\
    ],\n  \"claims\": [\n    {\n      \"claim\": \"<specific claim about branding>\"\
    ,\n      \"evidence_reference\": \"<page number, section, or element index>\"\
    ,\n      \"confidence\": \"provided | inferred | missing\"\n    }\n  ],\n  \"\
    branding_elements\": [\n    {\n      \"element_name\": \"<name>\",\n      \"present\"\
    : true,\n      \"matches_template\": true,\n      \"deviation_notes\": \"\"\n\
    \    }\n  ],\n  \"risks\": [\n    {\n      \"risk\": \"<risk description>\",\n\
    \      \"severity\": \"low | medium | high\",\n      \"evidence_reference\": \"\
    <where the risk was found>\"\n    }\n  ],\n  \"assumptions\": [\"<list assumptions\
    \ made during evaluation>\"],\n  \"open_questions\": [\"<list any unresolved questions>\"\
    ],\n  \"final_output\": \"<PASS, CONDITIONAL_PASS, or FAIL based on checks>\"\
    ,\n  \"self_check\": {\n    \"all_required_sections_completed\": true,\n    \"\
    all_numbers_have_sources\": true,\n    \"assumptions_labeled\": true,\n    \"\
    missing_inputs_disclosed\": true\n  }\n}\nRules for final_output: - \"PASS\":\
    \ All branding elements present and match template (or deviations are cosmetic/minor).\
    \ - \"CONDITIONAL_PASS\": Minor deviations that do not affect client perception\
    \ (e.g., slight color variation within tolerance). - \"FAIL\": Any required branding\
    \ element is missing or significantly deviates from template.\n"
  required_inputs:
  - name: deliverable_document
    type: file
    description: The client deliverable document to inspect (PDF, DOCX, or rendered
      page)
  - name: branding_template_spec
    type: file
    description: Client's branding template specification defining required elements
  expected_outputs:
  - branding_elements array with per-element presence and match status
  - final_output verdict (PASS, CONDITIONAL_PASS, FAIL)
  - risks array with severity ratings
  - self_check completion confirmation
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - branding_elements
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
    properties:
      branding_elements:
        type: array
        items:
          type: object
          required:
          - element_name
          - present
          - matches_template
          - deviation_notes
      final_output:
        type: string
        enum:
        - PASS
        - CONDITIONAL_PASS
        - FAIL
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - check: final_output is one of PASS, CONDITIONAL_PASS, FAIL
    match_field: final_output
    expected_values:
    - PASS
    - CONDITIONAL_PASS
    - FAIL
  - check: branding_elements array has at least 5 entries
    match_field: len(branding_elements)
    minimum: 5
  - check: Every branding element has element_name, present, matches_template, deviation_notes
    match_field: branding_elements
    required_keys:
    - element_name
    - present
    - matches_template
    - deviation_notes
  - check: self_check.all_required_sections_completed is true
    match_field: self_check.all_required_sections_completed
    expected_value: true
  - check: No missing_inputs are undisclosed when inputs are absent
    match_field: missing_inputs
    condition: if inputs are expected but not provided, missing_inputs must be non-empty
  math_checks: []
  evidence_checks:
  - check: Every claim has a non-empty evidence_reference
    match_field: claims
    condition: all claims must have evidence_reference != '' and evidence_reference
      != null
  - check: All deviation notes reference specific pages, sections, or element locations
    match_field: branding_elements.deviation_notes
    condition: if matches_template is false, deviation_notes must be non-empty
  - check: risks array has evidence_reference for each entry
    match_field: risks
    condition: all risks must have non-empty evidence_reference
  flag_rules:
  - flag_id: missing_logo
    condition: branding_elements contains an element with element_name containing
      'logo' and present == false
    severity: high
    message: Client logo is missing from the deliverable
  - flag_id: incorrect_fonts
    condition: branding_elements contains an element with element_name containing
      'font' and matches_template == false
    severity: medium
    message: Approved fonts not used correctly
  - flag_id: missing_header_footer
    condition: branding_elements contains element with element_name containing 'header'
      or 'footer' and present == false
    severity: medium
    message: Header or footer is missing
  - flag_id: color_deviation
    condition: branding_elements contains element with element_name containing 'color'
      and matches_template == false
    severity: low
    message: Brand colors deviate from template specification
  - flag_id: missing_self_check
    condition: self_check.all_required_sections_completed != true
    severity: high
    message: Agent failed to complete all required self-check sections
  severity_mapping:
    honey: 'Minor cosmetic deviations (color tolerance, slight sizing) that do not
      affect client brand perception. Result: CONDITIONAL_PASS.'
    jelly: 'Missing or incorrect formatting elements (fonts, margins, header/footer)
      that reduce professionalism but do not block delivery. Result: CONDITIONAL_PASS
      with remediation list.'
    propolis: 'Missing client logo, completely wrong branding, or failure to include
      required cover page. These are delivery-blocking issues. Result: FAIL.'
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    inputs:
      deliverable_document: quarterly_report_final.pdf
      branding_template_spec: acme_corp_brand_guide_v3.pdf
    expected_final_output: PASS | CONDITIONAL_PASS | FAIL
    notes: Human reviewer should verify logo resolution and color accuracy visually.
- assignment_id: client_confidentiality_version_v1
  name: Confidentiality Notice and Version Control
  lane: client_deliverable_readiness_eval
  version: '1.0'
  purpose: 'Check that the deliverable contains a confidentiality notice, a version
    number, a current date, and a change log or version history. These are required
    legal and compliance elements for client-facing documents.

    '
  operator_instructions: 'Provide the deliverable document. The operator must not
    pre-screen or modify the document. Upload as a file or provide a URL to the rendered
    document.

    '
  agent_prompt: "You are a client deliverable readiness evaluator. Inspect the provided\
    \ deliverable document for the following required elements:\n1. CONFIDENTIALITY\
    \ NOTICE: A notice stating the document is confidential,\n   proprietary, or intended\
    \ for specific recipients only. Check:\n   - present (boolean)\n   - location\
    \ (string: page number or section)\n   - text (string: exact or approximate text\
    \ found)\n   - classification_level (string: \"Confidential\", \"Proprietary\"\
    ,\n     \"Internal Use Only\", \"Restricted\", or \"Not Specified\")\n\n2. VERSION\
    \ NUMBER: A version identifier for this document. Check:\n   - present (boolean)\n\
    \   - version_string (string: the version text found, e.g., \"v2.3\")\n   - location\
    \ (string: where it appears)\n\n3. DOCUMENT DATE: The date associated with this\
    \ version of the document. Check:\n   - present (boolean)\n   - date_string (string:\
    \ the date text found)\n   - date_parsed (string: ISO-8601 date if parseable,\
    \ else \"unparseable\")\n   - is_current (boolean: true if the date is within\
    \ 30 days of today,\n     false otherwise; if today's date is unavailable, set\
    \ to \"unknown\")\n   - location (string: where it appears)\n\n4. CHANGE LOG /\
    \ VERSION HISTORY: A record of changes across versions. Check:\n   - present (boolean)\n\
    \   - entry_count (integer: number of entries found, 0 if absent)\n   - location\
    \ (string: where it appears)\n   - latest_entry (string: text of the most recent\
    \ entry, \"\" if absent)\n\nReturn a single JSON object with this exact structure:\
    \ {\n  \"assignment_id\": \"client_confidentiality_version_v1\",\n  \"agent_summary\"\
    : \"<one-sentence summary>\",\n  \"inputs_used\": [\"<list inputs>\"],\n  \"missing_inputs\"\
    : [\"<list missing inputs>\"],\n  \"claims\": [\n    {\n      \"claim\": \"<specific\
    \ claim>\",\n      \"evidence_reference\": \"<page/section reference>\",\n   \
    \   \"confidence\": \"provided | inferred | missing\"\n    }\n  ],\n  \"confidentiality_notice\"\
    : {\n    \"present\": true,\n    \"location\": \"\",\n    \"text\": \"\",\n  \
    \  \"classification_level\": \"\"\n  },\n  \"version_control\": {\n    \"present\"\
    : true,\n    \"version_string\": \"\",\n    \"location\": \"\"\n  },\n  \"document_date\"\
    : {\n    \"present\": true,\n    \"date_string\": \"\",\n    \"date_parsed\":\
    \ \"\",\n    \"is_current\": true,\n    \"location\": \"\"\n  },\n  \"change_log\"\
    : {\n    \"present\": true,\n    \"entry_count\": 0,\n    \"location\": \"\",\n\
    \    \"latest_entry\": \"\"\n  },\n  \"risks\": [\n    {\n      \"risk\": \"<risk\
    \ description>\",\n      \"severity\": \"low | medium | high\",\n      \"evidence_reference\"\
    : \"\"\n    }\n  ],\n  \"assumptions\": [\"<assumptions>\"],\n  \"open_questions\"\
    : [\"<open questions>\"],\n  \"final_output\": \"<PASS, CONDITIONAL_PASS, or FAIL>\"\
    ,\n  \"self_check\": {\n    \"all_required_sections_completed\": true,\n    \"\
    all_numbers_have_sources\": true,\n    \"assumptions_labeled\": true,\n    \"\
    missing_inputs_disclosed\": true\n  }\n}\nRules for final_output: - \"PASS\":\
    \ All four elements (confidentiality_notice, version_control,\n  document_date,\
    \ change_log) are present and the document date is current.\n- \"CONDITIONAL_PASS\"\
    : All elements are present but the date is older than\n  30 days, or the change\
    \ log has fewer than 2 entries.\n- \"FAIL\": Any of confidentiality_notice, version_control,\
    \ or document_date\n  is missing.\n"
  required_inputs:
  - name: deliverable_document
    type: file
    description: The client deliverable document to inspect
  - name: reference_date
    type: string
    description: Today's date in ISO-8601 format for currency check (YYYY-MM-DD)
    optional: true
  expected_outputs:
  - confidentiality_notice object with present, location, text, classification_level
  - version_control object with present, version_string, location
  - document_date object with present, date_string, date_parsed, is_current, location
  - change_log object with present, entry_count, location, latest_entry
  - final_output verdict (PASS, CONDITIONAL_PASS, FAIL)
  - risks array with severity ratings
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - confidentiality_notice
    - version_control
    - document_date
    - change_log
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
    properties:
      confidentiality_notice:
        type: object
        required:
        - present
        - location
        - text
        - classification_level
      version_control:
        type: object
        required:
        - present
        - version_string
        - location
      document_date:
        type: object
        required:
        - present
        - date_string
        - date_parsed
        - is_current
        - location
      change_log:
        type: object
        required:
        - present
        - entry_count
        - location
        - latest_entry
      final_output:
        type: string
        enum:
        - PASS
        - CONDITIONAL_PASS
        - FAIL
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - check: final_output is one of PASS, CONDITIONAL_PASS, FAIL
    match_field: final_output
    expected_values:
    - PASS
    - CONDITIONAL_PASS
    - FAIL
  - check: confidentiality_notice has all required sub-fields
    match_field: confidentiality_notice
    required_keys:
    - present
    - location
    - text
    - classification_level
  - check: version_control has all required sub-fields
    match_field: version_control
    required_keys:
    - present
    - version_string
    - location
  - check: document_date has all required sub-fields
    match_field: document_date
    required_keys:
    - present
    - date_string
    - date_parsed
    - is_current
    - location
  - check: change_log has all required sub-fields
    match_field: change_log
    required_keys:
    - present
    - entry_count
    - location
    - latest_entry
  - check: confidentiality_notice.present is boolean
    match_field: confidentiality_notice.present
    type: boolean
  - check: version_control.present is boolean
    match_field: version_control.present
    type: boolean
  - check: document_date.present is boolean
    match_field: document_date.present
    type: boolean
  - check: change_log.present is boolean
    match_field: change_log.present
    type: boolean
  - check: change_log.entry_count is integer >= 0
    match_field: change_log.entry_count
    type: integer
    minimum: 0
  - check: self_check.all_required_sections_completed is true
    match_field: self_check.all_required_sections_completed
    expected_value: true
  math_checks: []
  evidence_checks:
  - check: Every claim has a non-empty evidence_reference
    match_field: claims
    condition: all claims must have evidence_reference != '' and evidence_reference
      != null
  - check: If confidentiality_notice.present is true, location and text must be non-empty
    match_field: confidentiality_notice
    condition: if present == true, then location != '' AND text != '' AND classification_level
      != ''
  - check: If version_control.present is true, version_string and location must be
      non-empty
    match_field: version_control
    condition: if present == true, then version_string != '' AND location != ''
  - check: If document_date.present is true, date_string and location must be non-empty
    match_field: document_date
    condition: if present == true, then date_string != '' AND location != ''
  - check: risks array has evidence_reference for each entry
    match_field: risks
    condition: all risks must have non-empty evidence_reference
  flag_rules:
  - flag_id: missing_confidentiality_notice
    condition: confidentiality_notice.present == false
    severity: high
    message: Confidentiality notice is missing - this is a legal/compliance risk
  - flag_id: missing_version_number
    condition: version_control.present == false
    severity: high
    message: Version number is missing - clients cannot track document revisions
  - flag_id: missing_document_date
    condition: document_date.present == false
    severity: high
    message: Document date is missing - prevents currency verification
  - flag_id: stale_document_date
    condition: document_date.is_current == false
    severity: medium
    message: Document date is older than 30 days - may indicate outdated deliverable
  - flag_id: missing_change_log
    condition: change_log.present == false
    severity: low
    message: Change log is missing - reduces transparency for the client
  - flag_id: incomplete_self_check
    condition: self_check.all_required_sections_completed != true
    severity: high
    message: Agent did not complete all required self-check sections
  severity_mapping:
    honey: 'Change log missing or sparse (fewer than 2 entries). Does not block delivery
      but reduces client transparency. Result: CONDITIONAL_PASS.'
    jelly: 'Document date stale (>30 days) or version number format non-standard.
      These are significant but not delivery-blocking. Result: CONDITIONAL_PASS with
      notes.'
    propolis: 'Missing confidentiality notice, missing version number, or missing
      document date. These are legal/compliance failures that block delivery. Result:
      FAIL.'
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    inputs:
      deliverable_document: investment_memo_v3.pdf
      reference_date: '2025-01-15'
    expected_final_output: PASS | CONDITIONAL_PASS | FAIL
    notes: Human reviewer should verify the confidentiality notice text matches client's
      legal requirements.
- assignment_id: comp_data_privacy_gdpr_v1
  name: Data Privacy and GDPR Compliance
  lane: compliance_policy_checklist_eval
  version: '1.0'
  purpose: 'Evaluate the agent''s ability to assess data handling practices against
    GDPR and privacy requirements, categorize the types of data involved, and provide
    evidence for each privacy compliance determination.

    '
  operator_instructions: 'Provide a GDPR/privacy requirement checklist (6-10 requirements)
    and 1-3 source documents describing the organization''s data handling practices
    (e.g., privacy policy, data processing agreements, DPIA reports). Include requirements
    covering lawful basis, data subject rights, data retention, cross-border transfers,
    DPIA obligations, and breach notification. Include a mix of compliant, partially
    compliant, and non-compliant items. Include at least one item with ambiguous evidence.

    '
  agent_prompt: "You are given a data privacy/GDPR requirement checklist and source\
    \ documents describing an organization's data handling practices. Evaluate EACH\
    \ requirement.\nFor each privacy check, return an object with exactly these fields:\
    \ - \"requirement\": the exact privacy requirement text - \"data_category\": one\
    \ of [\"personal_data\", \"sensitive_personal_data\", \"special_category_data\"\
    , \"childrens_data\", \"financial_data\", \"biometric_data\", \"not_specified\"\
    ] indicating the primary data category this requirement applies to - \"status\"\
    : one of [\"compliant\", \"non_compliant\", \"partially_compliant\", \"not_assessable\"\
    ] where:\n    - \"compliant\" = evidence clearly shows the requirement is met\n\
    \    - \"non_compliant\" = evidence clearly shows the requirement is not met\n\
    \    - \"partially_compliant\" = some aspects met, others not\n    - \"not_assessable\"\
    \ = insufficient evidence to determine compliance\n- \"evidence\": the specific\
    \ text from source documents supporting the status (null if not_assessable) -\
    \ \"source_document\": identifier of the document containing the evidence (null\
    \ if not_assessable) - \"finding_details\": a brief explanation of the compliance\
    \ determination (max 200 chars) - \"article_reference\": the specific GDPR article\
    \ or regulation reference (e.g., \"GDPR Art. 6\", \"Art. 32\", \"Art. 33\") if\
    \ applicable; null if not specified in the requirement\nReturn ONLY a JSON object\
    \ with this exact shape: {\n  \"assignment_id\": \"comp_data_privacy_gdpr_v1\"\
    ,\n  \"agent_summary\": \"<summary of GDPR/privacy compliance evaluation>\",\n\
    \  \"inputs_used\": [\"privacy_requirement_checklist\", \"<document identifiers>\"\
    ],\n  \"missing_inputs\": [],\n  \"privacy_checks\": [\n    {\"requirement\":\
    \ \"Process personal data only with lawful basis\", \"data_category\": \"personal_data\"\
    , \"status\": \"compliant\", \"evidence\": \"Privacy policy lists six lawful bases\
    \ and requires documented legal basis for each processing activity\", \"source_document\"\
    : \"doc_1\", \"finding_details\": \"Lawful basis documented for all processing\
    \ activities reviewed\", \"article_reference\": \"GDPR Art. 6\"}\n  ],\n  \"claims\"\
    : [],\n  \"calculations\": [],\n  \"risks\": [],\n  \"assumptions\": [],\n  \"\
    open_questions\": [],\n  \"final_output\": \"<summary>\",\n  \"self_check\": {\n\
    \    \"all_required_sections_completed\": true,\n    \"all_numbers_have_sources\"\
    : true,\n    \"assumptions_labeled\": true,\n    \"missing_inputs_disclosed\"\
    : true\n  }\n}\nRules: - Every requirement in the input privacy_requirement_checklist\
    \ must appear in privacy_checks. - Do NOT change the requirement text. - data_category\
    \ must be from the allowed enum; choose the most specific applicable category.\
    \ - evidence must be a direct quote or close paraphrase from source documents.\
    \ - article_reference should be extracted from the requirement if present; otherwise\
    \ set to null. - Default to \"not_assessable\" when evidence is insufficient rather\
    \ than inferring compliance. - finding_details must explain the reasoning behind\
    \ the status assignment.\n"
  required_inputs:
  - name: privacy_requirement_checklist
    type: array_of_objects
    description: List of GDPR/privacy requirements with optional article_reference
      fields.
    count: 6-10
  - name: source_documents
    type: array_of_text
    description: Documents describing data handling practices (privacy policy, DPIA,
      DPA).
    count: 1-3
  expected_outputs:
  - privacy_checks array with requirement, data_category, status, evidence, source_document,
    finding_details, article_reference
  - All input requirements accounted for
  - Data category classification per requirement
  - GDPR article references where applicable
  - Self-check object
  required_output_schema:
    type: object
    required:
    - assignment_id
    - privacy_checks
    - inputs_used
    - missing_inputs
    - self_check
    properties:
      assignment_id:
        type: string
        const: comp_data_privacy_gdpr_v1
      privacy_checks:
        type: array
        items:
          type: object
          required:
          - requirement
          - data_category
          - status
          - evidence
          - source_document
          - finding_details
          - article_reference
          properties:
            requirement:
              type: string
              minLength: 1
            data_category:
              type: string
              enum:
              - personal_data
              - sensitive_personal_data
              - special_category_data
              - childrens_data
              - financial_data
              - biometric_data
              - not_specified
            status:
              type: string
              enum:
              - compliant
              - non_compliant
              - partially_compliant
              - not_assessable
            evidence:
              type:
              - string
              - 'null'
            source_document:
              type:
              - string
              - 'null'
            finding_details:
              type: string
              minLength: 1
            article_reference:
              type:
              - string
              - 'null'
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - description: All status values must be in [compliant, non_compliant, partially_compliant,
      not_assessable].
    method: Enum validation against schema.
  - description: All data_category values must be in [personal_data, sensitive_personal_data,
      special_category_data, childrens_data, financial_data, biometric_data, not_specified].
    method: Enum validation against schema.
  - description: Every requirement in the input checklist must appear in privacy_checks[].requirement.
    method: Set equality check — input requirements set equals output requirements
      set.
  - description: privacy_checks array length must equal input privacy_requirement_checklist
      length.
    method: Length equality check.
  - description: If status is compliant, partially_compliant, or non_compliant, evidence
      and source_document must be non-null.
    method: Conditional non-null check.
  - description: If status is not_assessable, evidence and source_document should
      be null.
    method: Conditional null check.
  - description: finding_details must be non-empty for every privacy check.
    method: String length check > 0.
  math_checks: []
  evidence_checks:
  - description: For compliant/partially_compliant/non_compliant items, verify evidence
      text exists in the stated source document.
    method: Substring search evidence against source_documents.
  - description: Verify data_category classification is appropriate for the requirement.
    method: Review data_category assignments against requirement text by evaluator.
  - description: Verify article_reference values match references in the input requirement
      list.
    method: Cross-check privacy_checks[].article_reference against input checklist.
  - description: Verify no requirements were omitted from the output privacy_checks
      array.
    method: Cross-check output array length and requirement texts against input checklist.
  flag_rules:
  - flag_id: missing_requirement
    condition: Input requirement not present in privacy_checks
    severity: propolis
  - flag_id: fabricated_evidence
    condition: evidence text not found in stated source document
    severity: honey
  - flag_id: invalid_status
    condition: status not in [compliant, non_compliant, partially_compliant, not_assessable]
    severity: honey
  - flag_id: invalid_data_category
    condition: data_category not in allowed enum
    severity: honey
  - flag_id: compliant_without_evidence
    condition: status is compliant AND evidence is null
    severity: jelly
  - flag_id: not_assessable_with_evidence
    condition: status is not_assessable AND evidence is non-null
    severity: jelly
  - flag_id: missing_finding_details
    condition: finding_details is empty or null
    severity: jelly
  - flag_id: privacy_check_count_mismatch
    condition: len(privacy_checks) != len(input privacy_requirement_checklist)
    severity: propolis
  - flag_id: self_check_false
    condition: any self_check boolean is false
    severity: jelly
  severity_mapping:
    honey: Minor error — fabricated evidence or invalid enum on single check
    jelly: Moderate error — status/evidence logic inconsistency
    propolis: Critical error — missing requirements or count mismatch
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: comp_data_privacy_gdpr_v1
    agent_summary: 'Evaluated 7 privacy requirements: 4 compliant, 2 partially compliant,
      1 not assessable'
    inputs_used:
    - privacy_requirement_checklist
    - doc_1
    - doc_2
    missing_inputs: []
    claims: []
    calculations: []
    risks: []
    assumptions:
    - Assessment based solely on provided source documents
    - GDPR article references extracted from requirement descriptions where available
    open_questions: []
    privacy_checks:
    - requirement: Process personal data only with documented lawful basis
      data_category: personal_data
      status: compliant
      evidence: Privacy policy lists six lawful bases and requires documented legal
        basis for each processing activity
      source_document: doc_1
      finding_details: Lawful basis documented for all processing activities reviewed
      article_reference: GDPR Art. 6
    - requirement: Implement data protection impact assessments for high-risk processing
      data_category: sensitive_personal_data
      status: partially_compliant
      evidence: DPIAs are conducted for some high-risk processing but not consistently
        across all qualifying activities
      source_document: doc_2
      finding_details: DPIA policy exists but implementation gaps remain for newly
        launched processing activities
      article_reference: GDPR Art. 35
    - requirement: Notify supervisory authority of personal data breaches within 72
        hours
      data_category: personal_data
      status: not_assessable
      evidence: null
      source_document: null
      finding_details: Source documents do not contain breach notification procedures
        or historical breach records
      article_reference: GDPR Art. 33
    final_output: '7 privacy checks: 4 compliant, 2 partially compliant, 1 not assessable'
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: comp_internal_policy_audit_v1
  name: Internal Policy Audit
  lane: compliance_policy_checklist_eval
  version: '1.0'
  purpose: 'Evaluate the agent''s ability to audit adherence to internal organizational
    policies, document control test results, and cite evidence for each policy item
    assessed. The agent must distinguish between policies that are followed, partially
    followed, and not followed based on documentary evidence.

    '
  operator_instructions: 'Provide an internal policy list (5-8 policies) with policy
    IDs, along with 1-3 source documents (e.g., policy manuals, audit reports, employee
    handbooks) that describe actual practices. Include a mix of fully adhered, partially
    adhered, and violated policies. Include at least one policy where evidence is
    ambiguous or contradictory.

    '
  agent_prompt: "You are given an internal policy list and source documents describing\
    \ actual organizational practices. Audit EACH policy and determine adherence status.\n\
    For each policy item, return an object with exactly these fields: - \"policy_id\"\
    : the identifier of the policy (e.g., \"POL-001\", \"HR-2023-04\") - \"policy_name\"\
    : the name or brief description of the policy - \"status\": one of [\"adhered\"\
    , \"violated\", \"partially_adhered\", \"not_verifiable\"] where:\n    - \"adhered\"\
    \ = evidence shows the policy is fully followed\n    - \"violated\" = evidence\
    \ shows clear violation or non-compliance\n    - \"partially_adhered\" = some\
    \ aspects followed, others not\n    - \"not_verifiable\" = insufficient evidence\
    \ to determine adherence\n- \"test_result\": a description of the specific control\
    \ test performed to determine status (max 200 chars) - \"evidence\": the specific\
    \ text from source documents supporting the test_result (null if not_verifiable)\
    \ - \"source_document\": identifier of the document containing the evidence (null\
    \ if not_verifiable) - \"deviation_details\": if status is violated or partially_adhered,\
    \ describe the specific deviation; otherwise null\nReturn ONLY a JSON object with\
    \ this exact shape: {\n  \"assignment_id\": \"comp_internal_policy_audit_v1\"\
    ,\n  \"agent_summary\": \"<summary of internal policy audit>\",\n  \"inputs_used\"\
    : [\"internal_policy_list\", \"<document identifiers>\"],\n  \"missing_inputs\"\
    : [],\n  \"policy_items\": [\n    {\"policy_id\": \"POL-001\", \"policy_name\"\
    : \"Password complexity requirements\", \"status\": \"adhered\", \"test_result\"\
    : \"Reviewed IT policy doc and found mandated 12-char minimum with special characters\"\
    , \"evidence\": \"All passwords must be at least 12 characters and include one\
    \ special character\", \"source_document\": \"doc_1\", \"deviation_details\":\
    \ null}\n  ],\n  \"claims\": [],\n  \"calculations\": [],\n  \"risks\": [],\n\
    \  \"assumptions\": [],\n  \"open_questions\": [],\n  \"final_output\": \"<summary>\"\
    ,\n  \"self_check\": {\n    \"all_required_sections_completed\": true,\n    \"\
    all_numbers_have_sources\": true,\n    \"assumptions_labeled\": true,\n    \"\
    missing_inputs_disclosed\": true\n  }\n}\nRules: - Every policy in the input internal_policy_list\
    \ must appear in policy_items. - Do NOT change policy_id or policy_name from the\
    \ input list. - test_result must describe WHAT you checked and WHAT you found,\
    \ not just a conclusion. - evidence must be a direct quote or close paraphrase\
    \ from source documents. - deviation_details must be non-null whenever status\
    \ is violated or partially_adhered. - Default to \"not_verifiable\" when evidence\
    \ is insufficient.\n"
  required_inputs:
  - name: internal_policy_list
    type: array_of_objects
    description: List of internal policies with policy_id and policy_name fields.
    count: 5-8
  - name: source_documents
    type: array_of_text
    description: Documents describing actual organizational practices.
    count: 1-3
  expected_outputs:
  - policy_items array with policy_id, policy_name, status, test_result, evidence,
    source_document, deviation_details
  - All input policies accounted for
  - Control test documented for each policy
  - Evidence quotes traceable to source documents
  - Self-check object
  required_output_schema:
    type: object
    required:
    - assignment_id
    - policy_items
    - inputs_used
    - missing_inputs
    - self_check
    properties:
      assignment_id:
        type: string
        const: comp_internal_policy_audit_v1
      policy_items:
        type: array
        items:
          type: object
          required:
          - policy_id
          - policy_name
          - status
          - test_result
          - evidence
          - source_document
          - deviation_details
          properties:
            policy_id:
              type: string
              minLength: 1
            policy_name:
              type: string
              minLength: 1
            status:
              type: string
              enum:
              - adhered
              - violated
              - partially_adhered
              - not_verifiable
            test_result:
              type: string
              minLength: 1
            evidence:
              type:
              - string
              - 'null'
            source_document:
              type:
              - string
              - 'null'
            deviation_details:
              type:
              - string
              - 'null'
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - description: All status values must be in [adhered, violated, partially_adhered,
      not_verifiable].
    method: Enum validation against schema.
  - description: Every policy in the input internal_policy_list must appear in policy_items[].policy_id.
    method: Set equality check — input policy_id set equals output policy_id set.
  - description: policy_items array length must equal input internal_policy_list length.
    method: Length equality check.
  - description: If status is violated or partially_adhered, deviation_details must
      be non-null non-empty string.
    method: Conditional non-null check on deviation_details.
  - description: If status is adhered or not_verifiable, deviation_details must be
      null.
    method: Conditional null check on deviation_details.
  - description: If status is adhered, violated, or partially_adhered, evidence and
      source_document must be non-null.
    method: Conditional non-null check on evidence and source_document.
  - description: test_result must be non-empty for every policy item.
    method: String length check > 0.
  math_checks: []
  evidence_checks:
  - description: For adhered/violated/partially_adhered items, verify evidence text
      exists in the stated source document.
    method: Substring search evidence against source_documents.
  - description: Verify status assignments are supported by the evidence and test_result
      description.
    method: Review sample of status+test_result+evidence triplets by evaluator.
  - description: Verify deviation_details accurately describes the specific deviation
      when status is violated/partially_adhered.
    method: Compare deviation_details against evidence text.
  flag_rules:
  - flag_id: missing_policy
    condition: Input policy not present in policy_items
    severity: propolis
  - flag_id: fabricated_evidence
    condition: evidence text not found in stated source document
    severity: honey
  - flag_id: invalid_status
    condition: status not in [adhered, violated, partially_adhered, not_verifiable]
    severity: honey
  - flag_id: violated_without_deviation
    condition: status is violated or partially_adhered AND deviation_details is null
    severity: jelly
  - flag_id: deviation_when_adhered
    condition: status is adhered AND deviation_details is non-null
    severity: jelly
  - flag_id: missing_test_result
    condition: test_result is empty or null
    severity: jelly
  - flag_id: policy_count_mismatch
    condition: len(policy_items) != len(input internal_policy_list)
    severity: propolis
  - flag_id: self_check_false
    condition: any self_check boolean is false
    severity: jelly
  severity_mapping:
    honey: Minor error — fabricated evidence on single policy
    jelly: Moderate error — status/deviation logic inconsistency
    propolis: Critical error — missing policies or count mismatch
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: comp_internal_policy_audit_v1
    agent_summary: 'Audited 5 internal policies: 2 adhered, 2 partially adhered, 1
      violated'
    inputs_used:
    - internal_policy_list
    - doc_1
    - doc_2
    missing_inputs: []
    claims: []
    calculations: []
    risks: []
    assumptions:
    - Audit limited to evidence in provided source documents
    open_questions: []
    policy_items:
    - policy_id: POL-001
      policy_name: Password complexity requirements
      status: adhered
      test_result: Reviewed IT security policy; confirms 12-character minimum with
        special characters required
      evidence: All passwords must be at least 12 characters and include one uppercase,
        one lowercase, one number, and one special character
      source_document: doc_1
      deviation_details: null
    - policy_id: POL-002
      policy_name: Quarterly access reviews
      status: partially_adhered
      test_result: Found evidence of Q1 and Q2 reviews but no Q3 review documentation
      evidence: Access reviews completed for Q1 2024 and Q2 2024; Q3 review pending
      source_document: doc_2
      deviation_details: Q3 2024 access review was not completed by the required deadline;
        only 2 of 3 quarterly reviews performed
    - policy_id: POL-003
      policy_name: Data retention 7-year minimum
      status: violated
      test_result: Found retention policy specifies 3 years, not the required 7 years
      evidence: Customer records are retained for a period of three years from account
        closure
      source_document: doc_1
      deviation_details: Policy mandates 7-year retention but actual practice limits
        retention to 3 years; 4-year gap in retention compliance
    final_output: '5 policies audited: 2 adhered, 2 partially adhered, 1 violated'
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
