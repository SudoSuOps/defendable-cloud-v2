    pass_on_true: true
  - description: All calculation results must be numeric
    condition: all calc in calculations have typeof calc.result == "number"
    pass_on_true: true
  - description: EBITDA must equal Revenue - COGS - OpEx + D&A
    condition: abs(ebitda_result - (revenue - cogs - operating_expenses + depreciation
      + amortization)) < 0.01
    pass_on_true: true
  - description: NPV intermediate steps must be present
    condition: npv_calculation.intermediate_steps is array AND length > 0
    pass_on_true: true
  - description: NPV must equal sum of discounted cash flows
    condition: abs(npv_result - sum(discounted_cfs)) < 0.01
