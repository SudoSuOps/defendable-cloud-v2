  - formula_id: npv_formula
    description: NPV = sum of discounted cash flows
    formula: npv = sum(cf_t / (1 + r) ^ t) for t = 0..n
    expected_precision: 0.01
    variables:
    - name: cash_flows
      type: array
    - name: discount_rate
      type: number
