    result_field: calculations[?name=='debt_to_equity_ratio'].result
  evidence_checks:
  - check_id: input_values_in_calculations
    description: All five input values must appear in the inputs sub-objects of the
      three calculations
    evidence_must_match_claim: true
  - check_id: formulas_exact_match
    description: Formulas must match the exact specified formula strings
    required: true
  flag_rules:
  - flag_id: missing_calculation
    condition: calculations.length < 3
    severity: propolis
    message: Not all three required ratio calculations are present
  - flag_id: non_numeric_result
    condition: any calculation has non-numeric result
    severity: propolis
    message: One or more calculation results are not numeric
  - flag_id: zero_current_liabilities
    condition: current_liabilities == 0
    severity: honey
    message: Current liabilities is zero — current and quick ratios undefined
  - flag_id: zero_equity
    condition: shareholders_equity == 0
    severity: honey
    message: Shareholders equity is zero — debt-to-equity ratio undefined
  - flag_id: current_ratio_mismatch
    condition: abs(current_ratio_calc - (current_assets / current_liabilities)) >=
      0.001
    severity: propolis
    message: Current ratio calculation does not match formula
  - flag_id: quick_ratio_mismatch
    condition: abs(quick_ratio_calc - ((current_assets - inventory) / current_liabilities))
      >= 0.001
    severity: propolis
    message: Quick ratio calculation does not match formula
  - flag_id: debt_equity_mismatch
    condition: abs(debt_to_equity_calc - (total_debt / shareholders_equity)) >= 0.001
    severity: propolis
    message: Debt-to-equity ratio calculation does not match formula
  - flag_id: pass_with_zero_divisor
    condition: final_output == "PASS" AND (current_liabilities == 0 OR shareholders_equity
      == 0)
    severity: propolis
    message: final_output is PASS but a divisor is zero
  severity_mapping:
    honey: Minor issue — zero divisor input (prevents one or more ratio calculations)
    jelly: Moderate issue — incomplete calculation metadata or missing assumptions
    propolis: Critical issue — formula result mismatch, non-numeric results, missing
      calculations, or false PASS with zero divisor
  receipt_type: eval_receipt
  recommended_human_review: false
  sample_submission_shape:
    assignment_id: fin_ratio_analysis_v1
    agent_summary: Current ratio is 2.5, quick ratio is 1.8, D/E ratio is 0.6.
    inputs_used:
    - current_assets
    - current_liabilities
    - inventory
    - total_debt
    - shareholders_equity
    missing_inputs: []
    claims:
    - claim: Current ratio is 2.5
      evidence_reference: 'Calculation: 500000 / 200000 = 2.5'
      confidence: provided
    - claim: Quick ratio is 1.8
      evidence_reference: 'Calculation: (500000 - 140000) / 200000 = 1.8'
      confidence: provided
    calculations:
    - name: current_ratio
      formula: Current Assets / Current Liabilities
      inputs:
        current_assets: 500000
        current_liabilities: 200000
      result: 2.5
      units: ratio
      assumptions: []
    - name: quick_ratio
      formula: (Current Assets - Inventory) / Current Liabilities
      inputs:
        current_assets: 500000
        inventory: 140000
        current_liabilities: 200000
      result: 1.8
      units: ratio
      assumptions: []
    - name: debt_to_equity_ratio
      formula: Total Debt / Shareholders Equity
      inputs:
        total_debt: 300000
        shareholders_equity: 500000
      result: 0.6
      units: ratio
      assumptions: []
    risks: []
    assumptions:
    - All values from the same balance sheet reporting date
    open_questions: []
    final_output: PASS
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: fin_wacc_calculation_v1
  name: WACC Calculation
  lane: financial_math_reasoning_eval
  version: '1.0'
  purpose: Calculate the Weighted Average Cost of Capital (WACC) from equity, debt,
    costs of capital, and tax rate. WACC is a critical discount rate for investment
    decisions and must be computed with all component values disclosed.
  operator_instructions: Provide the agent with total equity, total debt, cost of
    equity, cost of debt, and tax rate. The agent must compute WACC using the standard
    formula, show all component values including weights and after-tax cost of debt,
    and return structured JSON.
  agent_prompt: "You are calculating the Weighted Average Cost of Capital (WACC).\n\
    \nGiven the financial inputs, compute WACC using the exact formula:\n\n1. Total\
    \ Capital = Total Equity + Total Debt\n2. Weight of Equity (E/V) = Total Equity\
    \ / Total Capital\n3. Weight of Debt (D/V) = Total Debt / Total Capital\n4. After-Tax\
    \ Cost of Debt = Cost of Debt * (1 - Tax Rate)\n5. WACC = (E/V * Cost of Equity)\
    \ + (D/V * After-Tax Cost of Debt)\n\nReturn a single JSON object with this exact\
    \ structure:\n{\n  \"assignment_id\": \"fin_wacc_calculation_v1\",\n  \"agent_summary\"\
    : \"One sentence summary\",\n  \"inputs_used\": [\"total_equity\", \"total_debt\"\
    , \"cost_of_equity\", \"cost_of_debt\", \"tax_rate\"],\n  \"missing_inputs\":\
    \ [\"any missing inputs\"],\n  \"claims\": [\n    {\"claim\": \"\", \"evidence_reference\"\
    : \"\", \"confidence\": \"provided | inferred | missing\"}\n  ],\n  \"calculations\"\
    : [\n    {\n      \"name\": \"total_capital\",\n      \"formula\": \"Total Equity\
    \ + Total Debt\",\n      \"inputs\": {\"total_equity\": 0, \"total_debt\": 0},\n\
    \      \"result\": 0,\n      \"units\": \"currency\",\n      \"assumptions\":\
    \ []\n    },\n    {\n      \"name\": \"weight_of_equity\",\n      \"formula\"\
    : \"Total Equity / Total Capital\",\n      \"inputs\": {\"total_equity\": 0, \"\
    total_capital\": 0},\n      \"result\": 0,\n      \"units\": \"ratio\",\n    \
    \  \"assumptions\": []\n    },\n    {\n      \"name\": \"weight_of_debt\",\n \
    \     \"formula\": \"Total Debt / Total Capital\",\n      \"inputs\": {\"total_debt\"\
    : 0, \"total_capital\": 0},\n      \"result\": 0,\n      \"units\": \"ratio\"\
    ,\n      \"assumptions\": []\n    },\n    {\n      \"name\": \"after_tax_cost_of_debt\"\
    ,\n      \"formula\": \"Cost of Debt * (1 - Tax Rate)\",\n      \"inputs\": {\"\
    cost_of_debt\": 0, \"tax_rate\": 0},\n      \"result\": 0,\n      \"units\": \"\
    ratio\",\n      \"assumptions\": []\n    },\n    {\n      \"name\": \"wacc\",\n\
    \      \"formula\": \"(E/V * Cost of Equity) + (D/V * After-Tax Cost of Debt)\"\
    ,\n      \"inputs\": {\"weight_of_equity\": 0, \"cost_of_equity\": 0, \"weight_of_debt\"\
    : 0, \"after_tax_cost_of_debt\": 0},\n      \"result\": 0,\n      \"units\": \"\
    ratio\",\n      \"assumptions\": []\n    }\n  ],\n  \"risks\": [\n    {\"risk\"\
    : \"\", \"severity\": \"low | medium | high\", \"evidence_reference\": \"\"}\n\
    \  ],\n  \"assumptions\": [],\n  \"open_questions\": [],\n  \"final_output\":\
    \ \"PASS or FAIL\",\n  \"self_check\": {\n    \"all_required_sections_completed\"\
    : true,\n    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\"\
    : true,\n    \"missing_inputs_disclosed\": true\n  }\n}\n\nRules:\n- ALL input\
    \ values must be echoed in each calculation's inputs sub-object\n- result must\
    \ be a numeric value (not a string)\n- cost_of_equity, cost_of_debt, and tax_rate\
    \ must be in decimal form (e.g., 0.12 for 12%)\n- Tax rate must be between 0 and\
    \ 1 (0% to 100%)\n- total_capital must equal total_equity + total_debt\n- weight_of_equity\
    \ + weight_of_debt must equal 1.0 (within rounding tolerance)\n- final_output\
    \ is PASS if all 5 calculations are present with numeric results AND weights sum\
    \ to 1.0\n- final_output is FAIL if total_capital == 0 OR tax_rate < 0 OR tax_rate\
    \ > 1\n- Show formulas exactly as specified\n- WACC result must be expressed as\
    \ a decimal ratio (not percentage)\n\nReturn only the JSON. No markdown fences,\
    \ no prose.\n"
  required_inputs:
  - name: total_equity
    type: number
    description: Total market value of equity
    required: true
  - name: total_debt
    type: number
    description: Total market value of debt
    required: true
  - name: cost_of_equity
    type: number
    description: Cost of equity as decimal (e.g., 0.10 for 10%)
    required: true
  - name: cost_of_debt
    type: number
    description: Cost of debt as decimal (e.g., 0.05 for 5%)
    required: true
  - name: tax_rate
    type: number
    description: Corporate tax rate as decimal (e.g., 0.25 for 25%)
    required: true
  expected_outputs:
  - calculations array with total_capital, weight_of_equity, weight_of_debt, after_tax_cost_of_debt,
    wacc
  - Each calculation must have name, formula, inputs, result (numeric), units, assumptions
  - final_output PASS or FAIL
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - calculations
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
    properties:
      assignment_id:
        type: string
        const: fin_wacc_calculation_v1
      agent_summary:
        type: string
        minLength: 1
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      claims:
        type: array
        items:
          type: object
          required:
          - claim
          - evidence_reference
          - confidence
          properties:
            claim:
              type: string
            evidence_reference:
              type: string
            confidence:
              enum:
              - provided
              - inferred
              - missing
      calculations:
        type: array
        minItems: 5
        items:
          type: object
          required:
          - name
          - formula
          - inputs
          - result
          - units
          - assumptions
          properties:
            name:
              type: string
            formula:
              type: string
            inputs:
              type: object
            result:
              type: number
            units:
              type: string
            assumptions:
              type: array
              items:
                type: string
      risks:
        type: array
        items:
          type: object
          required:
          - risk
          - severity
          - evidence_reference
          properties:
            risk:
              type: string
            severity:
              enum:
              - low
              - medium
              - high
            evidence_reference:
              type: string
      assumptions:
        type: array
        items:
          type: string
      open_questions:
        type: array
        items:
          type: string
      final_output:
        type: string
        enum:
        - PASS
        - FAIL
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
        properties:
          all_required_sections_completed:
            type: boolean
            const: true
          all_numbers_have_sources:
            type: boolean
            const: true
          assumptions_labeled:
            type: boolean
            const: true
          missing_inputs_disclosed:
            type: boolean
            const: true
  deterministic_checks:
  - description: Must have exactly 5 calculations
    condition: calculations.length == 5
    pass_on_true: true
  - description: All calculation results must be numeric
    condition: all calc in calculations have typeof calc.result == "number"
    pass_on_true: true
  - description: total_capital must equal total_equity + total_debt
    condition: abs(total_capital_result - (total_equity + total_debt)) < 0.01
    pass_on_true: true
  - description: Weights must sum to 1.0
    condition: abs(weight_of_equity_result + weight_of_debt_result - 1.0) < 0.001
    pass_on_true: true
  - description: after_tax_cost_of_debt must equal cost_of_debt * (1 - tax_rate)
    condition: abs(after_tax_cost_of_debt_result - (cost_of_debt * (1 - tax_rate)))
      < 0.0001
    pass_on_true: true
  - description: WACC must equal (E/V * Ke) + (D/V * Kd_after_tax)
    condition: abs(wacc_result - ((weight_of_equity_result * cost_of_equity) + (weight_of_debt_result
      * after_tax_cost_of_debt_result))) < 0.0001
    pass_on_true: true
  - description: Tax rate must be between 0 and 1
    condition: tax_rate >= 0 AND tax_rate <= 1
    pass_on_true: true
  math_checks:
  - formula_id: total_capital_formula
    description: Total Capital = Total Equity + Total Debt
    formula: total_capital = total_equity + total_debt
    expected_precision: 0.01
    variables:
    - name: total_equity
      type: number
    - name: total_debt
      type: number
    result_field: calculations[?name=='total_capital'].result
  - formula_id: weight_equity_formula
    description: Weight of Equity = Total Equity / Total Capital
    formula: weight_of_equity = total_equity / total_capital
    expected_precision: 0.001
    variables:
    - name: total_equity
      type: number
    - name: total_capital
      type: number
    result_field: calculations[?name=='weight_of_equity'].result
  - formula_id: weight_debt_formula
    description: Weight of Debt = Total Debt / Total Capital
    formula: weight_of_debt = total_debt / total_capital
    expected_precision: 0.001
    variables:
    - name: total_debt
      type: number
    - name: total_capital
      type: number
    result_field: calculations[?name=='weight_of_debt'].result
  - formula_id: after_tax_cost_debt_formula
    description: After-Tax Cost of Debt = Cost of Debt * (1 - Tax Rate)
    formula: after_tax_cost_of_debt = cost_of_debt * (1 - tax_rate)
    expected_precision: 0.0001
    variables:
    - name: cost_of_debt
      type: number
    - name: tax_rate
      type: number
    result_field: calculations[?name=='after_tax_cost_of_debt'].result
  - formula_id: wacc_formula
    description: WACC = (E/V * Ke) + (D/V * Kd_after_tax)
    formula: wacc = (weight_of_equity * cost_of_equity) + (weight_of_debt * after_tax_cost_of_debt)
    expected_precision: 0.0001
    variables:
    - name: weight_of_equity
      type: number
    - name: cost_of_equity
      type: number
    - name: weight_of_debt
      type: number
    - name: after_tax_cost_of_debt
      type: number
    result_field: calculations[?name=='wacc'].result
  evidence_checks:
  - check_id: all_inputs_echoed
    description: All five input values must appear across the calculations' inputs
      sub-objects
    evidence_must_match_claim: true
  - check_id: formulas_exact_match
    description: All five formulas must match the exact specified formula strings
    required: true
  - check_id: weights_sum_verification
    description: weight_of_equity + weight_of_debt must equal 1.0 within 0.001 tolerance
    required: true
  flag_rules:
  - flag_id: missing_calculation
    condition: calculations.length < 5
    severity: propolis
    message: Not all 5 WACC component calculations are present
  - flag_id: non_numeric_result
    condition: any calculation has non-numeric result
    severity: propolis
    message: One or more calculation results are not numeric
  - flag_id: total_capital_mismatch
    condition: abs(total_capital_calc - (total_equity + total_debt)) >= 0.01
    severity: propolis
    message: Total capital does not equal equity plus debt
  - flag_id: weights_sum_error
    condition: abs(weight_equity + weight_debt - 1.0) >= 0.001
    severity: propolis
    message: Weights of equity and debt do not sum to 1.0
  - flag_id: after_tax_cost_mismatch
    condition: abs(after_tax_cost_calc - (cost_of_debt * (1 - tax_rate))) >= 0.0001
    severity: propolis
    message: After-tax cost of debt calculation is incorrect
  - flag_id: wacc_mismatch
    condition: abs(wacc_calc - ((weight_equity * cost_of_equity) + (weight_debt *
      after_tax_cost_calc))) >= 0.0001
    severity: propolis
    message: WACC calculation does not match the formula
  - flag_id: invalid_tax_rate
    condition: tax_rate < 0 OR tax_rate > 1
    severity: honey
    message: Tax rate is outside valid range [0, 1]
  - flag_id: zero_total_capital
    condition: total_capital == 0
    severity: honey
    message: Total capital is zero — WACC is undefined
  - flag_id: false_pass_invalid
    condition: final_output == "PASS" AND (tax_rate < 0 OR tax_rate > 1 OR total_capital
      == 0)
    severity: propolis
    message: final_output is PASS but inputs are invalid
  severity_mapping:
    honey: Minor issue — invalid tax rate range or zero total capital
    jelly: Moderate issue — missing intermediate calculation or incomplete metadata
    propolis: Critical issue — any formula mismatch, weights not summing to 1.0, non-numeric
      results, missing calculations, or false PASS
  receipt_type: eval_receipt
  recommended_human_review: false
  sample_submission_shape:
    assignment_id: fin_wacc_calculation_v1
    agent_summary: WACC is 8.45% with 60% equity weight and 40% debt weight.
    inputs_used:
    - total_equity
    - total_debt
    - cost_of_equity
    - cost_of_debt
    - tax_rate
    missing_inputs: []
    claims:
    - claim: WACC is 8.45%
      evidence_reference: 'Calculation: (0.6 * 0.10) + (0.4 * 0.045) = 0.0845'
      confidence: provided
    calculations:
    - name: total_capital
      formula: Total Equity + Total Debt
      inputs:
        total_equity: 600000
        total_debt: 400000
      result: 1000000
      units: USD
      assumptions: []
    - name: weight_of_equity
      formula: Total Equity / Total Capital
      inputs:
        total_equity: 600000
        total_capital: 1000000
      result: 0.6
      units: ratio
      assumptions: []
    - name: weight_of_debt
      formula: Total Debt / Total Capital
      inputs:
        total_debt: 400000
        total_capital: 1000000
      result: 0.4
      units: ratio
      assumptions: []
    - name: after_tax_cost_of_debt
      formula: Cost of Debt * (1 - Tax Rate)
      inputs:
        cost_of_debt: 0.06
        tax_rate: 0.25
      result: 0.045
      units: ratio
      assumptions: []
    - name: wacc
      formula: (E/V * Cost of Equity) + (D/V * After-Tax Cost of Debt)
      inputs:
        weight_of_equity: 0.6
        cost_of_equity: 0.1
        weight_of_debt: 0.4
        after_tax_cost_of_debt: 0.045
      result: 0.0845
      units: ratio
      assumptions: []
    risks: []
    assumptions:
    - Market values of equity and debt are used
    - Tax rate is marginal corporate rate
    open_questions: []
    final_output: PASS
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: genai_chain_of_thought_v1
  name: Chain of Thought Documentation
  lane: general_ai_agent_work_eval
  version: '1.0'
  purpose: 'Test whether the agent documents its reasoning steps explicitly and labels
    every assumption. Agents that produce answers without visible reasoning cannot
    be audited or debugged.

    '
  operator_instructions: "1. Provide the agent with a multi-step analytical problem.\
    \ 2. Require the agent to document every reasoning step in the\n   calculations[].assumptions\
    \ and assumptions fields.\n3. Verify that every calculation entry has a non-empty\
    \ assumptions array. 4. Verify that the top-level assumptions array is non-empty.\
    \ 5. Publish eval_receipt with results.\n"
  agent_prompt: "Solve the following problem and document every step of your reasoning.\n\
    Problem: A property generates $500,000 in gross potential rent. Vacancy and collection\
    \ loss is 8%. Operating expenses are $175,000. The property was purchased for\
    \ $3,200,000. Calculate the Net Operating Income (NOI) and the capitalization\
    \ rate.\nYou must return a single JSON object with exactly this structure: {\n\
    \  \"assignment_id\": \"genai_chain_of_thought_v1\",\n  \"agent_summary\": \"\
    <string: one-sentence summary>\",\n  \"inputs_used\": [\"<string: each input you\
    \ used>\"],\n  \"missing_inputs\": [\"<string: any inputs you expected but did\
    \ not receive>\"],\n  \"claims\": [\n    {\n      \"claim\": \"<string>\",\n \
    \     \"evidence_reference\": \"<string>\",\n      \"confidence\": \"<provided\
    \ | inferred | missing>\"\n    }\n  ],\n  \"calculations\": [\n    {\n      \"\
    name\": \"<string: descriptive name>\",\n      \"formula\": \"<string: formula\
    \ in plain text>\",\n      \"inputs\": {\"<key>\": <number>},\n      \"result\"\
    : <number>,\n      \"units\": \"<string>\",\n      \"assumptions\": [\"<string:\
    \ every assumption you made for this calc>\"]\n    }\n  ],\n  \"risks\": [\n \
    \   {\n      \"risk\": \"<string>\",\n      \"severity\": \"<low | medium | high>\"\
    ,\n      \"evidence_reference\": \"<string>\"\n    }\n  ],\n  \"assumptions\"\
    : [\"<string: every global assumption>\"],\n  \"open_questions\": [\"<string>\"\
    ],\n  \"final_output\": \"<string: concise final answer>\",\n  \"self_check\"\
    : {\n    \"all_required_sections_completed\": true,\n    \"all_numbers_have_sources\"\
    : true,\n    \"assumptions_labeled\": true,\n    \"missing_inputs_disclosed\"\
    : true\n  }\n}\nRules: - Every calculation in calculations[] must include at least\
    \ one assumption\n  in its assumptions array. Explain WHY you chose each input\
    \ value.\n- The top-level assumptions[] array must contain at least 2 distinct\n\
    \  assumptions.\n- For each number used, state its source in inputs_used. - Show\
    \ the formula for NOI using: effective_gross_income - operating_expenses. - Show\
    \ the formula for cap_rate using: noi / purchase_price. - Return vacancy as a\
    \ decimal (0.08), not a percentage. - result fields must be numbers (float or\
    \ integer), not strings. - Do not output any text outside the JSON object.\n"
  required_inputs:
  - gross_potential_rent: 500000
  - vacancy_rate: 0.08
  - operating_expenses: 175000
  - purchase_price: 3200000
  expected_outputs:
  - effective_gross_income: 460000.0
  - noi: 285000.0
  - cap_rate: 0.0890625
  - calculations array with at least 3 entries
  - assumptions array with at least 2 entries
  - Each calculation object has non-empty assumptions array
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - calculations
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
  deterministic_checks:
  - name: assignment_id_exact
    description: assignment_id equals "genai_chain_of_thought_v1"
  - name: calculations_is_non_empty_array
    description: calculations is an array with length >= 1
  - name: each_calculation_has_required_keys
    description: Every calc has name, formula, inputs, result, units, assumptions
  - name: calculation_result_is_number
    description: Every calculations[].result is a number type (int or float)
  - name: assumptions_is_non_empty_array
    description: assumptions is an array with length >= 2
  - name: each_calc_assumptions_non_empty
    description: Every calculations[].assumptions array has length >= 1
  - name: self_check_has_all_keys
    description: self_check object has all 4 required boolean keys
  - name: self_check_all_true
    description: All values in self_check are boolean true
  math_checks:
  - formula_id: effective_gross_income
    formula: gross_potential_rent * (1 - vacancy_rate)
    expected_result: 460000.0
    tolerance: 0.01
  - formula_id: noi
    formula: effective_gross_income - operating_expenses
    expected_result: 285000.0
    tolerance: 0.01
  - formula_id: cap_rate
    formula: noi / purchase_price
    expected_result: 0.0890625
    tolerance: 0.0001
  evidence_checks:
  - name: inputs_used_non_empty
    description: inputs_used array has length >= 1
  - name: claims_reference_evidence
    description: Every claim has a non-empty evidence_reference
  flag_rules:
  - flag_id: empty_calculations
    severity: propolis
    condition: calculations array is missing or has length 0
  - flag_id: missing_assumptions
    severity: propolis
    condition: assumptions array is missing, empty, or has fewer than 2 items
  - flag_id: calc_without_assumptions
    severity: jelly
    condition: Any calculation has an empty assumptions array
  - flag_id: result_not_number
    severity: jelly
    condition: Any calculations[].result is not a numeric type
  - flag_id: math_incorrect
    severity: propolis
    condition: Any math check result deviates beyond tolerance
  - flag_id: self_check_false
    severity: jelly
    condition: Any value in self_check is not true
  severity_mapping:
    honey: Minor formatting or cosmetic deviation
    jelly: Material deviation requiring manual review but eval can proceed
