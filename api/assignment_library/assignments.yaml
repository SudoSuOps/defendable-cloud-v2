- assignment_id: doc_requested_action_clarity_v1
  name: Requested Action Clarity
  lane: document_draft_eval
  version: '1.0'
  purpose: Verify that the document draft clearly states a specific, actionable request
    for the recipient. Documents without a clear requested action fail to achieve
    their communicative purpose and require revision.
  operator_instructions: Provide the agent with a document draft. The agent must identify
    whether a requested action exists, whether it is specific (not vague), and whether
    it is actionable (the recipient knows exactly what to do). The agent must return
    structured JSON.
  agent_prompt: "You are evaluating a document draft for requested action clarity.\n\
    \nGiven the document draft, analyze it for the presence and quality of a requested\
    \ action.\nA \"requested action\" is a clear statement of what the recipient should\
    \ do.\n\nA requested action is SPECIFIC if it answers: WHO, WHAT, WHEN, or HOW.\n\
    A requested action is ACTIONABLE if a reasonable recipient could act on it without\
    \ guessing.\n\nReturn a single JSON object with this exact structure:\n{\n  \"\
    assignment_id\": \"doc_requested_action_clarity_v1\",\n  \"agent_summary\": \"\
    One sentence summary\",\n  \"inputs_used\": [\"list of inputs examined\"],\n \
    \ \"missing_inputs\": [\"any missing inputs\"],\n  \"claims\": [\n    {\"claim\"\
    : \"\", \"evidence_reference\": \"\", \"confidence\": \"provided | inferred |\
    \ missing\"}\n  ],\n  \"requested_action\": {\n    \"present\": true,\n    \"\
    text\": \"the exact text of the requested action, or empty string\",\n    \"specific\"\
    : true,\n    \"actionable\": true,\n    \"specificity_score\": 0,\n    \"reason\"\
    : \"explanation of why it is or is not specific/actionable\"\n  },\n  \"calculations\"\
    : [],\n  \"risks\": [\n    {\"risk\": \"\", \"severity\": \"low | medium | high\"\
    , \"evidence_reference\": \"\"}\n  ],\n  \"assumptions\": [],\n  \"open_questions\"\
    : [],\n  \"final_output\": \"PASS or FAIL\",\n  \"self_check\": {\n    \"all_required_sections_completed\"\
    : true,\n    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\"\
    : true,\n    \"missing_inputs_disclosed\": true\n  }\n}\n\nScoring rules for specificity_score\
    \ (integer 0-4):\n- 0 = no requested action found\n- 1 = vague reference to action\
    \ (e.g., \"please look into this\")\n- 2 = partial action stated but missing key\
    \ details\n- 3 = clear action with most details present\n- 4 = fully specific\
    \ action with WHO, WHAT, WHEN, and HOW all addressed\n\nfinal_output rules:\n\
    - PASS if requested_action.present == true AND specific == true AND actionable\
    \ == true AND specificity_score >= 3\n- FAIL otherwise\n\nReturn only the JSON.\
    \ No markdown fences, no prose.\n"
  required_inputs:
  - name: document_draft
    type: string
    description: The document draft text to evaluate for action clarity
    required: true
  expected_outputs:
  - requested_action object with present, text, specific, actionable, specificity_score,
    reason
  - final_output string (PASS or FAIL)
  - risks array documenting any clarity issues
  required_output_schema:
    type: object
    required:
    - assignment_id
