    condition: any calculation has non-numeric result
    severity: propolis
    message: One or more calculation results are not numeric
  - flag_id: ebitda_mismatch
    condition: abs(ebitda_calc - (revenue - cogs - operating_expenses + depreciation
      + amortization)) >= 0.01
    severity: propolis
    message: EBITDA calculation does not match formula
  - flag_id: npv_missing_intermediate_steps
    condition: npv_calc.intermediate_steps is missing OR length == 0
    severity: jelly
    message: NPV calculation is missing intermediate steps
  - flag_id: negative_discount_rate
    condition: discount_rate < 0
    severity: honey
    message: Discount rate is negative
  - flag_id: npv_mismatch
    condition: abs(npv_calc.result - sum_of_discounted_cfs) >= 0.01
    severity: propolis
    message: NPV result does not match sum of discounted cash flows
  severity_mapping:
    honey: Minor issue — negative discount rate (unusual but mathematically valid)
    jelly: Moderate issue — missing intermediate steps for NPV
    propolis: Critical issue — formula result mismatch, missing calculations, non-numeric
      results, or false PASS
