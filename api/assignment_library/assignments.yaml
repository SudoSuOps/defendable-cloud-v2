      evidence_reference: MARKET
    - risk: 420 new units under construction within 3 miles will increase competitive
        supply and may pressure rents and occupancy.
      severity: medium
      evidence_reference: MARKET
    assumptions:
    - NOI of $1,430,000 is stabilized and achievable.
    - Market data is current as of memo date.
    open_questions:
    - Can the occupancy gap be closed through property improvements or management
      changes?
    - Is the $800K CapEx budget sufficient or could additional needs arise?
    final_output: '6 risks identified: 3 high (DSCR, occupancy, lease roll), 3 medium
