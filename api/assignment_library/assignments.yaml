    : \"compliant\", \"evidence\": \"The company maintains a documented ICFR framework\
    \ reviewed quarterly\", \"source_document\": \"doc_1\", \"finding_details\": \"\
    Quarterly ICFR reviews documented; no material weaknesses noted\"}\n  ],\n  \"\
    claims\": [],\n  \"calculations\": [],\n  \"risks\": [],\n  \"assumptions\": [],\n\
    \  \"open_questions\": [],\n  \"final_output\": \"<summary>\",\n  \"self_check\"\
    : {\n    \"all_required_sections_completed\": true,\n    \"all_numbers_have_sources\"\
    : true,\n    \"assumptions_labeled\": true,\n    \"missing_inputs_disclosed\"\
    : true\n  }\n}\nRules: - Every requirement in the input regulatory checklist must\
    \ appear in checklist_items. - Do NOT change or paraphrase the requirement text.\
    \ - evidence must be a direct quote or close paraphrase from source documents.\
    \ - If status is \"not_assessable\", explain in finding_details why evidence is\
    \ insufficient. - Do not assign \"compliant\" unless there is clear supporting\
    \ evidence. - Default to \"not_assessable\" when in doubt rather than inferring\
    \ compliance.\n"
  required_inputs:
  - name: regulatory_checklist
    type: array_of_objects
    description: List of regulatory requirements with regulation_citation fields.
    count: 5-10
  - name: source_documents
    type: array_of_text
    description: Documents describing the organization's compliance posture.
    count: 1-3
  expected_outputs:
  - checklist_items array with requirement, regulation_citation, status, evidence,
    source_document, finding_details
  - All input requirements accounted for
  - Evidence quotes traceable to source documents
  - Self-check object
  required_output_schema:
    type: object
    required:
    - assignment_id
    - checklist_items
    - inputs_used
    - missing_inputs
    - self_check
    properties:
      assignment_id:
        type: string
        const: comp_regulatory_checklist_v1
      checklist_items:
        type: array
        items:
          type: object
          required:
          - requirement
          - regulation_citation
          - status
          - evidence
          - source_document
          - finding_details
          properties:
            requirement:
              type: string
              minLength: 1
            regulation_citation:
              type: string
              minLength: 1
            status:
              type: string
              enum:
              - compliant
              - non_compliant
              - partially_compliant
              - not_assessable
            evidence:
              type:
              - string
              - 'null'
            source_document:
              type:
              - string
              - 'null'
            finding_details:
              type: string
              minLength: 1
      inputs_used:
        type: array
        items:
          type: string
      missing_inputs:
        type: array
        items:
          type: string
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - description: All status values must be in [compliant, non_compliant, partially_compliant,
      not_assessable].
    method: Enum validation against schema.
  - description: Every requirement in the input checklist must appear in checklist_items[].requirement.
    method: Set equality check — input requirements set equals output requirements
      set.
  - description: checklist_items array length must equal input regulatory checklist
      length.
    method: Length equality check.
  - description: If status is compliant, partially_compliant, or non_compliant, evidence
      and source_document must be non-null.
    method: Conditional non-null check.
  - description: If status is not_assessable, evidence and source_document should
      be null.
    method: Conditional null check.
  - description: finding_details must be non-empty for every checklist item.
    method: String length check > 0.
  math_checks: []
  evidence_checks:
  - description: For compliant/partially_compliant/non_compliant items, verify evidence
      text exists in the stated source document.
    method: Substring search evidence against source_documents.
  - description: Verify status assignments are reasonable given the evidence (not
      systematically optimistic).
    method: Review sample of status assignments against evidence by evaluator.
  - description: Verify no requirements were omitted from the output checklist_items
      array.
    method: Cross-check output array length and requirement texts against input checklist.
  flag_rules:
  - flag_id: missing_requirement
    condition: Input requirement not present in checklist_items
    severity: propolis
  - flag_id: fabricated_evidence
    condition: evidence text not found in stated source document
    severity: honey
  - flag_id: invalid_status
    condition: status not in [compliant, non_compliant, partially_compliant, not_assessable]
    severity: honey
  - flag_id: compliant_without_evidence
    condition: status is compliant AND evidence is null
    severity: jelly
  - flag_id: not_assessable_with_evidence
    condition: status is not_assessable AND evidence is non-null
    severity: jelly
  - flag_id: missing_finding_details
    condition: finding_details is empty or null
    severity: jelly
  - flag_id: checklist_count_mismatch
    condition: len(checklist_items) != len(input regulatory_checklist)
    severity: propolis
  - flag_id: self_check_false
    condition: any self_check boolean is false
    severity: jelly
  severity_mapping:
    honey: Minor error — fabricated evidence on single item
    jelly: Moderate error — status/evidence logic inconsistency
    propolis: Critical error — missing requirements or count mismatch
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: comp_regulatory_checklist_v1
    agent_summary: 'Evaluated 6 regulatory requirements: 3 compliant, 2 partially
      compliant, 1 not assessable'
    inputs_used:
    - regulatory_checklist
    - doc_1
    - doc_2
    missing_inputs: []
    claims: []
    calculations: []
    risks: []
    assumptions:
    - Assessment based solely on provided source documents
    open_questions: []
    checklist_items:
    - requirement: Maintain internal controls over financial reporting
      regulation_citation: SOX 404
      status: compliant
      evidence: The company maintains a documented ICFR framework reviewed quarterly
        by the audit committee
      source_document: doc_1
      finding_details: Quarterly ICFR reviews documented; no material weaknesses noted
        in FY2024
    - requirement: Conduct annual risk assessments
      regulation_citation: FINRA 3110
      status: partially_compliant
      evidence: Risk assessments are performed but documentation is inconsistent across
        business units
      source_document: doc_2
      finding_details: Assessments occur but not all units maintain adequate documentation
    - requirement: Maintain minimum liquidity coverage ratio
      regulation_citation: Basel III LCR
      status: not_assessable
      evidence: null
      source_document: null
      finding_details: Source documents do not contain liquidity ratio data or LCR
        calculations
    final_output: 3 compliant, 2 partially compliant, 1 not assessable out of 6 requirements
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: compute_benchmark_score_validation_v1
  name: Benchmark Score Validation
  lane: compute_benchmark_eval
  version: '1.0'
  purpose: Validate that a benchmark score is within the expected range for the given
    GPU model and that all metadata is present and correct.
  operator_instructions: Provide the benchmark result including score, GPU model,
    benchmark name, and units. Agent must compare against known expected ranges and
    validate data completeness.
  agent_prompt: 'You are validating a compute benchmark score. REQUIRED OUTPUT: Return
    a JSON object with these exact fields: - assignment_id (string): use "compute_benchmark_score_validation_v1"
    - agent_summary (string) - inputs_used (list of strings) - missing_inputs (list
    of strings) - claims (list of objects): claim, evidence_reference, confidence
    ("provided"|"inferred"|"missing") - calculations (list of objects): name, formula,
    inputs, result, units, assumptions - risks (list of objects): risk, severity ("low"|"medium"|"high"),
    evidence_reference - assumptions (list of strings) - open_questions (list of strings)
    - final_output (string) - self_check (object): all_required_sections_completed
    (boolean), all_numbers_have_sources (boolean), assumptions_labeled (boolean),
    missing_inputs_disclosed (boolean) Also include: - benchmark_name (string): name
    of the benchmark - gpu_model (string): GPU model used - score (number): the benchmark
    score - score_units (string): units of the score (e.g., "samples/sec", "TFLOPS",
    "ms") - expected_range_min (number or null): known minimum for this GPU+benchmark
    - expected_range_max (number or null): known maximum for this GPU+benchmark -
    score_within_expected_range (boolean or null): expected_range_min <= score <=
    expected_range_max - score_not_null (boolean): score is not null and is numeric
    - units_correct (boolean): score_units is a recognized unit for this benchmark
    - score_percentile (number or null): where score falls within expected range as
    (score - min) / (max - min), null if range unknown Compute score_percentile as
    (score - expected_range_min) / (expected_range_max - expected_range_min) when
    both bounds are known. Return numeric values as numbers, not prose.

    '
  required_inputs:
  - benchmark_result
  - benchmark_name
  - gpu_model
  - expected_range_optional
  expected_outputs:
  - benchmark_name
  - gpu_model
  - score
  - score_units
  - expected_range_min
  - expected_range_max
  - score_within_expected_range
  - score_not_null
  - units_correct
  - score_percentile
  required_output_schema:
    type: object
    required:
    - assignment_id
    - benchmark_name
    - gpu_model
    - score
    - score_units
    - score_within_expected_range
    - score_not_null
    - units_correct
    - claims
    - self_check
  deterministic_checks:
  - check_id: score_is_numeric
    description: score must be a number (int or float)
    assertion: isinstance(result.score, (int, float))
  - check_id: score_not_null
    description: score_not_null must be true
    assertion: result.score_not_null == True
  - check_id: range_check_logic
    description: If expected range provided, score_within_expected_range must be computed
      correctly
    assertion: result.score_within_expected_range == (result.expected_range_min <=
      result.score <= result.expected_range_max) if (result.expected_range_min is
      not None and result.expected_range_max is not None) else None
  - check_id: percentile_formula
    description: If range provided, score_percentile must be computed correctly
    assertion: abs(result.score_percentile - ((result.score - result.expected_range_min)
      / (result.expected_range_max - result.expected_range_min))) < 1e-6 if (result.expected_range_min
      is not None and result.expected_range_max is not None and result.expected_range_max
      != result.expected_range_min) else True
  - check_id: units_non_empty
    description: score_units must be a non-empty string
    assertion: isinstance(result.score_units, str) and len(result.score_units) > 0
  math_checks:
  - formula_id: score_percentile
    formula: (score - expected_range_min) / (expected_range_max - expected_range_min)
    description: Percentile position within expected range
    output_field: score_percentile
  evidence_checks:
  - evidence_field: score
    description: Must match the actual benchmark output score
    required: true
  - evidence_field: gpu_model
    description: Must match the actual GPU used during benchmarking
    required: true
  - evidence_field: score_units
    description: Must be the exact units reported by the benchmark tool
    required: true
  flag_rules:
  - flag_id: score_below_expected
    condition: score_within_expected_range == false and score < expected_range_min
    severity: high
    description: Benchmark score is below expected range for this GPU
  - flag_id: score_above_expected
    condition: score_within_expected_range == false and score > expected_range_max
    severity: medium
    description: Benchmark score is above expected range (possible measurement error)
  - flag_id: score_is_null
    condition: score_not_null == false
    severity: high
    description: Benchmark score is missing or null
  - flag_id: units_unrecognized
    condition: units_correct == false
    severity: medium
    description: Benchmark score units are not recognized
  severity_mapping:
    honey: Score within expected range, units recognized, not null
    jelly: Expected range unknown but score is numeric with recognized units
    propolis: Score below expected range, or score is null, or units unrecognized
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: compute_benchmark_score_validation_v1
    benchmark_name: MLPerf Inference v3.1
    gpu_model: NVIDIA A100-SXM4-80GB
    score: 4523.7
    score_units: samples/sec
    expected_range_min: 4000
    expected_range_max: 5000
    score_within_expected_range: true
    score_not_null: true
    units_correct: true
    score_percentile: 0.524
- assignment_id: compute_efficiency_metrics_v1
  name: Efficiency Metrics Calculation
  lane: compute_benchmark_eval
  version: '1.0'
  purpose: Calculate score-per-watt and score-per-dollar efficiency metrics for a
    benchmark result. Verify inputs and show formulas.
  operator_instructions: Provide benchmark score, units, GPU power draw (avg watts),
    and GPU cost (USD). Agent must compute efficiency ratios and validate non-zero
    denominators.
  agent_prompt: 'You are calculating efficiency metrics for a benchmark result. REQUIRED
    OUTPUT: Return a JSON object with these exact fields: - assignment_id (string):
    use "compute_efficiency_metrics_v1" - agent_summary (string) - inputs_used (list
    of strings) - missing_inputs (list of strings) - claims (list of objects): claim,
    evidence_reference, confidence ("provided"|"inferred"|"missing") - calculations
    (list of objects): name, formula, inputs, result, units, assumptions - risks (list
    of objects): risk, severity ("low"|"medium"|"high"), evidence_reference - assumptions
    (list of strings) - open_questions (list of strings) - final_output (string) -
    self_check (object): all_required_sections_completed (boolean), all_numbers_have_sources
    (boolean), assumptions_labeled (boolean), missing_inputs_disclosed (boolean) Also
    include: - benchmark_name (string) - gpu_model (string) - benchmark_score (number)
    - score_units (string) - avg_power_w (number): average power draw during benchmark
    - gpu_cost_usd (number): acquisition cost of GPU in USD - score_per_watt (number
    or null): benchmark_score / avg_power_w, null if avg_power_w is 0 - score_per_watt_units
    (string): "{score_units}/W" - score_per_dollar (number or null): benchmark_score
    / gpu_cost_usd, null if gpu_cost_usd is 0 - score_per_dollar_units (string): "{score_units}/USD"
    - cost_valid (boolean): gpu_cost_usd > 0 - power_valid (boolean): avg_power_w
    > 0 - both_metrics_computed (boolean): score_per_watt is not null and score_per_dollar
    is not null Compute score_per_watt as benchmark_score / avg_power_w. Compute score_per_dollar
    as benchmark_score / gpu_cost_usd. If avg_power_w is 0 or missing, set score_per_watt
    to null. If gpu_cost_usd is 0 or missing, set score_per_dollar to null. Return
    numeric values as numbers, not prose. Include both formulas in the calculations
    array with exact inputs.

    '
  required_inputs:
  - benchmark_score
  - score_units
  - avg_power_w
  - gpu_cost_usd
  - benchmark_name
  - gpu_model
  expected_outputs:
  - benchmark_name
  - gpu_model
  - benchmark_score
  - score_units
  - avg_power_w
  - gpu_cost_usd
  - score_per_watt
  - score_per_watt_units
  - score_per_dollar
  - score_per_dollar_units
  - cost_valid
  - power_valid
  - both_metrics_computed
  required_output_schema:
    type: object
    required:
    - assignment_id
    - benchmark_score
    - avg_power_w
    - gpu_cost_usd
    - score_per_watt
    - score_per_dollar
    - cost_valid
    - power_valid
    - both_metrics_computed
    - calculations
    - self_check
  deterministic_checks:
  - check_id: score_per_watt_formula
    description: score_per_watt must equal benchmark_score / avg_power_w
    assertion: abs(result.score_per_watt - (result.benchmark_score / result.avg_power_w))
      < 1e-6 if result.avg_power_w != 0 else result.score_per_watt is None
  - check_id: score_per_dollar_formula
    description: score_per_dollar must equal benchmark_score / gpu_cost_usd
    assertion: abs(result.score_per_dollar - (result.benchmark_score / result.gpu_cost_usd))
      < 1e-6 if result.gpu_cost_usd != 0 else result.score_per_dollar is None
  - check_id: validity_flags
    description: cost_valid must be true when cost > 0, power_valid when power > 0
    assertion: result.cost_valid == (result.gpu_cost_usd > 0) and result.power_valid
      == (result.avg_power_w > 0)
  - check_id: both_metrics_flag
    description: both_metrics_computed must be true when both metrics are non-null
    assertion: result.both_metrics_computed == (result.score_per_watt is not None
      and result.score_per_dollar is not None)
  math_checks:
  - formula_id: score_per_watt
    formula: benchmark_score / avg_power_w
    description: Benchmark score normalized by power consumption
    output_field: score_per_watt
  - formula_id: score_per_dollar
    formula: benchmark_score / gpu_cost_usd
    description: Benchmark score normalized by acquisition cost
    output_field: score_per_dollar
  evidence_checks:
  - evidence_field: benchmark_score
    description: Must match the actual benchmark result
    required: true
  - evidence_field: avg_power_w
    description: Must be from actual power telemetry during benchmark
    required: true
  - evidence_field: gpu_cost_usd
    description: Must be actual acquisition cost with currency
    required: true
  flag_rules:
  - flag_id: power_invalid
    condition: power_valid == false
    severity: high
    description: Average power is zero or missing; score_per_watt cannot be computed
  - flag_id: cost_invalid
    condition: cost_valid == false
    severity: high
    description: GPU cost is zero or missing; score_per_dollar cannot be computed
  - flag_id: both_metrics_missing
    condition: both_metrics_computed == false
    severity: high
    description: One or both efficiency metrics could not be computed
  severity_mapping:
    honey: Both metrics computed successfully with valid inputs
    jelly: One metric computed but the other input missing (power or cost)
    propolis: Both metrics cannot be computed, or score is zero/null
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: compute_efficiency_metrics_v1
    benchmark_name: MLPerf Inference v3.1
    gpu_model: NVIDIA A100-SXM4-80GB
    benchmark_score: 4523.7
    score_units: samples/sec
    avg_power_w: 340
    gpu_cost_usd: 15000
    score_per_watt: 13.305
    score_per_watt_units: samples/sec/W
    score_per_dollar: 0.3016
    score_per_dollar_units: samples/sec/USD
    cost_valid: true
    power_valid: true
    both_metrics_computed: true
- assignment_id: compute_gpu_spec_verification_v1
  name: GPU Specification Verification
  lane: compute_benchmark_eval
  version: '1.0'
  purpose: Verify that the GPU hardware and driver configuration matches the declared
    specification including model, VRAM, driver version, and CUDA version.
  operator_instructions: Provide the GPU info output (e.g., nvidia-smi) and the declared
    specification. Agent must compare each attribute and report compliance.
  agent_prompt: 'You are verifying GPU specifications against declared requirements.
    REQUIRED OUTPUT: Return a JSON object with these exact fields: - assignment_id
    (string): use "compute_gpu_spec_verification_v1" - agent_summary (string) - inputs_used
    (list of strings) - missing_inputs (list of strings) - claims (list of objects):
    claim, evidence_reference, confidence ("provided"|"inferred"|"missing") - calculations
    (list of objects): name, formula, inputs, result, units, assumptions - risks (list
    of objects): risk, severity ("low"|"medium"|"high"), evidence_reference - assumptions
    (list of strings) - open_questions (list of strings) - final_output (string) -
    self_check (object): all_required_sections_completed (boolean), all_numbers_have_sources
    (boolean), assumptions_labeled (boolean), missing_inputs_disclosed (boolean) Also
    include: - gpu_model_detected (string): GPU model name from system - gpu_model_declared
    (string or null): expected GPU model - gpu_model_match (boolean): exact string
    match of model names - vram_detected_gb (number): detected VRAM in gigabytes -
    vram_required_gb (number or null): minimum required VRAM - vram_sufficient (boolean):
    vram_detected_gb >= vram_required_gb (or true if no requirement) - driver_version_detected
    (string): detected driver version - driver_version_required (string or null):
    required driver version - driver_version_match (boolean): exact match or meeting
    minimum - cuda_version_detected (string): detected CUDA version - cuda_version_required
    (string or null): required CUDA version - cuda_version_match (boolean): exact
    match or meeting minimum - all_specs_match (boolean): true only if gpu_model_match
    and vram_sufficient and driver_version_match and cuda_version_match are all true
    Return numeric values as numbers, not prose. State exact versions as strings.

    '
  required_inputs:
  - gpu_info_output_or_nvidia_smi
  - declared_gpu_specification
  expected_outputs:
  - gpu_model_detected
  - gpu_model_match
  - vram_detected_gb
  - vram_sufficient
  - driver_version_detected
  - driver_version_match
  - cuda_version_detected
  - cuda_version_match
  - all_specs_match
  required_output_schema:
    type: object
    required:
    - assignment_id
    - gpu_model_detected
    - gpu_model_match
    - vram_detected_gb
    - vram_sufficient
    - driver_version_detected
    - driver_version_match
    - cuda_version_detected
    - cuda_version_match
    - all_specs_match
    - claims
    - self_check
  deterministic_checks:
  - check_id: vram_numeric
    description: vram_detected_gb must be a number > 0
    assertion: isinstance(result.vram_detected_gb, (int, float)) and result.vram_detected_gb
      > 0
  - check_id: vram_sufficient_logic
    description: vram_sufficient must be true when vram >= required
    assertion: result.vram_sufficient == (result.vram_detected_gb >= result.vram_required_gb
      if result.vram_required_gb else True)
  - check_id: all_specs_match_logic
    description: all_specs_match must be true only when all individual checks pass
    assertion: result.all_specs_match == (result.gpu_model_match and result.vram_sufficient
      and result.driver_version_match and result.cuda_version_match)
  - check_id: version_strings_present
    description: driver and CUDA versions must be non-empty strings
    assertion: isinstance(result.driver_version_detected, str) and len(result.driver_version_detected)
      > 0 and isinstance(result.cuda_version_detected, str) and len(result.cuda_version_detected)
      > 0
  math_checks: []
  evidence_checks:
  - evidence_field: gpu_model_detected
    description: Must quote exact GPU model string from system output
    required: true
  - evidence_field: vram_detected_gb
    description: Must report exact VRAM value from system output
    required: true
  - evidence_field: driver_version_detected
    description: Must quote exact driver version from system output
    required: true
  flag_rules:
  - flag_id: gpu_model_mismatch
    condition: gpu_model_match == false
    severity: high
    description: Detected GPU model does not match declared specification
  - flag_id: vram_insufficient
    condition: vram_sufficient == false
    severity: high
    description: Detected VRAM is below required minimum
  - flag_id: driver_version_mismatch
    condition: driver_version_match == false
    severity: medium
    description: Driver version does not meet requirement
  - flag_id: cuda_version_mismatch
    condition: cuda_version_match == false
    severity: medium
    description: CUDA version does not meet requirement
  severity_mapping:
    honey: All specs match exactly (model, VRAM, driver, CUDA)
    jelly: Minor version difference in driver or CUDA, GPU model and VRAM match
    propolis: GPU model mismatch, insufficient VRAM, or both driver and CUDA mismatch
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: compute_gpu_spec_verification_v1
    gpu_model_detected: NVIDIA A100-SXM4-80GB
    gpu_model_declared: NVIDIA A100-SXM4-80GB
    gpu_model_match: true
    vram_detected_gb: 80
    vram_required_gb: 40
    vram_sufficient: true
    driver_version_detected: 535.104.05
    driver_version_required: '535.00'
    driver_version_match: true
    cuda_version_detected: '12.2'
    cuda_version_required: '12.0'
    cuda_version_match: true
    all_specs_match: true
- assignment_id: compute_inference_latency_v1
  name: Inference Latency Assessment
  lane: compute_benchmark_eval
  version: '1.0'
  purpose: Measure inference latency percentiles (p50, p95, p99) and validate against
    real-time thresholds. Report all latency statistics with evidence.
  operator_instructions: Provide inference benchmark results with per-request latency
    data or percentile summary. Agent must extract or compute p50, p95, p99 and check
    against 100ms threshold for real-time.
  agent_prompt: 'You are assessing inference latency for a model deployment. REQUIRED
    OUTPUT: Return a JSON object with these exact fields: - assignment_id (string):
    use "compute_inference_latency_v1" - agent_summary (string) - inputs_used (list
    of strings) - missing_inputs (list of strings) - claims (list of objects): claim,
    evidence_reference, confidence ("provided"|"inferred"|"missing") - calculations
    (list of objects): name, formula, inputs, result, units, assumptions - risks (list
    of objects): risk, severity ("low"|"medium"|"high"), evidence_reference - assumptions
    (list of strings) - open_questions (list of strings) - final_output (string) -
    self_check (object): all_required_sections_completed (boolean), all_numbers_have_sources
    (boolean), assumptions_labeled (boolean), missing_inputs_disclosed (boolean) Also
    include: - model_name (string) - gpu_model (string) - batch_size (integer) - total_requests
    (integer): number of requests in benchmark - latency_p50_ms (number): 50th percentile
    latency in milliseconds - latency_p95_ms (number): 95th percentile latency in
    milliseconds - latency_p99_ms (number): 99th percentile latency in milliseconds
    - latency_unit (string): must be "ms" - real_time_threshold_ms (number): threshold
    for real-time, default 100 - meets_real_time (boolean): latency_p99_ms < real_time_threshold_ms
    - p99_to_p50_ratio (number): latency_p99_ms / latency_p50_ms - tail_latency_severity
    (string): "low" if p99/p50 < 2, "medium" if 2-5, "high" if > 5 Compute meets_real_time
    as latency_p99_ms < real_time_threshold_ms (strictly less than). Compute p99_to_p50_ratio
    as latency_p99_ms / latency_p50_ms. Return numeric values as numbers, not prose.
    All latency values must be in milliseconds. Include percentile formulas in calculations
    array.

    '
  required_inputs:
  - latency_benchmark_results
  - model_name
  - gpu_model
  - batch_size
  expected_outputs:
  - model_name
  - gpu_model
  - batch_size
  - total_requests
  - latency_p50_ms
  - latency_p95_ms
  - latency_p99_ms
  - latency_unit
  - real_time_threshold_ms
  - meets_real_time
  - p99_to_p50_ratio
  - tail_latency_severity
  required_output_schema:
    type: object
    required:
    - assignment_id
    - model_name
    - gpu_model
    - batch_size
    - total_requests
    - latency_p50_ms
    - latency_p95_ms
    - latency_p99_ms
    - latency_unit
    - real_time_threshold_ms
    - meets_real_time
    - p99_to_p50_ratio
    - tail_latency_severity
    - calculations
    - self_check
  deterministic_checks:
  - check_id: latency_values_positive
    description: All latency percentiles must be positive numbers
    assertion: result.latency_p50_ms > 0 and result.latency_p95_ms > 0 and result.latency_p99_ms
      > 0
  - check_id: percentile_order
    description: Latency percentiles must be non-decreasing p50 <= p95 <= p99
    assertion: result.latency_p50_ms <= result.latency_p95_ms <= result.latency_p99_ms
  - check_id: p99_ratio_formula
    description: p99_to_p50_ratio must equal p99 / p50
    assertion: abs(result.p99_to_p50_ratio - (result.latency_p99_ms / result.latency_p50_ms))
      < 1e-6
  - check_id: real_time_logic
    description: meets_real_time must be true when p99 < threshold
    assertion: result.meets_real_time == (result.latency_p99_ms < result.real_time_threshold_ms)
  - check_id: latency_unit_ms
    description: latency_unit must be exactly "ms"
    assertion: result.latency_unit == 'ms'
  - check_id: tail_severity_consistent
    description: tail_latency_severity must match the p99/p50 ratio bands
    assertion: result.tail_latency_severity == ('low' if result.p99_to_p50_ratio <
      2 else 'medium' if result.p99_to_p50_ratio <= 5 else 'high')
  math_checks:
  - formula_id: p99_to_p50_ratio
    formula: latency_p99_ms / latency_p50_ms
    description: Ratio measuring tail latency spread relative to median
    output_field: p99_to_p50_ratio
  evidence_checks:
  - evidence_field: latency_p50_ms
    description: Must be actual 50th percentile from benchmark
    required: true
  - evidence_field: latency_p95_ms
    description: Must be actual 95th percentile from benchmark
    required: true
  - evidence_field: latency_p99_ms
    description: Must be actual 99th percentile from benchmark
    required: true
  - evidence_field: total_requests
    description: Must be the actual number of requests measured
    required: true
  flag_rules:
  - flag_id: exceeds_real_time_threshold
    condition: meets_real_time == false
    severity: high
    description: P99 latency exceeds real-time threshold (100ms)
  - flag_id: high_tail_latency
    condition: tail_latency_severity == 'high'
    severity: medium
    description: P99 is more than 5x the P50 latency
  - flag_id: moderate_tail_latency
    condition: tail_latency_severity == 'medium'
    severity: low
    description: P99 is 2-5x the P50 latency
  severity_mapping:
    honey: P99 < 100ms and tail severity low (p99/p50 < 2)
    jelly: P99 < 100ms but tail severity medium, or P99 100-200ms
    propolis: P99 >= 100ms (fails real-time), or tail severity high
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: compute_inference_latency_v1
    model_name: resnet50
    gpu_model: NVIDIA A100-SXM4-80GB
    batch_size: 1
    total_requests: 10000
    latency_p50_ms: 2.1
    latency_p95_ms: 3.4
    latency_p99_ms: 4.8
    latency_unit: ms
    real_time_threshold_ms: 100
    meets_real_time: true
    p99_to_p50_ratio: 2.286
    tail_latency_severity: medium
- assignment_id: compute_memory_bandwidth_v1
  name: Memory Bandwidth Utilization
  lane: compute_benchmark_eval
  version: '1.0'
  purpose: Measure achieved memory bandwidth during a benchmark and compare it against
    the GPU's theoretical maximum bandwidth. Calculate utilization percentage.
  operator_instructions: Provide achieved bandwidth from benchmark, GPU model, and
    theoretical max bandwidth. Agent must compute utilization percentage and flag
    low utilization.
  agent_prompt: 'You are calculating memory bandwidth utilization for a GPU benchmark.
    REQUIRED OUTPUT: Return a JSON object with these exact fields: - assignment_id
    (string): use "compute_memory_bandwidth_v1" - agent_summary (string) - inputs_used
    (list of strings) - missing_inputs (list of strings) - claims (list of objects):
    claim, evidence_reference, confidence ("provided"|"inferred"|"missing") - calculations
    (list of objects): name, formula, inputs, result, units, assumptions - risks (list
    of objects): risk, severity ("low"|"medium"|"high"), evidence_reference - assumptions
    (list of strings) - open_questions (list of strings) - final_output (string) -
    self_check (object): all_required_sections_completed (boolean), all_numbers_have_sources
    (boolean), assumptions_labeled (boolean), missing_inputs_disclosed (boolean) Also
    include: - gpu_model (string) - benchmark_name (string) - achieved_bandwidth_gbps
    (number): measured memory bandwidth in GB/s - theoretical_max_bandwidth_gbps (number):
    GPU spec memory bandwidth in GB/s - memory_bandwidth_utilization (number between
    0 and 1): achieved / theoretical_max - memory_bandwidth_utilization_percent (number):
    memory_bandwidth_utilization * 100 - utilization_sufficient (boolean): memory_bandwidth_utilization
    >= 0.50 - bandwidth_deficit_gbps (number): theoretical_max - achieved Compute
    memory_bandwidth_utilization exactly as achieved_bandwidth_gbps / theoretical_max_bandwidth_gbps.
    Return numeric values as numbers, not prose. Include the formula in calculations
    array. If theoretical_max_bandwidth_gbps is missing, report it in missing_inputs
    and set utilization fields to null.

    '
  required_inputs:
  - achieved_bandwidth_gbps
  - theoretical_max_bandwidth_gbps
  - gpu_model
  - benchmark_name
  expected_outputs:
  - gpu_model
  - benchmark_name
  - achieved_bandwidth_gbps
  - theoretical_max_bandwidth_gbps
  - memory_bandwidth_utilization
  - memory_bandwidth_utilization_percent
  - utilization_sufficient
  - bandwidth_deficit_gbps
  required_output_schema:
    type: object
    required:
    - assignment_id
    - gpu_model
    - benchmark_name
    - achieved_bandwidth_gbps
    - theoretical_max_bandwidth_gbps
    - memory_bandwidth_utilization
    - memory_bandwidth_utilization_percent
    - utilization_sufficient
    - bandwidth_deficit_gbps
    - calculations
    - self_check
  deterministic_checks:
  - check_id: utilization_formula
    description: memory_bandwidth_utilization must equal achieved / theoretical_max
    assertion: abs(result.memory_bandwidth_utilization - (result.achieved_bandwidth_gbps
      / result.theoretical_max_bandwidth_gbps)) < 1e-9
  - check_id: utilization_percent_conversion
    description: utilization_percent must equal utilization * 100
    assertion: abs(result.memory_bandwidth_utilization_percent - (result.memory_bandwidth_utilization
      * 100)) < 1e-6
  - check_id: utilization_range
    description: memory_bandwidth_utilization must be between 0.0 and 1.0
    assertion: 0.0 <= result.memory_bandwidth_utilization <= 1.0
  - check_id: bandwidth_deficit_formula
    description: bandwidth_deficit must equal theoretical_max - achieved
    assertion: abs(result.bandwidth_deficit_gbps - (result.theoretical_max_bandwidth_gbps
      - result.achieved_bandwidth_gbps)) < 1e-6
  - check_id: utilization_sufficient_logic
    description: utilization_sufficient must be true when utilization >= 50%
    assertion: result.utilization_sufficient == (result.memory_bandwidth_utilization
      >= 0.50)
  - check_id: positive_bandwidth
    description: Both bandwidth values must be positive numbers
    assertion: result.achieved_bandwidth_gbps > 0 and result.theoretical_max_bandwidth_gbps
      > 0
  math_checks:
  - formula_id: memory_bandwidth_utilization
    formula: achieved_bandwidth_gbps / theoretical_max_bandwidth_gbps
    description: Fraction of theoretical memory bandwidth achieved
    output_field: memory_bandwidth_utilization
  - formula_id: bandwidth_deficit
    formula: theoretical_max_bandwidth_gbps - achieved_bandwidth_gbps
    description: Difference between theoretical and achieved bandwidth
    output_field: bandwidth_deficit_gbps
  evidence_checks:
  - evidence_field: achieved_bandwidth_gbps
    description: Must be from actual benchmark measurement
    required: true
  - evidence_field: theoretical_max_bandwidth_gbps
    description: Must be from official GPU specification sheet
    required: true
  flag_rules:
  - flag_id: low_memory_utilization
    condition: memory_bandwidth_utilization < 0.50
    severity: high
    description: Memory bandwidth utilization is below 50%
  - flag_id: moderate_memory_utilization
    condition: memory_bandwidth_utilization >= 0.50 and memory_bandwidth_utilization
      < 0.70
    severity: medium
    description: Memory bandwidth utilization is between 50% and 70%
  - flag_id: good_memory_utilization
    condition: memory_bandwidth_utilization >= 0.70
    severity: low
    description: Memory bandwidth utilization is 70% or above
  severity_mapping:
    honey: Utilization >= 70% (good bandwidth utilization)
    jelly: Utilization between 50% and 70% (moderate)
    propolis: Utilization < 50% (poor bandwidth utilization)
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: compute_memory_bandwidth_v1
    gpu_model: NVIDIA A100-SXM4-80GB
    benchmark_name: memtestCL
    achieved_bandwidth_gbps: 1348.5
    theoretical_max_bandwidth_gbps: 2039
    memory_bandwidth_utilization: 0.6614
    memory_bandwidth_utilization_percent: 66.14
    utilization_sufficient: true
    bandwidth_deficit_gbps: 690.5
- assignment_id: compute_system_readiness_v1
  name: System Readiness Verification
  lane: compute_benchmark_eval
  version: '1.0'
  purpose: Check overall system readiness for compute benchmarking including disk
    space, network speed, GPU utilization, and system configuration.
  operator_instructions: Provide system info including disk space, network test results,
    GPU utilization log, and minimum requirements. Agent must check each component
    and report overall readiness.
  agent_prompt: 'You are verifying system readiness for compute benchmarking. REQUIRED
    OUTPUT: Return a JSON object with these exact fields: - assignment_id (string):
    use "compute_system_readiness_v1" - agent_summary (string) - inputs_used (list
    of strings) - missing_inputs (list of strings) - claims (list of objects): claim,
    evidence_reference, confidence ("provided"|"inferred"|"missing") - calculations
    (list of objects): name, formula, inputs, result, units, assumptions - risks (list
    of objects): risk, severity ("low"|"medium"|"high"), evidence_reference - assumptions
    (list of strings) - open_questions (list of strings) - final_output (string) -
    self_check (object): all_required_sections_completed (boolean), all_numbers_have_sources
    (boolean), assumptions_labeled (boolean), missing_inputs_disclosed (boolean) Also
    include: - disk_space_free_gb (number): free disk space in gigabytes - disk_space_min_required_gb
    (number): minimum required free space - disk_space_sufficient (boolean): disk_space_free_gb
    >= disk_space_min_required_gb - network_speed_gbps (number): measured network
    speed in Gbps - network_speed_min_gbps (number): minimum required network speed
    - network_speed_sufficient (boolean): network_speed_gbps >= network_speed_min_gbps
    - gpu_utilization_avg (number): average GPU utilization during test (0-1 or 0-100,
    specify) - gpu_utilization_threshold (number): minimum acceptable utilization
    - gpu_utilization_sufficient (boolean): gpu_utilization_avg >= gpu_utilization_threshold
    - gpu_utilization_scale (string): "fraction" if 0-1, "percent" if 0-100 - readiness_score
    (number between 0 and 1): count of passing checks / total checks - overall_ready
    (boolean): true if disk_space_sufficient and network_speed_sufficient and gpu_utilization_sufficient
    - failing_checks (list of strings): names of checks that failed Compute readiness_score
    as (number of true checks) / (total number of checks). The 3 checks are: disk_space_sufficient,
    network_speed_sufficient, gpu_utilization_sufficient. Return numeric values as
    numbers, not prose. Report gpu_utilization_scale so the referee knows how to interpret
    the value.

    '
  required_inputs:
  - system_info_or_logs
  - disk_space_min_required_gb
  - network_speed_min_gbps
  - gpu_utilization_threshold
  expected_outputs:
  - disk_space_free_gb
  - disk_space_min_required_gb
  - disk_space_sufficient
  - network_speed_gbps
  - network_speed_min_gbps
  - network_speed_sufficient
  - gpu_utilization_avg
  - gpu_utilization_threshold
  - gpu_utilization_sufficient
  - gpu_utilization_scale
  - readiness_score
  - overall_ready
  - failing_checks
  required_output_schema:
    type: object
    required:
    - assignment_id
    - disk_space_free_gb
    - disk_space_sufficient
    - network_speed_gbps
    - network_speed_sufficient
    - gpu_utilization_avg
    - gpu_utilization_sufficient
    - gpu_utilization_scale
    - readiness_score
    - overall_ready
    - failing_checks
    - claims
    - self_check
  deterministic_checks:
  - check_id: disk_sufficient_logic
    description: disk_space_sufficient must be true when free >= required
    assertion: result.disk_space_sufficient == (result.disk_space_free_gb >= result.disk_space_min_required_gb)
  - check_id: network_sufficient_logic
    description: network_speed_sufficient must be true when speed >= required
    assertion: result.network_speed_sufficient == (result.network_speed_gbps >= result.network_speed_min_gbps)
  - check_id: gpu_util_sufficient_logic
    description: gpu_utilization_sufficient must be true when utilization >= threshold
    assertion: result.gpu_utilization_sufficient == (result.gpu_utilization_avg >=
      result.gpu_utilization_threshold)
  - check_id: readiness_score_formula
    description: readiness_score must equal passing checks divided by 3
    assertion: result.readiness_score == sum([result.disk_space_sufficient, result.network_speed_sufficient,
      result.gpu_utilization_sufficient]) / 3.0
  - check_id: overall_ready_logic
    description: overall_ready must be true only when all three checks pass
    assertion: result.overall_ready == (result.disk_space_sufficient and result.network_speed_sufficient
      and result.gpu_utilization_sufficient)
  - check_id: failing_checks_consistent
    description: Each check in failing_checks must have corresponding sufficient ==
      false
    assertion: all((not result.disk_space_sufficient if 'disk_space' in check else
      not result.network_speed_sufficient if 'network_speed' in check else not result.gpu_utilization_sufficient
      if 'gpu_utilization' in check else True) for check in result.failing_checks)
  math_checks:
  - formula_id: readiness_score
    formula: passing_checks_count / 3
    description: Fraction of readiness checks that passed
    output_field: readiness_score
  evidence_checks:
  - evidence_field: disk_space_free_gb
    description: Must be from actual system check (e.g., df command output)
    required: true
  - evidence_field: network_speed_gbps
    description: Must be from actual network test (e.g., iperf)
    required: true
  - evidence_field: gpu_utilization_avg
    description: Must be from actual GPU telemetry during benchmark
    required: true
  flag_rules:
  - flag_id: insufficient_disk_space
    condition: disk_space_sufficient == false
    severity: high
    description: Free disk space is below minimum requirement
  - flag_id: insufficient_network_speed
    condition: network_speed_sufficient == false
    severity: medium
    description: Network speed is below minimum requirement
  - flag_id: low_gpu_utilization
    condition: gpu_utilization_sufficient == false
    severity: medium
    description: GPU utilization is below threshold during benchmark
  - flag_id: system_not_ready
    condition: overall_ready == false
    severity: high
    description: One or more system readiness checks failed
  severity_mapping:
    honey: All 3 checks pass, readiness_score = 1.0
    jelly: 2 of 3 checks pass, readiness_score = 0.67
    propolis: 1 or 0 checks pass, readiness_score <= 0.33
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: compute_system_readiness_v1
    disk_space_free_gb: 500
    disk_space_min_required_gb: 100
    disk_space_sufficient: true
    network_speed_gbps: 10
    network_speed_min_gbps: 1
    network_speed_sufficient: true
    gpu_utilization_avg: 92.5
    gpu_utilization_threshold: 80
    gpu_utilization_sufficient: true
    gpu_utilization_scale: percent
    readiness_score: 1.0
    overall_ready: true
    failing_checks: []
- assignment_id: compute_thermal_power_check_v1
  name: Thermal and Power Check
  lane: compute_benchmark_eval
  version: '1.0'
  purpose: Verify that GPU temperature and power consumption are within safe operating
    limits during benchmark execution.
  operator_instructions: Provide GPU thermal and power telemetry (e.g., from nvidia-smi
    dmon or logs). Agent must check temperature and power against safe thresholds.
  agent_prompt: 'You are checking GPU thermal and power metrics against safe limits.
    REQUIRED OUTPUT: Return a JSON object with these exact fields: - assignment_id
    (string): use "compute_thermal_power_check_v1" - agent_summary (string) - inputs_used
    (list of strings) - missing_inputs (list of strings) - claims (list of objects):
    claim, evidence_reference, confidence ("provided"|"inferred"|"missing") - calculations
    (list of objects): name, formula, inputs, result, units, assumptions - risks (list
    of objects): risk, severity ("low"|"medium"|"high"), evidence_reference - assumptions
    (list of strings) - open_questions (list of strings) - final_output (string) -
    self_check (object): all_required_sections_completed (boolean), all_numbers_have_sources
    (boolean), assumptions_labeled (boolean), missing_inputs_disclosed (boolean) Also
    include: - gpu_model (string): GPU model name - max_temperature_c (number): maximum
    temperature observed in degrees Celsius - avg_temperature_c (number): average
    temperature observed in degrees Celsius - thermal_limit_c (number): thermal limit
    for this GPU model (default 85) - thermal_safe (boolean): max_temperature_c <
    thermal_limit_c - max_power_w (number): maximum power draw observed in watts -
    avg_power_w (number): average power draw observed in watts - power_limit_w (number):
    power limit for this GPU model - power_within_spec (boolean): max_power_w <= power_limit_w
    - thermal_throttle_detected (boolean): whether thermal throttling was observed
    - overall_safe (boolean): thermal_safe and power_within_spec and not thermal_throttle_detected
    Compute thermal_safe as max_temperature_c < thermal_limit_c (strictly less than).
    Compute power_within_spec as max_power_w <= power_limit_w. Return numeric values
    as numbers, not prose. Temperatures and power must be numbers.

    '
  required_inputs:
  - gpu_telemetry_log_or_nvidia_smi_output
  - gpu_model
  - thermal_limit_c_optional
  - power_limit_w_optional
  expected_outputs:
  - gpu_model
  - max_temperature_c
  - avg_temperature_c
  - thermal_limit_c
  - thermal_safe
  - max_power_w
  - avg_power_w
  - power_limit_w
  - power_within_spec
  - thermal_throttle_detected
  - overall_safe
  required_output_schema:
    type: object
    required:
    - assignment_id
    - gpu_model
    - max_temperature_c
    - avg_temperature_c
    - thermal_limit_c
    - thermal_safe
    - max_power_w
    - avg_power_w
    - power_limit_w
    - power_within_spec
    - thermal_throttle_detected
    - overall_safe
    - claims
    - self_check
  deterministic_checks:
  - check_id: temperature_numeric
    description: All temperature values must be numbers
    assertion: isinstance(result.max_temperature_c, (int, float)) and isinstance(result.avg_temperature_c,
      (int, float))
  - check_id: power_numeric
    description: All power values must be numbers
    assertion: isinstance(result.max_power_w, (int, float)) and isinstance(result.avg_power_w,
      (int, float))
  - check_id: thermal_safe_logic
    description: thermal_safe must be true when max temp is below limit
    assertion: result.thermal_safe == (result.max_temperature_c < result.thermal_limit_c)
  - check_id: power_within_spec_logic
    description: power_within_spec must be true when max power is at or below limit
    assertion: result.power_within_spec == (result.max_power_w <= result.power_limit_w)
  - check_id: overall_safe_logic
    description: overall_safe must be true only when all conditions pass
    assertion: result.overall_safe == (result.thermal_safe and result.power_within_spec
      and not result.thermal_throttle_detected)
  - check_id: avg_not_greater_than_max_temp
    description: Average temperature must not exceed maximum
    assertion: result.avg_temperature_c <= result.max_temperature_c
  - check_id: avg_not_greater_than_max_power
    description: Average power must not exceed maximum
    assertion: result.avg_power_w <= result.max_power_w
  math_checks: []
  evidence_checks:
  - evidence_field: max_temperature_c
    description: Must be the actual maximum temperature observed in telemetry
    required: true
  - evidence_field: max_power_w
    description: Must be the actual maximum power draw observed in telemetry
    required: true
  - evidence_field: thermal_throttle_detected
    description: Must be based on explicit throttle indicators in logs, not inferred
    required: true
  flag_rules:
  - flag_id: thermal_limit_exceeded
    condition: thermal_safe == false
    severity: high
    description: GPU temperature exceeded safe limit
  - flag_id: power_limit_exceeded
    condition: power_within_spec == false
    severity: high
    description: GPU power draw exceeded specification
  - flag_id: thermal_throttling
    condition: thermal_throttle_detected == true
    severity: medium
    description: GPU thermal throttling detected during benchmark
  - flag_id: all_metrics_safe
    condition: overall_safe == true
    severity: low
    description: All thermal and power metrics within safe limits
  severity_mapping:
    honey: All metrics safe, no throttling (overall_safe = true)
    jelly: Temperature between 80-85C or power within 10% of limit, no throttling
    propolis: Temperature >= 85C, or power exceeds limit, or throttling detected
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: compute_thermal_power_check_v1
    gpu_model: NVIDIA A100-SXM4-80GB
    max_temperature_c: 72.3
    avg_temperature_c: 65.1
    thermal_limit_c: 85
    thermal_safe: true
    max_power_w: 380
    avg_power_w: 340
    power_limit_w: 400
    power_within_spec: true
    thermal_throttle_detected: false
    overall_safe: true
- assignment_id: cre_memo_cash_on_cash_v1
  name: Cash-on-Cash Return Analysis
  lane: cre_real_estate_memo_eval
  version: '1.0'
  purpose: 'Calculate cash-on-cash return from before-tax cash flow and total equity
    invested, compare against the typical investor threshold (>= 8%), and flag deals
    that fall below.

    '
  operator_instructions: '1. Provide the memo with NOI, debt service, and equity investment.
    2. Verify cash_on_cash_return = before_tax_cash_flow / total_equity_invested.
    3. Check result against threshold (>= 0.08). 4. Flag in risks if below threshold.
    5. Publish eval_receipt.

    '
  agent_prompt: "Property Memo: --- PROPERTY: Willow Creek Villas, 888 Creek Ln, Nashville,\
    \ TN Purchase Price: $9,800,000 Loan Amount: $7,350,000 Equity Invested: $2,450,000\
    \ Closing Costs (paid from equity): $145,000 Stabilized NOI: $812,000 Annual Debt\
    \ Service: $602,400 ---\nCalculate and return ONLY a JSON object:\n1. Total Cash\
    \ Invested = equity_invested + closing_costs 2. Before-Tax Cash Flow = noi - annual_debt_service\
    \ 3. Cash-on-Cash Return = before_tax_cash_flow / total_cash_invested\nJSON structure:\
