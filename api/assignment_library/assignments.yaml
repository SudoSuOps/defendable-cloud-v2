- assignment_id: dataset_class_balance_v1
  name: Class Balance Assessment
  lane: dataset_quality_eval
  version: '1.0'
  purpose: Check label distribution in classification datasets. Calculate class balance
    ratio and flag severe class imbalance.
  operator_instructions: Provide the dataset or a label distribution report. Agent
    must calculate per-class frequencies, proportions, and class_balance_ratio. Flag
    if ratio is below 0.3.
  agent_prompt: 'You are assessing class balance in a classification dataset. REQUIRED
    OUTPUT: Return a JSON object with these exact fields: - assignment_id (string):
    use "dataset_class_balance_v1" - agent_summary (string) - inputs_used (list of
    strings) - missing_inputs (list of strings) - claims (list of objects): claim,
    evidence_reference, confidence ("provided"|"inferred"|"missing") - calculations
    (list of objects): name, formula, inputs, result, units, assumptions - risks (list
    of objects): risk, severity ("low"|"medium"|"high"), evidence_reference - assumptions
    (list of strings) - open_questions (list of strings) - final_output (string) -
    self_check (object): all_required_sections_completed (boolean), all_numbers_have_sources
    (boolean), assumptions_labeled (boolean), missing_inputs_disclosed (boolean) Also
    include: - class_distribution (list of objects): class_label (string), count (integer),
    proportion (number) - class_balance_ratio (number): size_of_smallest_class / size_of_largest_class
    - total_samples (integer) - number_of_classes (integer) - minority_classes (list
    of strings): classes with proportion < 0.1 Compute class_balance_ratio exactly
    as min_class_count / max_class_count. Return numeric values as numbers, not prose.
    Include formula in calculations array. If the dataset is not a classification
    dataset, report missing_inputs and explain.

    '
  required_inputs:
  - dataset_or_label_distribution
  - label_column_name
  - total_sample_count
  expected_outputs:
  - class_distribution
  - class_balance_ratio
  - total_samples
  - number_of_classes
  - minority_classes
  required_output_schema:
    type: object
    required:
    - assignment_id
    - class_distribution
    - class_balance_ratio
    - total_samples
    - number_of_classes
    - minority_classes
    - calculations
    - self_check
  deterministic_checks:
  - check_id: balance_ratio_between_0_and_1
    description: class_balance_ratio must be between 0.0 and 1.0 inclusive
    assertion: 0.0 <= result.class_balance_ratio <= 1.0
  - check_id: counts_sum_to_total
    description: Sum of class counts must equal total_samples
    assertion: sum(c.count for c in result.class_distribution) == result.total_samples
  - check_id: proportions_sum_to_1
    description: Sum of class proportions must equal 1.0 (within tolerance)
    assertion: abs(sum(c.proportion for c in result.class_distribution) - 1.0) < 1e-6
  - check_id: ratio_formula
    description: class_balance_ratio must equal min_count / max_count
    assertion: result.class_balance_ratio == min(c.count for c in result.class_distribution)
      / max(c.count for c in result.class_distribution)
  math_checks:
  - formula_id: class_balance_ratio
    formula: size_of_smallest_class / size_of_largest_class
    description: Ratio measuring how balanced the class distribution is
    output_field: class_balance_ratio
  - formula_id: class_proportion
    formula: class_count / total_samples
    description: Proportion of samples in each class
    output_field: class_distribution[].proportion
  evidence_checks:
  - evidence_field: class_distribution
    description: Must list every class with its exact count and computed proportion
    required: true
  - evidence_field: total_samples
    description: Must be a positive integer matching input
    required: true
  flag_rules:
  - flag_id: severe_class_imbalance
    condition: class_balance_ratio < 0.3
    severity: high
    description: Severe class imbalance detected (ratio < 0.3)
  - flag_id: moderate_class_imbalance
    condition: class_balance_ratio >= 0.3 and class_balance_ratio < 0.5
    severity: medium
    description: Moderate class imbalance (ratio between 0.3 and 0.5)
  - flag_id: balanced_classes
    condition: class_balance_ratio >= 0.5
    severity: low
    description: Reasonably balanced class distribution
  severity_mapping:
    honey: Class balance ratio >= 0.5 (well balanced)
    jelly: Class balance ratio between 0.3 and 0.5 (moderately imbalanced)
    propolis: Class balance ratio < 0.3 (severely imbalanced)
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: dataset_class_balance_v1
    class_distribution:
    - class_label: '0'
      count: 8500
      proportion: 0.85
    - class_label: '1'
      count: 1500
      proportion: 0.15
    class_balance_ratio: 0.176
    total_samples: 10000
    number_of_classes: 2
    minority_classes:
    - '1'
- assignment_id: dataset_content_safety_scan_v1
  name: Content Safety and PII Scan
  lane: dataset_quality_eval
  version: '1.0'
  purpose: Scan a dataset for personally identifiable information (PII), toxic content,
    and unsafe material. Report detection counts and rates with evidence.
  operator_instructions: Provide the dataset or a sample scan report. Agent must identify
    PII fields, toxic content samples, and unsafe material flags with specific counts.
  agent_prompt: 'You are scanning a dataset for content safety issues including PII,
    toxic content, and unsafe material. REQUIRED OUTPUT: Return a JSON object with
    these exact fields: - assignment_id (string): use "dataset_content_safety_scan_v1"
    - agent_summary (string) - inputs_used (list of strings) - missing_inputs (list
    of strings) - claims (list of objects): claim, evidence_reference, confidence
    ("provided"|"inferred"|"missing") - calculations (list of objects): name, formula,
    inputs, result, units, assumptions - risks (list of objects): risk, severity ("low"|"medium"|"high"),
    evidence_reference - assumptions (list of strings) - open_questions (list of strings)
    - final_output (string) - self_check (object): all_required_sections_completed
    (boolean), all_numbers_have_sources (boolean), assumptions_labeled (boolean),
    missing_inputs_disclosed (boolean) Also include: - total_rows_scanned (integer)
    - pii_detected (boolean): whether any PII was found - pii_field_count (integer):
    number of columns/fields containing PII - pii_fields (list of strings): names
    of fields where PII was detected - pii_row_count (integer): number of rows containing
    PII - pii_rate (number): pii_row_count / total_rows_scanned - toxic_content_detected
    (boolean): whether toxic content was found - toxic_content_count (integer): number
    of toxic samples - toxic_content_rate (number): toxic_content_count / total_rows_scanned
    - unsafe_flag_count (integer): total count of unsafe material flags - safety_score
    (number between 0 and 1): max(0, 1 - (pii_rate + toxic_content_rate + unsafe_rate))
    - remediation_required (boolean): true if pii_rate > 0.01 or toxic_content_rate
    > 0.05 or unsafe_flag_count > 0 Compute pii_rate as pii_row_count / total_rows_scanned.
    Compute toxic_content_rate as toxic_content_count / total_rows_scanned. Return
    numeric values as numbers, not prose. Include all formulas in calculations array.

    '
  required_inputs:
  - dataset_or_scan_report
  - pii_patterns_or_scanner_config
  - total_rows
  expected_outputs:
  - total_rows_scanned
  - pii_detected
  - pii_field_count
  - pii_fields
  - pii_row_count
  - pii_rate
  - toxic_content_detected
  - toxic_content_count
  - toxic_content_rate
  - unsafe_flag_count
  - safety_score
  - remediation_required
  required_output_schema:
    type: object
    required:
    - assignment_id
    - total_rows_scanned
    - pii_detected
    - pii_field_count
    - pii_row_count
    - pii_rate
    - toxic_content_detected
    - toxic_content_count
    - toxic_content_rate
    - unsafe_flag_count
    - safety_score
    - remediation_required
    - claims
    - self_check
  deterministic_checks:
  - check_id: pii_rate_formula
    description: pii_rate must equal pii_row_count / total_rows_scanned
    assertion: result.pii_rate == result.pii_row_count / result.total_rows_scanned
  - check_id: toxic_rate_formula
    description: toxic_content_rate must equal toxic_content_count / total_rows_scanned
    assertion: result.toxic_content_rate == result.toxic_content_count / result.total_rows_scanned
  - check_id: safety_score_range
    description: safety_score must be between 0.0 and 1.0
    assertion: 0.0 <= result.safety_score <= 1.0
  - check_id: remediation_flag_logic
    description: remediation_required must be true when thresholds exceeded
    assertion: result.remediation_required == (result.pii_rate > 0.01 or result.toxic_content_rate
      > 0.05 or result.unsafe_flag_count > 0)
  - check_id: pii_consistency
    description: If pii_detected is false, pii_row_count must be 0
    assertion: (not result.pii_detected) implies (result.pii_row_count == 0)
  - check_id: toxic_consistency
    description: If toxic_content_detected is false, toxic_content_count must be 0
    assertion: (not result.toxic_content_detected) implies (result.toxic_content_count
      == 0)
  math_checks:
  - formula_id: pii_rate
    formula: pii_row_count / total_rows_scanned
    description: Fraction of rows containing PII
    output_field: pii_rate
  - formula_id: toxic_content_rate
    formula: toxic_content_count / total_rows_scanned
    description: Fraction of rows containing toxic content
    output_field: toxic_content_rate
  - formula_id: safety_score
    formula: max(0, 1 - (pii_rate + toxic_content_rate + unsafe_rate))
    description: Composite safety score from 0 (unsafe) to 1 (clean)
    output_field: safety_score
  evidence_checks:
  - evidence_field: pii_fields
    description: Must list specific column/field names where PII was found
    required: true
  - evidence_field: pii_row_count
    description: Must be exact count with evidence reference
    required: true
  - evidence_field: toxic_content_count
    description: Must be exact count with evidence reference
    required: true
  flag_rules:
  - flag_id: pii_detected_high
    condition: pii_rate > 0.05
    severity: high
    description: More than 5% of rows contain PII
  - flag_id: pii_detected_low
    condition: pii_rate > 0 and pii_rate <= 0.05
    severity: medium
    description: PII detected in up to 5% of rows
  - flag_id: toxic_content_high
    condition: toxic_content_rate > 0.05
    severity: high
    description: More than 5% of rows contain toxic content
  - flag_id: toxic_content_low
    condition: toxic_content_rate > 0 and toxic_content_rate <= 0.05
    severity: medium
    description: Toxic content detected in up to 5% of rows
  - flag_id: unsafe_material
    condition: unsafe_flag_count > 0
    severity: high
    description: Unsafe material flags detected
  severity_mapping:
    honey: No PII, no toxic content, no unsafe flags (safety_score = 1.0)
    jelly: PII rate <= 1% or toxic rate <= 2%, no unsafe flags
    propolis: PII rate > 1% or toxic rate > 5% or any unsafe flags present
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: dataset_content_safety_scan_v1
    total_rows_scanned: 10000
    pii_detected: true
    pii_field_count: 1
    pii_fields:
    - email_address
    pii_row_count: 45
    pii_rate: 0.0045
    toxic_content_detected: false
    toxic_content_count: 0
    toxic_content_rate: 0.0
    unsafe_flag_count: 0
    safety_score: 0.9955
    remediation_required: false
- assignment_id: dataset_duplicate_detection_v1
  name: Duplicate Row Detection
  lane: dataset_quality_eval
  version: '1.0'
  purpose: Find and quantify duplicate rows in a dataset. Compute duplicate rate and
    flag datasets with excessive duplication.
  operator_instructions: Provide the dataset or a summary with row count and duplicate
    count. Agent must compute duplicate_rate and flag if above 5% threshold.
  agent_prompt: 'You are detecting duplicate rows in a dataset. REQUIRED OUTPUT: Return
    a JSON object with these exact fields: - assignment_id (string): use "dataset_duplicate_detection_v1"
    - agent_summary (string) - inputs_used (list of strings) - missing_inputs (list
    of strings) - claims (list of objects): claim, evidence_reference, confidence
    ("provided"|"inferred"|"missing") - calculations (list of objects): name, formula,
    inputs, result, units, assumptions - risks (list of objects): risk, severity ("low"|"medium"|"high"),
    evidence_reference - assumptions (list of strings) - open_questions (list of strings)
    - final_output (string) - self_check (object): all_required_sections_completed
    (boolean), all_numbers_have_sources (boolean), assumptions_labeled (boolean),
    missing_inputs_disclosed (boolean) Also include: - total_rows (integer) - unique_rows
    (integer) - duplicate_rows (integer) - duplicate_rate (number between 0 and 1):
    duplicate_rows / total_rows - duplicate_subset_columns (list of strings or null):
    columns used for subset duplicate check, or null if full-row - sample_duplicate_keys
    (list): up to 10 examples of duplicate keys/rows Compute duplicate_rate exactly
    as duplicate_rows / total_rows. Return numeric values as numbers, not prose. Include
    the formula in calculations array.

    '
  required_inputs:
  - dataset_or_duplicate_report
  - total_row_count
  - duplicate_subset_columns
  expected_outputs:
  - total_rows
  - unique_rows
  - duplicate_rows
  - duplicate_rate
  - duplicate_subset_columns
  - sample_duplicate_keys
  required_output_schema:
    type: object
    required:
    - assignment_id
    - total_rows
    - unique_rows
    - duplicate_rows
    - duplicate_rate
    - duplicate_subset_columns
    - calculations
    - self_check
  deterministic_checks:
  - check_id: counts_consistent
    description: unique_rows + duplicate_rows must equal total_rows
    assertion: result.unique_rows + result.duplicate_rows == result.total_rows
  - check_id: duplicate_rate_formula
    description: duplicate_rate must equal duplicate_rows / total_rows
    assertion: abs(result.duplicate_rate - (result.duplicate_rows / result.total_rows))
      < 1e-9
  - check_id: rate_between_0_and_1
    description: duplicate_rate must be between 0.0 and 1.0 inclusive
    assertion: 0.0 <= result.duplicate_rate <= 1.0
  - check_id: duplicate_rows_nonnegative
    description: duplicate_rows must be >= 0
    assertion: result.duplicate_rows >= 0
  math_checks:
  - formula_id: duplicate_rate
    formula: duplicate_rows / total_rows
    description: Fraction of rows that are duplicates
    output_field: duplicate_rate
  evidence_checks:
  - evidence_field: total_rows
    description: Must match provided total_row_count
    required: true
  - evidence_field: duplicate_rows
    description: Must be derived from actual duplicate detection, not estimated
    required: true
  - evidence_field: sample_duplicate_keys
    description: Must provide concrete examples, not just counts
    required: false
  flag_rules:
  - flag_id: high_duplicate_rate
    condition: duplicate_rate > 0.05
    severity: high
    description: Duplicate rate exceeds 5%
  - flag_id: moderate_duplicates
    condition: duplicate_rate > 0.01 and duplicate_rate <= 0.05
    severity: medium
    description: Duplicate rate between 1% and 5%
  - flag_id: no_duplicates
    condition: duplicate_rate == 0.0
    severity: low
    description: No duplicate rows found
  severity_mapping:
    honey: Duplicate rate <= 1%
    jelly: Duplicate rate between 1% and 5%
    propolis: Duplicate rate > 5%
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: dataset_duplicate_detection_v1
    total_rows: 50000
    unique_rows: 48750
    duplicate_rows: 1250
    duplicate_rate: 0.025
    duplicate_subset_columns: null
    sample_duplicate_keys: []
- assignment_id: dataset_missing_value_audit_v1
  name: Missing Value Audit
  lane: dataset_quality_eval
  version: '1.0'
  purpose: Calculate the missing value rate per column and overall. Flag columns or
    datasets with excessive missing data.
  operator_instructions: Provide the dataset or a data quality report with per-column
    null counts and total row count. Agent must compute missing value rates and flag
    columns exceeding 10% threshold.
  agent_prompt: 'You are auditing missing values in a dataset. REQUIRED OUTPUT: Return
    a JSON object with these exact fields: - assignment_id (string): use "dataset_missing_value_audit_v1"
    - agent_summary (string) - inputs_used (list of strings) - missing_inputs (list
    of strings) - claims (list of objects): claim, evidence_reference, confidence
    ("provided"|"inferred"|"missing") - calculations (list of objects): name, formula,
    inputs, result, units, assumptions - risks (list of objects): risk, severity ("low"|"medium"|"high"),
    evidence_reference - assumptions (list of strings) - open_questions (list of strings)
    - final_output (string) - self_check (object): all_required_sections_completed
    (boolean), all_numbers_have_sources (boolean), assumptions_labeled (boolean),
    missing_inputs_disclosed (boolean) Also include: - overall_missing_rate (number
    between 0 and 1): total missing cells / total cells - column_missing_rates (list
    of objects): column_name (string), missing_count (integer), total_rows (integer),
    missing_rate (number) - columns_above_threshold (list of strings): column names
    with missing_rate > 0.10 - total_rows (integer) - total_columns (integer) Compute
    overall_missing_rate as total_null_cells / (total_rows * total_columns). Compute
    each column''s missing_rate as null_count_in_column / total_rows. Return numeric
    values as numbers, not prose. Include formulas in calculations array.

    '
  required_inputs:
  - dataset_or_null_report
  - total_row_count
  - total_column_count
  expected_outputs:
  - overall_missing_rate
  - column_missing_rates
  - columns_above_threshold
  - total_rows
  - total_columns
  required_output_schema:
    type: object
    required:
    - assignment_id
    - overall_missing_rate
    - column_missing_rates
    - columns_above_threshold
    - total_rows
    - total_columns
    - calculations
    - self_check
  deterministic_checks:
  - check_id: overall_rate_is_number
    description: overall_missing_rate must be a float
    assertion: isinstance(result.overall_missing_rate, float)
  - check_id: overall_rate_range
    description: overall_missing_rate must be between 0.0 and 1.0
    assertion: 0.0 <= result.overall_missing_rate <= 1.0
  - check_id: column_rates_match_count
    description: Number of column rates must equal total_columns
    assertion: len(result.column_missing_rates) == result.total_columns
  - check_id: columns_above_threshold_consistent
    description: Every column in columns_above_threshold must have rate > 0.10
    assertion: all(col.missing_rate > 0.10 for col in result.column_missing_rates
      if col.column_name in result.columns_above_threshold)
  math_checks:
  - formula_id: overall_missing_rate
    formula: total_null_cells / (total_rows * total_columns)
    description: Overall rate of missing values across entire dataset
    output_field: overall_missing_rate
  - formula_id: column_missing_rate
    formula: null_count_in_column / total_rows
    description: Per-column missing value rate
    output_field: column_missing_rates[].missing_rate
  evidence_checks:
  - evidence_field: column_missing_rates
    description: Each entry must have column_name, missing_count, total_rows, missing_rate
    required: true
  - evidence_field: total_rows
    description: Must be an integer > 0
    required: true
  flag_rules:
  - flag_id: high_overall_missing_rate
    condition: overall_missing_rate > 0.10
    severity: high
    description: Overall missing value rate exceeds 10%
  - flag_id: column_missing_rate_high
    condition: len(columns_above_threshold) > 0
    severity: medium
    description: One or more columns have missing rate exceeding 10%
  - flag_id: perfect_data
    condition: overall_missing_rate == 0.0
    severity: low
    description: No missing values detected
  severity_mapping:
    honey: Overall missing rate <= 2% and no column exceeds 5%
    jelly: Overall missing rate between 2% and 10%, or 1-2 columns between 5% and
      15%
    propolis: Overall missing rate > 10%, or any column > 25%, or 3+ columns > 10%
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    assignment_id: dataset_missing_value_audit_v1
    overall_missing_rate: 0.035
    column_missing_rates:
    - column_name: age
      missing_count: 150
      total_rows: 10000
      missing_rate: 0.015
    - column_name: income
      missing_count: 450
      total_rows: 10000
      missing_rate: 0.045
    columns_above_threshold: []
    total_rows: 10000
    total_columns: 12
