- assignment_id: cre_memo_dscr_ltv_v1
  name: DSCR and LTV Analysis
  lane: cre_real_estate_memo_eval
  version: '1.0'
  purpose: 'Calculate Debt Service Coverage Ratio (DSCR) and Loan-to-Value (LTV) from
    deal terms, compare against standard lending thresholds (DSCR >= 1.20, LTV <=
    0.80), and flag threshold violations. This is a core credit-risk gate for CRE
    underwriting.

    '
  operator_instructions: '1. Provide the property memo with loan terms and property
    value. 2. Verify DSCR and LTV are calculated using the correct formulas. 3. Check
    results against thresholds: DSCR must be >= 1.20; LTV must be <= 0.80. 4. Flag
    any threshold violation in risks[] with appropriate severity. 5. Publish eval_receipt.

    '
  agent_prompt: "Property Memo: --- PROPERTY: Lakeside Terrace, 321 Lake Dr, Orlando,\
    \ FL Appraised Value: $11,500,000 Loan Amount: $8,625,000 Interest Rate: 7.25%\
    \ Amortization: 30 years NOI (stabilized): $920,000 ---\nCalculate and return\
    \ ONLY a JSON object:\n1. Loan-to-Value (LTV) = loan_amount / appraised_value\
    \ 2. Annual Debt Service = loan_amount * [r(1+r)^n / ((1+r)^n - 1)]\n   where\
    \ r = interest_rate / 12, n = amortization in months (360)\n3. Debt Service Coverage\
    \ Ratio (DSCR) = noi / annual_debt_service\nJSON structure: {\n  \"assignment_id\"\
    : \"cre_memo_dscr_ltv_v1\",\n  \"agent_summary\": \"<string>\",\n  \"inputs_used\"\
    : [\"<string>\"],\n  \"missing_inputs\": [\"<string>\"],\n  \"claims\": [\n  \
    \  {\n      \"claim\": \"<string>\",\n      \"evidence_reference\": \"<string>\"\
    ,\n      \"confidence\": \"<provided | inferred | missing>\"\n    }\n  ],\n  \"\
    calculations\": [\n    {\n      \"name\": \"<string>\",\n      \"formula\": \"\
    <string>\",\n      \"inputs\": {\"<key>\": <number>},\n      \"result\": <number>,\n\
    \      \"units\": \"<string>\",\n      \"assumptions\": [\"<string>\"]\n    }\n\
    \  ],\n  \"risks\": [\n    {\n      \"risk\": \"<string>\",\n      \"severity\"\
    : \"<low | medium | high>\",\n      \"evidence_reference\": \"<string>\"\n   \
    \ }\n  ],\n  \"assumptions\": [\"<string>\"],\n  \"open_questions\": [\"<string>\"\
    ],\n  \"final_output\": \"<string>\",\n  \"self_check\": {\n    \"all_required_sections_completed\"\
    : true,\n    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\"\
    : true,\n    \"missing_inputs_disclosed\": true\n  }\n}\nCRITICAL RULES: - Calculate\
    \ annual_debt_service using the mortgage amortization formula\n  with monthly\
    \ compounding. Then multiply by 12 for annual.\n- LTV threshold: LTV must be <=\
    \ 0.80. If LTV > 0.80, add a risk entry\n  with severity \"high\" stating the\
    \ LTV exceeds the threshold.\n- DSCR threshold: DSCR must be >= 1.20. If DSCR\
    \ < 1.20, add a risk entry\n  with severity \"high\" stating the DSCR is below\
    \ the threshold.\n- If both thresholds pass, include a risk entry with severity\
    \ \"low\"\n  stating both thresholds are satisfied.\n- Show the full amortization\
    \ formula in the formula field. - Do not output any text outside the JSON object.\n"
  required_inputs:
  - appraised_value: 11500000
  - loan_amount: 8625000
  - interest_rate: 0.0725
  - amortization_years: 30
  - noi: 920000
  expected_outputs:
  - ltv: 0.75
  - annual_debt_service: approximately 703452.0
  - dscr: approximately 1.308
  - ltv_passes_threshold: true (0.75 <= 0.80)
  - dscr_passes_threshold: true (1.308 >= 1.20)
  - Risk entries reflect threshold compliance or violation
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - calculations
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
  deterministic_checks:
  - name: assignment_id_exact
    description: assignment_id equals "cre_memo_dscr_ltv_v1"
  - name: calculations_has_ltv
    description: calculations contains LTV entry
  - name: calculations_has_annual_debt_service
    description: calculations contains annual debt service entry
  - name: calculations_has_dscr
    description: calculations contains DSCR entry
  - name: risks_has_threshold_assessment
    description: risks array contains at least one threshold-related risk entry
  - name: ltv_threshold_check
    description: LTV value is compared against 0.80 threshold in risks or claims
  - name: dscr_threshold_check
    description: DSCR value is compared against 1.20 threshold in risks or claims
  math_checks:
  - formula_id: ltv
    formula: loan_amount / appraised_value
    inputs:
      loan_amount: 8625000
      appraised_value: 11500000
    expected_result: 0.75
    tolerance: 0.001
  - formula_id: annual_debt_service
    formula: 12 * P * [r(1+r)^n / ((1+r)^n - 1)] where P=loan_amount, r=rate/12, n=360
    inputs:
      loan_amount: 8625000
      annual_interest_rate: 0.0725
      amortization_months: 360
    expected_result: 703452.0
    tolerance: 500.0
  - formula_id: dscr
    formula: noi / annual_debt_service
    inputs:
      noi: 920000
      annual_debt_service: 703452
    expected_result: 1.3078
    tolerance: 0.01
  evidence_checks:
  - name: loan_terms_cited
    description: Loan amount, interest rate, and amortization are cited
  - name: noi_cited
    description: NOI is cited with source
  - name: appraised_value_cited
    description: Appraised value is cited with source
  flag_rules:
  - flag_id: missing_ltv_calculation
    severity: propolis
    condition: calculations array is missing LTV entry
  - flag_id: missing_dscr_calculation
    severity: propolis
    condition: calculations array is missing DSCR entry
  - flag_id: ltv_exceeds_threshold
    severity: jelly
    condition: LTV > 0.80 and no high-severity risk is flagged
  - flag_id: dscr_below_threshold
    severity: jelly
    condition: DSCR < 1.20 and no high-severity risk is flagged
  - flag_id: incorrect_debt_service_formula
    severity: jelly
    condition: annual_debt_service formula is not amortization-based
  - flag_id: math_result_incorrect
    severity: propolis
    condition: Any math check result deviates beyond tolerance
  severity_mapping:
    honey: Minor variation in risk wording or calculation naming
    jelly: Threshold violation not properly flagged or wrong formula shown
    propolis: Missing LTV or DSCR calculation, or math outside tolerance
  receipt_type: eval_receipt
  recommended_human_review: required
  sample_submission_shape:
    assignment_id: cre_memo_dscr_ltv_v1
    agent_summary: Calculated LTV at 75% and DSCR at 1.31; both pass thresholds.
    inputs_used:
    - 'Appraised Value: $11,500,000'
    - 'Loan Amount: $8,625,000'
    - 'Interest Rate: 7.25%'
    - 'Amortization: 30 years'
    - 'NOI: $920,000'
    missing_inputs: []
    claims:
    - claim: LTV is 75.0%, below the 80% threshold.
      evidence_reference: Appraised Value
      confidence: provided
    - claim: DSCR is approximately 1.31, above the 1.20x threshold.
      evidence_reference: NOI
      confidence: provided
    calculations:
    - name: Loan-to-Value Ratio
      formula: loan_amount / appraised_value
      inputs:
        loan_amount: 8625000
        appraised_value: 11500000
      result: 0.75
      units: ratio
      assumptions:
      - Appraised value of $11.5M per memo.
    - name: Annual Debt Service
      formula: 12 * P * [r(1+r)^n / ((1+r)^n - 1)]
      inputs:
        loan_amount: 8625000
        monthly_rate: 0.0060417
        number_of_payments: 360
      result: 703452
      units: USD/year
      assumptions:
      - 30-year amortization, 7.25% annual interest.
    - name: Debt Service Coverage Ratio
      formula: noi / annual_debt_service
      inputs:
        noi: 920000
        annual_debt_service: 703452
      result: 1.3078
      units: ratio
      assumptions:
      - NOI of $920,000 is stabilized per memo.
    risks:
    - risk: LTV of 75% is within the 80% threshold. DSCR of 1.31x exceeds 1.20x minimum.
        Both thresholds pass.
      severity: low
      evidence_reference: Appraised Value
    assumptions:
    - NOI is stabilized at $920,000.
    - Loan is fully amortizing over 30 years at 7.25%.
    open_questions:
    - Is the interest rate fixed for the full loan term?
    final_output: 'LTV: 75.0%; DSCR: 1.31x; Both thresholds pass.'
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: cre_memo_egi_vacancy_v1
  name: Effective Gross Income and Vacancy Analysis
  lane: cre_real_estate_memo_eval
  version: '1.0'
  purpose: 'Calculate Effective Gross Income (EGI) from Gross Potential Rent (GPR)
    and vacancy, then analyze the vacancy rate against market benchmarks. This eval
    tests the agent''s ability to handle income normalization and market comparison
    for vacancy assumptions.

    '
  operator_instructions: '1. Provide the memo with GPR, reported vacancy, and market
    vacancy data. 2. Verify EGI = GPR * (1 - reported_vacancy). 3. Verify the agent
    compares reported vacancy to market vacancy in claims[]. 4. Flag if reported vacancy
    is materially above market without explanation. 5. Publish eval_receipt.

    '
  agent_prompt: "Property Memo: --- PROPERTY: Parkside Lofts, 777 Park Blvd, Charlotte,\
    \ NC Gross Potential Rent: $3,200,000/year Reported Vacancy (as-is): 11.5% Market\
    \ Vacancy (submarket average): 7.2% Other Income (parking, fees): $85,000/year\
    \ ---\nCalculate and return ONLY a JSON object:\n1. Effective Gross Income (EGI)\
    \ = gpr * (1 - reported_vacancy) + other_income 2. Vacancy Loss Amount = gpr *\
    \ reported_vacancy 3. Vacancy Premium Over Market = reported_vacancy - market_vacancy\
    \ 4. Potential EGI at Market Vacancy = gpr * (1 - market_vacancy) + other_income\
    \ 5. EGI Uplift Opportunity = potential_egi_at_market - egi\nJSON structure: {\n\
    \  \"assignment_id\": \"cre_memo_egi_vacancy_v1\",\n  \"agent_summary\": \"<string>\"\
    ,\n  \"inputs_used\": [\"<string>\"],\n  \"missing_inputs\": [\"<string>\"],\n\
    \  \"claims\": [\n    {\n      \"claim\": \"<string>\",\n      \"evidence_reference\"\
    : \"<string>\",\n      \"confidence\": \"<provided | inferred | missing>\"\n \
    \   }\n  ],\n  \"calculations\": [\n    {\n      \"name\": \"<string>\",\n   \
    \   \"formula\": \"<string>\",\n      \"inputs\": {\"<key>\": <number>},\n   \
    \   \"result\": <number>,\n      \"units\": \"<string>\",\n      \"assumptions\"\
    : [\"<string>\"]\n    }\n  ],\n  \"risks\": [\n    {\n      \"risk\": \"<string>\"\
    ,\n      \"severity\": \"<low | medium | high>\",\n      \"evidence_reference\"\
    : \"<string>\"\n    }\n  ],\n  \"assumptions\": [\"<string>\"],\n  \"open_questions\"\
    : [\"<string>\"],\n  \"final_output\": \"<string>\",\n  \"self_check\": {\n  \
    \  \"all_required_sections_completed\": true,\n    \"all_numbers_have_sources\"\
    : true,\n    \"assumptions_labeled\": true,\n    \"missing_inputs_disclosed\"\
    : true\n  }\n}\nCRITICAL RULES: - Reported vacancy must be expressed as decimal\
    \ (0.115) in calculations. - Market vacancy must be expressed as decimal (0.072)\
    \ in calculations. - Include other_income in EGI calculation. - The vacancy premium\
    \ over market is 4.3 percentage points (0.043). - If reported_vacancy > market_vacancy,\
    \ add a risk entry explaining\n  the implication (e.g., value-add opportunity\
    \ or operational risk).\n- claims[] must include at least one entry comparing\
    \ reported vacancy\n  to market vacancy.\n- Show all 5 calculations separately.\
    \ - Do not output any text outside the JSON object.\n"
  required_inputs:
  - gross_potential_rent: 3200000
  - reported_vacancy: 0.115
  - market_vacancy: 0.072
  - other_income: 85000
  expected_outputs:
  - egi: 2918000.0
  - vacancy_loss_amount: 368000.0
  - vacancy_premium_over_market: 0.043
  - potential_egi_at_market: 3052600.0
  - egi_uplift_opportunity: 134600.0
  - claims comparing reported vacancy to market
  - risk entry for vacancy premium
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - calculations
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
  deterministic_checks:
  - name: assignment_id_exact
    description: assignment_id equals "cre_memo_egi_vacancy_v1"
  - name: calculations_has_egi
    description: calculations contains EGI entry
  - name: calculations_has_vacancy_loss
    description: calculations contains vacancy loss amount entry
  - name: calculations_has_vacancy_premium
    description: calculations contains vacancy premium over market entry
  - name: calculations_has_potential_egi
    description: calculations contains potential EGI at market vacancy entry
  - name: calculations_has_egi_uplift
    description: calculations contains EGI uplift opportunity entry
  - name: vacancy_as_decimal
    description: vacancy rates are expressed as decimals (0.115, 0.072)
  - name: other_income_included
    description: EGI calculation includes other_income
  - name: vacancy_comparison_in_claims
    description: claims array has at least one entry comparing vacancy rates
  math_checks:
  - formula_id: egi
    formula: gpr * (1 - reported_vacancy) + other_income
    inputs:
      gpr: 3200000
      reported_vacancy: 0.115
      other_income: 85000
    expected_result: 2918000.0
    tolerance: 1.0
  - formula_id: vacancy_loss
    formula: gpr * reported_vacancy
    inputs:
      gpr: 3200000
      reported_vacancy: 0.115
    expected_result: 368000.0
    tolerance: 1.0
  - formula_id: vacancy_premium
    formula: reported_vacancy - market_vacancy
    inputs:
      reported_vacancy: 0.115
      market_vacancy: 0.072
    expected_result: 0.043
    tolerance: 0.001
  - formula_id: potential_egi_at_market
    formula: gpr * (1 - market_vacancy) + other_income
    inputs:
