    expected_result: 30
    tolerance: 0
  - formula_id: third_calc
    formula: 15 - 7
    expected_result: 8
    tolerance: 0
  evidence_checks:
  - name: claims_evidence_matches_calc
    description: claims[].evidence_reference matches corresponding calculation name
  flag_rules:
  - flag_id: wrong_calculation_count
    severity: propolis
    condition: calculations array length is not exactly 3
  - flag_id: wrong_claims_count
    severity: jelly
    condition: claims array length is not exactly 2
  - flag_id: final_output_mismatch
    severity: propolis
    condition: final_output does not match exact required string
  - flag_id: instruction_order_violation
    severity: propolis
    condition: Entries in calculations or claims are in wrong order
  - flag_id: assumptions_count_mismatch
    severity: jelly
    condition: assumptions array length is not exactly 3
  - flag_id: math_result_incorrect
    severity: propolis
    condition: Any calculation result does not match expected value
  severity_mapping:
    honey: Minor deviation in non-required formatting
    jelly: Material count or content mismatch that affects scoring
    propolis: Critical instruction violation that voids the submission
  receipt_type: eval_receipt
  recommended_human_review: optional
  sample_submission_shape:
    assignment_id: genai_instruction_following_v1
    agent_summary: Followed all 8 steps in exact order.
    inputs_used:
    - a
    - b
    missing_inputs: []
    claims:
    - claim: The sum of 10 and 20 is 30.
      evidence_reference: first_calc
      confidence: provided
    - claim: The product of 5 and 6 is 30.
      evidence_reference: second_calc
      confidence: provided
    calculations:
    - name: first_calc
      formula: a + b
      inputs:
        a: 10
        b: 20
      result: 30
      units: count
      assumptions:
      - Assumed a and b are integers.
    - name: second_calc
      formula: a * b
      inputs:
        a: 5
        b: 6
      result: 30
      units: count
      assumptions:
      - Assumed multiplication.
    - name: third_calc
      formula: b - a
      inputs:
        a: 7
        b: 15
      result: 8
      units: count
      assumptions:
      - Assumed subtraction.
    risks:
    - risk: No risks identified.
      severity: low
      evidence_reference: none
    assumptions:
    - Assumed a and b are integers.
    - Assumed multiplication.
    - Assumed subtraction.
    open_questions: []
    final_output: Instructions followed in order.
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: genai_schema_compliance_v1
  name: Schema Compliance Test
  lane: general_ai_agent_work_eval
  version: '1.0'
  purpose: 'Test whether the agent can follow a strict JSON schema and return all
    required top-level fields without omission, misspelling, or type deviation. This
    is a foundational gate: agents that cannot emit the required shape fail all downstream
    evals.

    '
  operator_instructions: '1. Send the agent_prompt to the agent with no modifications.
    2. Receive the agent''s JSON response. 3. Run deterministic_checks against the
    raw JSON keys. 4. Do NOT grade content quality; only check structural compliance.
    5. Publish an eval_receipt with pass/fail for every check.

    '
  agent_prompt: "You must return a single JSON object with exactly the following structure.\
    \ Do not wrap it in markdown code fences. Do not add extra keys. Do not omit any\
    \ key.\nRequired JSON object: {\n  \"assignment_id\": \"genai_schema_compliance_v1\"\
    ,\n  \"agent_summary\": \"<string: one-sentence summary of what you did>\",\n\
    \  \"inputs_used\": [\"<list of strings: every input you consumed>\"],\n  \"missing_inputs\"\
    : [\"<list of strings: any expected inputs you did not receive>\"],\n  \"claims\"\
    : [\n    {\n      \"claim\": \"<string: factual assertion>\",\n      \"evidence_reference\"\
    : \"<string: source identifier or 'none'>\",\n      \"confidence\": \"<one of:\
    \ provided | inferred | missing>\"\n    }\n  ],\n  \"calculations\": [\n    {\n\
    \      \"name\": \"<string: name of calculation>\",\n      \"formula\": \"<string:\
    \ formula used>\",\n      \"inputs\": {},\n      \"result\": null,\n      \"units\"\
    : \"<string: unit of measure>\",\n      \"assumptions\": [\"<string>\"]\n    }\n\
    \  ],\n  \"risks\": [\n    {\n      \"risk\": \"<string: description>\",\n   \
    \   \"severity\": \"<one of: low | medium | high>\",\n      \"evidence_reference\"\
    : \"<string>\"\n    }\n  ],\n  \"assumptions\": [\"<string: every assumption you\
    \ made>\"],\n  \"open_questions\": [\"<string: anything unresolved>\"],\n  \"\
    final_output\": \"<string: concise final result>\"\n}\nInstructions: - assignment_id\
    \ must be exactly \"genai_schema_compliance_v1\". - agent_summary must be a non-empty\
    \ string. - inputs_used must be an array (empty [] if none). - missing_inputs\
    \ must be an array (empty [] if none). - claims must be an array with at least\
    \ one object; each object must have\n  keys \"claim\", \"evidence_reference\"\
    , and \"confidence\" with confidence\n  exactly matching one of the allowed enum\
    \ values.\n- calculations must be an array (empty [] if no calculations performed).\
    \ - risks must be an array with at least one object; each object must have\n \
    \ keys \"risk\", \"severity\", and \"evidence_reference\" with severity exactly\n\
    \  matching one of the allowed enum values.\n- assumptions must be an array (empty\
    \ [] if none). - open_questions must be an array (empty [] if none). - final_output\
    \ must be a non-empty string. - Do not output any text before or after the JSON\
    \ object.\n"
  required_inputs: []
  expected_outputs:
  - A JSON object containing all 11 top-level keys specified in agent_prompt
  - Keys must be spelled exactly as specified (case-sensitive)
  - Values must match the types specified (string, array, object)
  - confidence field must be one of: provided, inferred, missing
  - severity field must be one of: low, medium, high
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - calculations
    - risks
    - assumptions
    - open_questions
    - final_output
  deterministic_checks:
  - name: top_level_key_count
    description: JSON object has exactly 10 top-level keys
  - name: assignment_id_exact_match
    description: assignment_id equals "genai_schema_compliance_v1"
  - name: agent_summary_non_empty_string
    description: agent_summary is a string with length > 0
  - name: inputs_used_is_array
    description: inputs_used is an array type
  - name: missing_inputs_is_array
    description: missing_inputs is an array type
  - name: claims_is_non_empty_array
    description: claims is an array with length >= 1
  - name: each_claim_has_required_keys
    description: Every element in claims has keys claim, evidence_reference, confidence
  - name: confidence_enum_valid
    description: Every claims[].confidence is one of provided, inferred, missing
  - name: calculations_is_array
    description: calculations is an array type
  - name: risks_is_non_empty_array
    description: risks is an array with length >= 1
  - name: each_risk_has_required_keys
    description: Every element in risks has keys risk, severity, evidence_reference
  - name: severity_enum_valid
    description: Every risks[].severity is one of low, medium, high
  - name: assumptions_is_array
    description: assumptions is an array type
  - name: open_questions_is_array
    description: open_questions is an array type
  - name: final_output_non_empty_string
    description: final_output is a string with length > 0
  - name: no_extra_top_level_keys
    description: No keys exist beyond the 10 required top-level keys
  math_checks: []
  evidence_checks:
  - name: claims_have_evidence_reference
    description: Every claim object contains a non-null evidence_reference field
  - name: risks_have_evidence_reference
    description: Every risk object contains a non-null evidence_reference field
  flag_rules:
  - flag_id: missing_top_level_key
    severity: propolis
    condition: Any required top-level key is absent from the JSON object
  - flag_id: extra_top_level_key
    severity: honey
    condition: Any key not in the required list is present
  - flag_id: wrong_type_for_key
    severity: jelly
    condition: Any required key has a value of the wrong JSON type
  - flag_id: empty_claims_or_risks
    severity: jelly
    condition: claims or risks array has length 0
  - flag_id: enum_violation
    severity: propolis
    condition: confidence or severity value does not match allowed enum
  severity_mapping:
    honey: Minor deviation that does not affect eval automation (e.g., extra keys,
      non-critical formatting)
    jelly: Material deviation that requires manual correction but does not invalidate
      the eval
    propolis: Critical deviation that prevents automated evaluation; submission is
      rejected
  receipt_type: eval_receipt
  recommended_human_review: optional
  sample_submission_shape:
    assignment_id: genai_schema_compliance_v1
    agent_summary: Returned all required schema fields as specified.
    inputs_used: []
    missing_inputs: []
    claims:
    - claim: Schema compliance test completed successfully.
      evidence_reference: prompt_instructions
      confidence: provided
    calculations: []
    risks:
    - risk: No risks identified in schema compliance test.
      severity: low
      evidence_reference: prompt_instructions
    assumptions:
    - Agent followed provided schema exactly.
    open_questions: []
    final_output: Schema compliant.
- assignment_id: repair_fine_tune_roi_analysis_v1
  name: Fine-Tune ROI and Recommendation
  lane: repair_fine_tune_candidate_eval
  version: '1.0'
  purpose: 'Evaluate whether fine-tuning the model is cost-effective based on detected
    failure patterns. Output a structured recommendation with estimated cost, expected
    improvement, ROI analysis, and priority level.

    '
  operator_instructions: 'Provide the output from a systematic failure pattern detection
    analysis (assignment_id: repair_systematic_failure_detection_v1) and current operational
    cost data. The cost data should include per-inference cost, volume of inferences
    per month, and estimated fine-tuning cost. Do not estimate costs if actuals are
    unavailable - mark as missing.

    '
  agent_prompt: "You are a repair and fine-tune candidate evaluator. Your task is\
    \ to determine whether fine-tuning the model is a cost-effective remediation for\
    \ the detected failure patterns.\nYou will receive: - failure_patterns (array\
    \ of detected patterns from prior analysis) - current_operational_costs (object\
    \ with cost data)\nFrom the failure patterns, determine: - pattern_count_by_type\
    \ (object: count of patterns per pattern_type) - total_submissions_affected (integer:\
    \ total unique submissions with any failure) - worst_affected_assignment (string:\
    \ assignment_id with most failures)\nFrom the operational costs, extract: - per_inference_cost_usd\
    \ (float: cost per API call in USD) - monthly_inference_volume (integer: number\
    \ of inferences per month) - estimated_fine_tune_cost_usd (float: one-time fine-tuning\
    \ cost in USD) - current_monthly_cost_usd (float: per_inference_cost_usd * monthly_inference_volume)\n\
    Compute ROI metrics: - current_annual_cost_usd (float: current_monthly_cost_usd\
    \ * 12) - estimated_failure_rate (float: total_submissions_affected / total_submissions_analyzed\
    \ from prior analysis, or 0.0 if unavailable) - cost_of_failures_annual_usd (float:\
    \ estimated failure remediation cost per year - use operator-provided value or\
    \ compute as current_annual_cost_usd * estimated_failure_rate * 0.5) - projected_improvement_rate\
    \ (float: expected reduction in failure rate after fine-tune, default to 0.60\
    \ if not provided) - annual_savings_usd (float: cost_of_failures_annual_usd *\
    \ projected_improvementment_rate) - payback_period_months (float: estimated_fine_tune_cost_usd\
    \ / (annual_savings_usd / 12), or -1.0 if annual_savings_usd == 0) - three_year_roi_ratio\
    \ (float: (annual_savings_usd * 3 - estimated_fine_tune_cost_usd) / estimated_fine_tune_cost_usd,\
    \ or 0.0 if fine_tune_cost == 0)\nDetermine recommendation: - priority (string:\
    \ one of \"critical\", \"high\", \"medium\", \"low\", \"not_recommended\") - recommended_action\
    \ (string: \"fine_tune\", \"prompt_engineering\", \"hybrid\", or \"monitor\")\
    \ - justification (string: detailed reasoning)\nPriority rules: - \"critical\"\
    : estimated_failure_rate > 0.30 OR pattern count for\n  hallucination or reasoning_error\
    \ > 2\n- \"high\": estimated_failure_rate > 0.15 OR annual_savings_usd > estimated_fine_tune_cost_usd\
    \ - \"medium\": estimated_failure_rate > 0.05 OR payback_period_months <= 12 -\
    \ \"low\": estimated_failure_rate > 0.01 OR any patterns detected - \"not_recommended\"\
    : estimated_failure_rate == 0 AND no patterns detected\nReturn a single JSON object\
    \ with this exact structure: {\n  \"assignment_id\": \"repair_fine_tune_roi_analysis_v1\"\
    ,\n  \"agent_summary\": \"<one-sentence summary>\",\n  \"inputs_used\": [\"<list\
    \ inputs>\"],\n  \"missing_inputs\": [\"<list missing inputs>\"],\n  \"claims\"\
    : [\n    {\n      \"claim\": \"<specific claim>\",\n      \"evidence_reference\"\
    : \"<pattern_id or calculation name>\",\n      \"confidence\": \"provided | inferred\
    \ | missing\"\n    }\n  ],\n  \"calculations\": [\n    {\n      \"name\": \"current_monthly_cost_usd\"\
    ,\n      \"formula\": \"per_inference_cost_usd * monthly_inference_volume\",\n\
    \      \"inputs\": {},\n      \"result\": 0.0,\n      \"units\": \"USD\",\n  \
    \    \"assumptions\": []\n    },\n    {\n      \"name\": \"current_annual_cost_usd\"\
    ,\n      \"formula\": \"current_monthly_cost_usd * 12\",\n      \"inputs\": {},\n\
    \      \"result\": 0.0,\n      \"units\": \"USD\",\n      \"assumptions\": []\n\
    \    },\n    {\n      \"name\": \"estimated_failure_rate\",\n      \"formula\"\
    : \"total_submissions_affected / total_submissions_analyzed\",\n      \"inputs\"\
    : {},\n      \"result\": 0.0,\n      \"units\": \"ratio (0.0 to 1.0)\",\n    \
    \  \"assumptions\": [\"uses data from prior failure pattern detection\"]\n   \
    \ },\n    {\n      \"name\": \"cost_of_failures_annual_usd\",\n      \"formula\"\
    : \"current_annual_cost_usd * estimated_failure_rate * 0.5\",\n      \"inputs\"\
    : {},\n      \"result\": 0.0,\n      \"units\": \"USD\",\n      \"assumptions\"\
    : [\"assumes failure remediation cost is 50% of annual inference cost proportional\
    \ to failure rate\"]\n    },\n    {\n      \"name\": \"annual_savings_usd\",\n\
    \      \"formula\": \"cost_of_failures_annual_usd * projected_improvement_rate\"\
    ,\n      \"inputs\": {},\n      \"result\": 0.0,\n      \"units\": \"USD\",\n\
    \      \"assumptions\": [\"projected_improvement_rate defaults to 0.60 if not\
    \ provided\"]\n    },\n    {\n      \"name\": \"payback_period_months\",\n   \
    \   \"formula\": \"estimated_fine_tune_cost_usd / (annual_savings_usd / 12)\"\
    ,\n      \"inputs\": {},\n      \"result\": 0.0,\n      \"units\": \"months\"\
    ,\n      \"assumptions\": [\"returns -1.0 if annual_savings_usd == 0 (division\
    \ by zero protection)\"]\n    },\n    {\n      \"name\": \"three_year_roi_ratio\"\
    ,\n      \"formula\": \"(annual_savings_usd * 3 - estimated_fine_tune_cost_usd)\
    \ / estimated_fine_tune_cost_usd\",\n      \"inputs\": {},\n      \"result\":\
    \ 0.0,\n      \"units\": \"ratio\",\n      \"assumptions\": [\"returns 0.0 if\
    \ estimated_fine_tune_cost_usd == 0\"]\n    }\n  ],\n  \"fine_tune_recommendation\"\
    : {\n    \"priority\": \"\",\n    \"recommended_action\": \"\",\n    \"justification\"\
    : \"\",\n    \"estimated_cost_usd\": 0.0,\n    \"expected_improvement_rate\":\
    \ 0.0,\n    \"projected_annual_savings_usd\": 0.0,\n    \"payback_period_months\"\
    : 0.0,\n    \"three_year_roi_ratio\": 0.0\n  },\n  \"risks\": [\n    {\n     \
    \ \"risk\": \"<risk description>\",\n      \"severity\": \"low | medium | high\"\
    ,\n      \"evidence_reference\": \"\"\n    }\n  ],\n  \"assumptions\": [\"<assumptions>\"\
    ],\n  \"open_questions\": [\"<open questions>\"],\n  \"final_output\": \"<PASS,\
    \ CONDITIONAL_PASS, or FAIL>\",\n  \"self_check\": {\n    \"all_required_sections_completed\"\
    : true,\n    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\"\
    : true,\n    \"missing_inputs_disclosed\": true\n  }\n}\nRules for final_output\
    \ (evaluating the ROI analysis itself): - \"PASS\": All 7 calculations present\
    \ with numeric results, fine_tune_recommendation\n  has all required fields with\
    \ valid enum values, priority determination follows\n  the priority rules, and\
    \ all financial values are non-negative numbers.\n- \"CONDITIONAL_PASS\": Calculations\
    \ present but some inputs were missing (marked in\n  missing_inputs), OR priority\
    \ determination required inference due to edge cases.\n- \"FAIL\": Missing fine_tune_recommendation\
    \ object, calculations missing, invalid\n  priority value, or negative financial\
    \ values where positives are expected.\n"
  required_inputs:
  - name: failure_patterns
    type: array
    description: Output from repair_systematic_failure_detection_v1 (failure_patterns
      array)
  - name: current_operational_costs
    type: object
    description: JSON object with per_inference_cost_usd, monthly_inference_volume,
      estimated_fine_tune_cost_usd, projected_improvement_rate (optional)
  - name: total_submissions_analyzed
    type: integer
    description: Total number of submissions analyzed in the prior failure detection
      step
  expected_outputs:
  - calculations array with 7 computed financial metrics
  - fine_tune_recommendation object with priority, recommended_action, justification,
    estimated_cost_usd, expected_improvement_rate, projected_annual_savings_usd, payback_period_months,
    three_year_roi_ratio
  - final_output verdict (PASS, CONDITIONAL_PASS, FAIL)
  - risks array with severity ratings
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - calculations
    - fine_tune_recommendation
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
    properties:
      calculations:
        type: array
        items:
          type: object
          required:
          - name
          - formula
          - inputs
          - result
          - units
          - assumptions
      fine_tune_recommendation:
        type: object
        required:
        - priority
        - recommended_action
        - justification
        - estimated_cost_usd
        - expected_improvement_rate
        - projected_annual_savings_usd
        - payback_period_months
        - three_year_roi_ratio
      final_output:
        type: string
        enum:
        - PASS
        - CONDITIONAL_PASS
        - FAIL
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - check: final_output is one of PASS, CONDITIONAL_PASS, FAIL
    match_field: final_output
    expected_values:
    - PASS
    - CONDITIONAL_PASS
    - FAIL
  - check: calculations array has exactly 7 entries
    match_field: len(calculations)
    expected_value: 7
  - check: Each calculation has name, formula, inputs, result, units, assumptions
    match_field: calculations
    required_keys:
    - name
    - formula
    - inputs
    - result
    - units
    - assumptions
  - check: fine_tune_recommendation has all required fields
    match_field: fine_tune_recommendation
    required_keys:
    - priority
    - recommended_action
    - justification
    - estimated_cost_usd
    - expected_improvement_rate
    - projected_annual_savings_usd
    - payback_period_months
    - three_year_roi_ratio
  - check: priority is from allowed enum
    match_field: fine_tune_recommendation.priority
    allowed_values:
    - critical
    - high
    - medium
    - low
    - not_recommended
  - check: recommended_action is from allowed enum
    match_field: fine_tune_recommendation.recommended_action
    allowed_values:
    - fine_tune
    - prompt_engineering
    - hybrid
    - monitor
  - check: estimated_cost_usd is non-negative number
    match_field: fine_tune_recommendation.estimated_cost_usd
    type: number
    minimum: 0
  - check: expected_improvement_rate is between 0 and 1
    match_field: fine_tune_recommendation.expected_improvement_rate
    type: number
    minimum: 0
    maximum: 1
  - check: payback_period_months is number (or -1.0 for undefined)
    match_field: fine_tune_recommendation.payback_period_months
    type: number
  - check: three_year_roi_ratio is number
    match_field: fine_tune_recommendation.three_year_roi_ratio
    type: number
  - check: self_check.all_required_sections_completed is true
    match_field: self_check.all_required_sections_completed
    expected_value: true
  math_checks:
  - check: current_monthly_cost_usd = per_inference_cost * monthly_volume
    match_field: calculations
    formula_check: entry with name 'current_monthly_cost_usd' has result == per_inference_cost_usd
      * monthly_inference_volume
  - check: current_annual_cost_usd = monthly_cost * 12
    match_field: calculations
    formula_check: entry with name 'current_annual_cost_usd' has result == current_monthly_cost_usd
      result * 12
  - check: cost_of_failures_annual = annual_cost * failure_rate * 0.5
    match_field: calculations
    formula_check: entry with name 'cost_of_failures_annual_usd' has result == current_annual_cost_usd
      result * estimated_failure_rate result * 0.5
  - check: annual_savings = cost_of_failures * improvement_rate
    match_field: calculations
    formula_check: entry with name 'annual_savings_usd' has result == cost_of_failures_annual_usd
      result * projected_improvement_rate result
  - check: payback_period = fine_tune_cost / (annual_savings / 12), or -1.0 if savings
      is 0
    match_field: calculations
    formula_check: entry with name 'payback_period_months' has result == estimated_fine_tune_cost_usd
      / (annual_savings_usd result / 12), or -1.0 if annual_savings_usd result ==
      0
  - check: 3yr ROI = (savings*3 - cost) / cost, or 0.0 if cost is 0
    match_field: calculations
    formula_check: entry with name 'three_year_roi_ratio' has result == (annual_savings_usd
      result * 3 - estimated_fine_tune_cost_usd) / estimated_fine_tune_cost_usd, or
      0.0 if estimated_fine_tune_cost_usd == 0
  evidence_checks:
  - check: Every claim has a non-empty evidence_reference
    match_field: claims
    condition: all claims must have evidence_reference != '' and evidence_reference
      != null
  - check: Justification references specific failure patterns or cost data
    match_field: fine_tune_recommendation.justification
    condition: justification must reference at least one pattern_id from failure_patterns
      OR a specific cost figure
  - check: Priority determination is consistent with priority rules
    match_field: fine_tune_recommendation.priority
    condition: priority must follow the defined rules based on failure_rate and pattern
      types
  - check: Every risk has a non-empty evidence_reference
    match_field: risks
    condition: all risks must have non-empty evidence_reference
  flag_rules:
  - flag_id: missing_cost_inputs
    condition: missing_inputs contains any of 'per_inference_cost_usd', 'monthly_inference_volume',
      'estimated_fine_tune_cost_usd'
    severity: high
    message: Required cost inputs are missing - ROI analysis is incomplete
  - flag_id: negative_financial_value
    condition: fine_tune_recommendation.estimated_cost_usd < 0 OR fine_tune_recommendation.projected_annual_savings_usd
      < 0 OR fine_tune_recommendation.payback_period_months < -1.0
    severity: high
    message: Financial values should not be negative (except payback_period which
      can be -1.0 for undefined)
  - flag_id: improvement_rate_out_of_range
    condition: fine_tune_recommendation.expected_improvement_rate < 0 OR fine_tune_recommendation.expected_improvement_rate
      > 1
    severity: medium
    message: Expected improvement rate must be between 0 and 1
  - flag_id: priority_mismatch
    condition: priority is 'not_recommended' but failure_patterns is non-empty, OR
      priority is 'critical' but failure_rate is 0
    severity: medium
    message: Priority determination is inconsistent with failure pattern data
  - flag_id: incomplete_self_check
    condition: self_check.all_required_sections_completed != true
    severity: high
    message: Agent did not complete all required self-check sections
  severity_mapping:
    honey: 'Low failure rate (<5%) with minor patterns. Fine-tune may not be cost-effective;
      prompt engineering is likely sufficient. Result: PASS with ''low'' or ''not_recommended''
      priority.'
    jelly: 'Moderate failure rate (5-20%) with patterns in specific areas. Fine-tune
      has positive ROI but payback period >6 months. Hybrid approach (prompt engineering
      + targeted fine-tune) recommended. Result: CONDITIONAL_PASS.'
    propolis: 'High failure rate (>20%) or critical patterns (hallucination, reasoning
      errors). Fine-tune has strong ROI with payback <6 months. This is a model-level
      quality issue requiring immediate intervention. Result: FAIL (of current model)
      with ''critical'' fine-tune priority.'
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    inputs:
      failure_patterns: '[{pattern_id: ''P001'', pattern_type: ''hallucination'',
        frequency: 8, ...}]'
      current_operational_costs: '{per_inference_cost_usd: 0.02, monthly_inference_volume:
        50000, estimated_fine_tune_cost_usd: 15000}'
      total_submissions_analyzed: 50
    expected_final_output: PASS | CONDITIONAL_PASS | FAIL
    notes: Human reviewer should validate cost assumptions against actual vendor pricing
      and confirm improvement rate estimates with ML engineering.
- assignment_id: repair_systematic_failure_detection_v1
  name: Systematic Failure Pattern Detection
  lane: repair_fine_tune_candidate_eval
  version: '1.0'
  purpose: 'Analyze multiple submitted agent outputs to detect systematic failure
    patterns (e.g., consistent hallucination, repeated schema violations, recurring
    reasoning errors). Output a structured failure_patterns array with classification,
    frequency, affected assignments, and recommended remediation actions.

    '
  operator_instructions: 'Provide a batch of agent submission JSON files (minimum
    5 submissions) along with their corresponding assignment IDs. Submissions should
    be the raw JSON outputs from previous eval runs. Do not filter or pre-screen.

    '
  agent_prompt: "You are a repair and fine-tune candidate evaluator. Your task is\
    \ to analyze a batch of agent submissions to detect systematic failure patterns.\n\
    You will receive: - A set of agent submission JSON files - The assignment_id each\
    \ submission corresponds to\nFor each submission, validate against the assignment's\
    \ required_output_schema. Record every validation failure found.\nThen, aggregate\
    \ failures across all submissions to identify systematic patterns. A pattern is\
    \ \"systematic\" if it appears in 2 or more submissions across the same assignment\
    \ or across multiple assignments.\nFor each systematic pattern detected, output:\
    \ - pattern_id (string: e.g., \"P001\") - pattern_type (string: one of \"schema_violation\"\
    , \"hallucination\",\n  \"reasoning_error\", \"calculation_error\", \"missing_required_field\"\
    ,\n  \"incorrect_data_type\", \"self_check_failure\", \"other\")\n- description\
    \ (string: detailed description of the pattern) - frequency (integer: number of\
    \ submissions affected) - total_submissions_analyzed (integer) - affected_assignments\
    \ (array of strings: assignment_ids where this pattern appeared) - example_evidence\
    \ (array of objects, each with:\n    - submission_id (string)\n    - assignment_id\
    \ (string)\n    - excerpt (string: the actual failing content or path)\n    -\
    \ failure_detail (string: what was wrong))\n- recommended_action (string: specific\
    \ remediation step, e.g.,\n  \"Add explicit few-shot example for X in prompt\"\
    ,\n  \"Strengthen schema enforcement with required field list\",\n  \"Add calculation\
    \ verification step in agent prompt\",\n  \"Consider fine-tuning on examples with\
    \ correct Y output\")\n\nAlso compute summary statistics: - total_submissions\
    \ (integer) - total_unique_assignments (integer) - total_unique_patterns (integer)\
    \ - submissions_with_any_failure (integer) - pass_rate (float: (total_submissions\
    \ - submissions_with_any_failure) / total_submissions, or 0.0 if total_submissions\
    \ == 0)\nReturn a single JSON object with this exact structure: {\n  \"assignment_id\"\
    : \"repair_systematic_failure_detection_v1\",\n  \"agent_summary\": \"<one-sentence\
    \ summary>\",\n  \"inputs_used\": [\"<list inputs>\"],\n  \"missing_inputs\":\
    \ [\"<list missing inputs>\"],\n  \"claims\": [\n    {\n      \"claim\": \"<specific\
    \ claim>\",\n      \"evidence_reference\": \"<submission_id or pattern_id>\",\n\
    \      \"confidence\": \"provided | inferred | missing\"\n    }\n  ],\n  \"calculations\"\
    : [\n    {\n      \"name\": \"pass_rate\",\n      \"formula\": \"(total_submissions\
    \ - submissions_with_any_failure) / total_submissions\",\n      \"inputs\": {},\n\
    \      \"result\": 0.0,\n      \"units\": \"ratio (0.0 to 1.0)\",\n      \"assumptions\"\
    : [\"a submission passes if it has zero validation failures\"]\n    }\n  ],\n\
    \  \"failure_patterns\": [\n    {\n      \"pattern_id\": \"P001\",\n      \"pattern_type\"\
    : \"\",\n      \"description\": \"\",\n      \"frequency\": 0,\n      \"total_submissions_analyzed\"\
    : 0,\n      \"affected_assignments\": [],\n      \"example_evidence\": [\n   \
    \     {\n          \"submission_id\": \"\",\n          \"assignment_id\": \"\"\
    ,\n          \"excerpt\": \"\",\n          \"failure_detail\": \"\"\n        }\n\
    \      ],\n      \"recommended_action\": \"\"\n    }\n  ],\n  \"summary_statistics\"\
    : {\n    \"total_submissions\": 0,\n    \"total_unique_assignments\": 0,\n   \
    \ \"total_unique_patterns\": 0,\n    \"submissions_with_any_failure\": 0,\n  \
    \  \"pass_rate\": 0.0\n  },\n  \"risks\": [\n    {\n      \"risk\": \"<risk description>\"\
    ,\n      \"severity\": \"low | medium | high\",\n      \"evidence_reference\"\
    : \"\"\n    }\n  ],\n  \"assumptions\": [\"<assumptions>\"],\n  \"open_questions\"\
    : [\"<open questions>\"],\n  \"final_output\": \"<PASS, CONDITIONAL_PASS, or FAIL>\"\
    ,\n  \"self_check\": {\n    \"all_required_sections_completed\": true,\n    \"\
    all_numbers_have_sources\": true,\n    \"assumptions_labeled\": true,\n    \"\
    missing_inputs_disclosed\": true\n  }\n}\nRules for final_output (evaluating the\
    \ repair analysis itself): - \"PASS\": At least 5 submissions analyzed, all failure\
    \ patterns have\n  pattern_type from the allowed enum, frequency >= 2 for all\
    \ patterns,\n  and every pattern has at least one example_evidence entry.\n- \"\
    CONDITIONAL_PASS\": At least 5 submissions analyzed but some patterns\n  have\
    \ frequency < 2 OR some patterns lack example_evidence.\n- \"FAIL\": Fewer than\
    \ 5 submissions analyzed, OR no failure_patterns\n  array, OR patterns have invalid\
    \ pattern_type values.\n"
  required_inputs:
  - name: submission_batch
    type: array_of_files
    description: A set of agent submission JSON files (minimum 5)
  - name: assignment_metadata
    type: file
    description: JSON mapping submission filenames to their assignment_ids and required
      schemas
  expected_outputs:
  - failure_patterns array with pattern_id, pattern_type, description, frequency,
    total_submissions_analyzed, affected_assignments, example_evidence, recommended_action
  - summary_statistics object with totals and pass_rate
  - final_output verdict (PASS, CONDITIONAL_PASS, FAIL)
  - risks array with severity ratings
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - calculations
    - failure_patterns
    - summary_statistics
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
    properties:
      failure_patterns:
        type: array
        items:
          type: object
          required:
          - pattern_id
          - pattern_type
          - description
          - frequency
          - total_submissions_analyzed
          - affected_assignments
          - example_evidence
          - recommended_action
      summary_statistics:
        type: object
        required:
        - total_submissions
        - total_unique_assignments
        - total_unique_patterns
        - submissions_with_any_failure
        - pass_rate
      final_output:
        type: string
        enum:
        - PASS
        - CONDITIONAL_PASS
        - FAIL
      self_check:
        type: object
        required:
        - all_required_sections_completed
        - all_numbers_have_sources
        - assumptions_labeled
        - missing_inputs_disclosed
  deterministic_checks:
  - check: final_output is one of PASS, CONDITIONAL_PASS, FAIL
    match_field: final_output
    expected_values:
    - PASS
    - CONDITIONAL_PASS
    - FAIL
  - check: failure_patterns is an array
    match_field: failure_patterns
    type: array
  - check: Every failure pattern has all required fields
    match_field: failure_patterns
    required_keys:
    - pattern_id
    - pattern_type
    - description
    - frequency
    - total_submissions_analyzed
    - affected_assignments
    - example_evidence
    - recommended_action
  - check: pattern_type values are from allowed enum
    match_field: failure_patterns.pattern_type
    allowed_values:
    - schema_violation
    - hallucination
    - reasoning_error
    - calculation_error
    - missing_required_field
    - incorrect_data_type
    - self_check_failure
    - other
  - check: summary_statistics has all required fields
    match_field: summary_statistics
    required_keys:
    - total_submissions
    - total_unique_assignments
    - total_unique_patterns
    - submissions_with_any_failure
    - pass_rate
  - check: summary_statistics.total_submissions >= 5
    match_field: summary_statistics.total_submissions
    minimum: 5
  - check: pass_rate in summary_statistics equals (total_submissions - submissions_with_any_failure)
      / total_submissions
    match_field: summary_statistics
    condition: pass_rate must equal (total_submissions - submissions_with_any_failure)
      / total_submissions, or 0.0 if total_submissions == 0
  - check: self_check.all_required_sections_completed is true
    match_field: self_check.all_required_sections_completed
    expected_value: true
  math_checks:
  - check: pass_rate is computed correctly with division-by-zero protection
    match_field: calculations
    formula_check: entry with name 'pass_rate' has result equal to (total_submissions
      - submissions_with_any_failure) / total_submissions, rounded to 2 decimal places;
      if total_submissions == 0, result is 0.0
  - check: 'FAIL condition: fewer than 5 submissions'
    match_field: final_output
    condition: if final_output == 'FAIL' AND summary_statistics.total_submissions
      < 5, this is a valid failure reason
  evidence_checks:
  - check: Every claim has a non-empty evidence_reference pointing to a submission
      or pattern
    match_field: claims
    condition: all claims must have evidence_reference != '' and evidence_reference
      != null
  - check: Every failure pattern has at least one example_evidence entry
    match_field: failure_patterns
    condition: all patterns must have len(example_evidence) >= 1
  - check: Every example_evidence entry has all required sub-fields
    match_field: failure_patterns.example_evidence
    required_keys:
    - submission_id
    - assignment_id
    - excerpt
    - failure_detail
  - check: Every risk has a non-empty evidence_reference
    match_field: risks
    condition: all risks must have non-empty evidence_reference
  - check: Frequency count matches number of example_evidence entries (or is >= 2)
    match_field: failure_patterns
    condition: for each pattern, frequency >= 2 AND frequency >= len(example_evidence)
  flag_rules:
  - flag_id: insufficient_submissions
    condition: summary_statistics.total_submissions < 5
    severity: high
    message: Fewer than 5 submissions analyzed - cannot reliably detect systematic
      patterns
  - flag_id: no_failure_patterns_detected
    condition: len(failure_patterns) == 0 AND summary_statistics.submissions_with_any_failure
      > 0
    severity: high
    message: Submissions had failures but no systematic patterns were extracted
  - flag_id: pattern_without_evidence
    condition: any pattern has len(example_evidence) == 0
    severity: medium
    message: A failure pattern was reported without supporting example evidence
  - flag_id: low_frequency_pattern
    condition: any pattern has frequency < 2
    severity: low
    message: A reported pattern appears in fewer than 2 submissions - may not be systematic
  - flag_id: invalid_pattern_type
    condition: any pattern has pattern_type not in allowed enum
    severity: medium
    message: Pattern type is not from the allowed enum list
  - flag_id: incomplete_self_check
    condition: self_check.all_required_sections_completed != true
    severity: high
    message: Agent did not complete all required self-check sections
  severity_mapping:
    honey: 'Low-frequency patterns (frequency == 2) with isolated occurrence on a
      single assignment type. These may be noise. Result: PASS with monitoring recommendation.'
    jelly: 'Patterns appearing across 3-5 submissions or affecting multiple assignment
      types. These indicate a moderate systemic issue. Result: CONDITIONAL_PASS with
      prompt or few-shot remediation recommended.'
    propolis: 'Patterns appearing in >50% of submissions, affecting all assignment
      types, or involving hallucination/calculation errors. These indicate a model-level
      issue requiring fine-tuning. Result: FAIL with mandatory fine-tune recommendation.'
  receipt_type: eval_receipt
  recommended_human_review: true
  sample_submission_shape:
    inputs:
      submission_batch:
      - sub_001.json
      - sub_002.json
      - sub_003.json
      - sub_004.json
      - sub_005.json
      assignment_metadata: batch_metadata.json
    expected_final_output: PASS | CONDITIONAL_PASS | FAIL
    notes: Human reviewer should spot-check example_evidence entries against original
      submissions to verify accuracy.
