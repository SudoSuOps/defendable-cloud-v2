- assignment_id: cre_memo_rent_roll_analysis_v1
  name: Rent Roll Summary and Lease Review
  lane: cre_real_estate_memo_eval
  version: '1.0'
  purpose: 'Extract rent roll data from a property memo, calculate weighted average
    rent per unit, identify lease expiration concentration, and flag any units below
    market rent. This tests data extraction from tabular formats and summary statistics.

    '
  operator_instructions: "1. Provide the memo with a rent roll table (unit types,\
    \ counts,\n   avg rents, lease expiration distribution).\n2. Verify weighted average\
    \ rent is calculated correctly across\n   all unit types.\n3. Verify lease expiration\
    \ concentration is identified. 4. Check that below-market units are flagged in\
    \ risks[]. 5. Publish eval_receipt.\n"
  agent_prompt: "Property Memo - Rent Roll: --- PROPERTY: Midtown Heights, 555 Midtown\
    \ Ave, Houston, TX Total Units: 80 Unit Mix:\n  - 1BR/1BA: 30 units, avg rent\
    \ $1,450/month, market rent $1,550\n  - 2BR/1BA: 25 units, avg rent $1,800/month,\
    \ market rent $1,950\n  - 2BR/2BA: 15 units, avg rent $2,100/month, market rent\
    \ $2,200\n  - 3BR/2BA: 10 units, avg rent $2,500/month, market rent $2,600\n\n\
    Lease Expiration Schedule (next 12 months):\n  - Q1 2026: 22 units (27.5%)\n \
    \ - Q2 2026: 18 units (22.5%)\n  - Q3 2026: 15 units (18.75%)\n  - Q4 2026: 12\
    \ units (15.0%)\n  - Beyond 2026: 13 units (16.25%)\n---\nCalculate and return\
    \ ONLY a JSON object:\n1. Weighted Average Rent Per Unit = sum(unit_count * avg_rent)\
    \ / total_units\n   (calculate monthly, then annualize)\n2. Below-Market Unit\
    \ Count: count all units where avg_rent < market_rent 3. Lease Expiration Concentration:\
    \ identify the quarter with highest % 4. Rent Roll Variance = sum(unit_count *\
    \ (market_rent - avg_rent)) monthly\nJSON structure: {\n  \"assignment_id\": \"\
    cre_memo_rent_roll_analysis_v1\",\n  \"agent_summary\": \"<string>\",\n  \"inputs_used\"\
    : [\"<string>\"],\n  \"missing_inputs\": [\"<string>\"],\n  \"claims\": [\n  \
    \  {\n      \"claim\": \"<string>\",\n      \"evidence_reference\": \"<string>\"\
    ,\n      \"confidence\": \"<provided | inferred | missing>\"\n    }\n  ],\n  \"\
    calculations\": [\n    {\n      \"name\": \"<string>\",\n      \"formula\": \"\
    <string>\",\n      \"inputs\": {\"<key>\": <number>},\n      \"result\": <number>,\n\
    \      \"units\": \"<string>\",\n      \"assumptions\": [\"<string>\"]\n    }\n\
    \  ],\n  \"risks\": [\n    {\n      \"risk\": \"<string>\",\n      \"severity\"\
    : \"<low | medium | high>\",\n      \"evidence_reference\": \"<string>\"\n   \
    \ }\n  ],\n  \"assumptions\": [\"<string>\"],\n  \"open_questions\": [\"<string>\"\
    ],\n  \"final_output\": \"<string>\",\n  \"self_check\": {\n    \"all_required_sections_completed\"\
    : true,\n    \"all_numbers_have_sources\": true,\n    \"assumptions_labeled\"\
    : true,\n    \"missing_inputs_disclosed\": true\n  }\n}\nCRITICAL RULES: - Weighted\
    \ average rent must use unit counts as weights. - Show both monthly and annual\
    \ weighted average rent as separate\n  calculations or show monthly with annualized\
    \ result.\n- Below-market unit count: ALL 80 units are below market (each unit\n\
    \  type's avg_rent is below its market_rent). The count is 80.\n- Lease expiration\
    \ concentration is Q1 2026 at 27.5%. - If any unit type is below market, add a\
    \ risk with severity \"medium\"\n  or \"high\" stating the number of units and\
    \ estimated monthly variance.\n- Show the rent roll variance calculation. - Do\
    \ not output any text outside the JSON object.\n"
  required_inputs:
  - total_units: 80
  - unit_1br_count: 30
  - unit_1br_rent: 1450
  - unit_1br_market: 1550
  - unit_2br1ba_count: 25
  - unit_2br1ba_rent: 1800
  - unit_2br1ba_market: 1950
  - unit_2br2ba_count: 15
  - unit_2br2ba_rent: 2100
  - unit_2br2ba_market: 2200
  - unit_3br_count: 10
  - unit_3br_rent: 2500
  - unit_3br_market: 2600
  expected_outputs:
  - weighted_avg_rent_monthly: 1856.25
  - weighted_avg_rent_annual: 22275.0
  - below_market_unit_count: 80
  - lease_expiration_concentration: Q1 2026 at 27.5%
  - rent_roll_variance_monthly: 10750.0
  - risk entries for below-market units and lease concentration
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - calculations
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
  deterministic_checks:
  - name: assignment_id_exact
    description: assignment_id equals "cre_memo_rent_roll_analysis_v1"
  - name: calculations_has_weighted_avg_rent
    description: calculations contains weighted average rent entry
  - name: calculations_has_below_market_count
    description: calculations contains below-market unit count entry
  - name: calculations_has_lease_concentration
    description: calculations or claims identifies Q1 2026 as peak expiration
  - name: calculations_has_rent_variance
    description: calculations contains rent roll variance entry
  - name: all_unit_types_in_calculations
    description: All 4 unit types appear in calculation inputs
  math_checks:
  - formula_id: weighted_avg_rent_monthly
    formula: (30*1450 + 25*1800 + 15*2100 + 10*2500) / 80
    expected_result: 1856.25
    tolerance: 0.5
  - formula_id: weighted_avg_rent_annual
    formula: monthly_weighted_avg * 12
    inputs:
      monthly_weighted_avg: 1856.25
    expected_result: 22275.0
    tolerance: 1.0
  - formula_id: below_market_count
    formula: 30 + 25 + 15 + 10
    expected_result: 80
    tolerance: 0
  - formula_id: rent_roll_variance_monthly
    formula: 30*(1550-1450) + 25*(1950-1800) + 15*(2200-2100) + 10*(2600-2500)
    expected_result: 10750.0
    tolerance: 1.0
  evidence_checks:
  - name: unit_mix_cited
    description: All unit types and counts are cited in inputs_used
  - name: rents_cited
    description: All avg rents and market rents are cited
  - name: lease_schedule_cited
    description: Lease expiration schedule is cited in inputs_used
  flag_rules:
  - flag_id: missing_weighted_avg_rent
    severity: propolis
    condition: calculations array is missing weighted average rent
  - flag_id: missing_below_market_count
    severity: jelly
    condition: calculations array is missing below-market unit count
  - flag_id: wrong_weighted_avg
    severity: propolis
    condition: Weighted average uses simple average instead of unit-weighted
  - flag_id: no_lease_concentration_flag
    severity: jelly
    condition: Q1 2026 lease concentration is not identified
  - flag_id: math_result_incorrect
    severity: propolis
    condition: Any math check result deviates beyond tolerance
  severity_mapping:
    honey: Minor calculation naming variation
    jelly: Missing below-market count or lease concentration not flagged
    propolis: Missing weighted average rent calculation or math error
  receipt_type: eval_receipt
  recommended_human_review: recommended
  sample_submission_shape:
    assignment_id: cre_memo_rent_roll_analysis_v1
    agent_summary: All 80 units are below market rent; Q1 2026 has 27.5% lease exposure.
    inputs_used:
    - '1BR/1BA: 30 units @ $1,450 vs market $1,550'
    - '2BR/1BA: 25 units @ $1,800 vs market $1,950'
    - '2BR/2BA: 15 units @ $2,100 vs market $2,200'
    - '3BR/2BA: 10 units @ $2,500 vs market $2,600'
    - 'Lease expirations: Q1 2026 27.5%, Q2 2026 22.5%, Q3 2026 18.75%, Q4 2026 15%'
    missing_inputs: []
    claims:
    - claim: Weighted average in-place rent is $1,856/month vs market $1,981/month.
      evidence_reference: Unit Mix
      confidence: provided
    - claim: All 80 units are below market rent, representing $10,750/month in potential
        upside.
      evidence_reference: Unit Mix
      confidence: provided
    - claim: 27.5% of leases expire in Q1 2026, creating concentration risk.
      evidence_reference: Lease Expiration Schedule
      confidence: provided
    calculations:
    - name: Weighted Average Rent (Monthly)
      formula: sum(unit_count * avg_rent) / total_units
      inputs:
        units_1br: 30
        rent_1br: 1450
        units_2br1ba: 25
        rent_2br1ba: 1800
        units_2br2ba: 15
        rent_2br2ba: 2100
        units_3br: 10
        rent_3br: 2500
        total_units: 80
      result: 1856.25
      units: USD/month
      assumptions:
      - Rents are current in-place rents.
    - name: Weighted Average Rent (Annual)
      formula: monthly_weighted_avg * 12
      inputs:
        monthly_weighted_avg: 1856.25
      result: 22275.0
      units: USD/year
      assumptions: []
    - name: Below-Market Unit Count
      formula: count of units where avg_rent < market_rent
      inputs:
        total_units: 80
      result: 80
      units: units
      assumptions:
      - All unit types have in-place rent below market.
    - name: Rent Roll Variance (Monthly)
      formula: sum(unit_count * (market_rent - avg_rent))
      inputs:
        units_1br: 30
        variance_1br: 100
        units_2br1ba: 25
        variance_2br1ba: 150
        units_2br2ba: 15
        variance_2br2ba: 100
        units_3br: 10
        variance_3br: 100
      result: 10750.0
      units: USD/month
      assumptions:
      - Market rents are achievable upon lease renewal.
    risks:
    - risk: All 80 units are below market rent; 27.5% lease roll in Q1 2026 creates
        execution risk for rent increases.
      severity: high
      evidence_reference: Lease Expiration Schedule
    - risk: $10,750/month in rent variance represents $129,000 annual upside if all
        units achieve market rent.
      severity: medium
      evidence_reference: Unit Mix
    assumptions:
    - Market rents are current as of the memo date.
    - Lease expiration schedule reflects contractual terms.
    open_questions:
    - What is the tenant retention rate at this property?
    - Are there any rent control restrictions?
    final_output: 'Weighted Avg Rent: $1,856/mo; 80 units below market; $129K annual
      upside; Q1 2026 roll risk.'
    self_check:
      all_required_sections_completed: true
      all_numbers_have_sources: true
      assumptions_labeled: true
      missing_inputs_disclosed: true
- assignment_id: cre_memo_risk_assessment_v1
  name: Deal Risk Assessment Summary
  lane: cre_real_estate_memo_eval
  version: '1.0'
  purpose: 'Identify, classify, and document all material risks in a CRE deal memo
    with severity ratings (low, medium, high) and specific evidence references. This
    eval tests the agent''s ability to synthesize risk factors from multiple data
    sources in the memo.

    '
  operator_instructions: "1. Provide the memo with multiple risk indicators (high\
    \ vacancy,\n   lease concentration, below-market rents, DSCR near threshold,\n\
    \   market vacancy divergence).\n2. Verify risks[] contains at least 4 risk entries.\
    \ 3. Verify each risk has severity rated low, medium, or high. 4. Verify each\
    \ risk has a non-empty evidence_reference. 5. Verify risks cover different categories\
    \ (operational, financial,\n   market, lease rollover).\n6. Publish eval_receipt.\n"
  agent_prompt: "Property Memo: --- PROPERTY: Riverside Plaza, 444 Riverfront Blvd,\
    \ Portland, OR\nDEAL ECONOMICS: Purchase Price: $22,000,000 Loan Amount: $16,500,000\
    \ Equity: $5,500,000 NOI: $1,430,000 Cap Rate: 6.5%\nDEBT TERMS: Interest Rate:\
    \ 7.0% Amortization: 25 years Annual Debt Service: $1,300,000\nOCCUPANCY: Current\
    \ Occupancy: 88% Market Occupancy: 94% Submarket Vacancy: 6%\nLEASE PROFILE: Total\
    \ Units: 150 WA Rent: $1,350/month Market Rent: $1,420/month Lease Roll (next\
    \ 12 months): 45 units (30%) Average Lease Term Remaining: 8 months\nPHYSICAL:\
    \ Year Built: 1998 Last Renovation: 2015 Capital Needs Assessment: $800,000 (roofing,\
    \ HVAC)\nMARKET: Submarket Rent Growth (trailing 12mo): 2.1% National Average\
    \ Rent Growth: 3.5% New Supply (under construction within 3 miles): 420 units\
    \ ---\nTask: Identify and classify all material risks in this deal.\nReturn ONLY\
    \ a JSON object with this structure: {\n  \"assignment_id\": \"cre_memo_risk_assessment_v1\"\
    ,\n  \"agent_summary\": \"<string>\",\n  \"inputs_used\": [\"<string: each memo\
    \ section used>\"],\n  \"missing_inputs\": [\"<string>\"],\n  \"claims\": [\n\
    \    {\n      \"claim\": \"<string>\",\n      \"evidence_reference\": \"<string>\"\
    ,\n      \"confidence\": \"<provided | inferred | missing>\"\n    }\n  ],\n  \"\
    calculations\": [\n    {\n      \"name\": \"<string>\",\n      \"formula\": \"\
    <string>\",\n      \"inputs\": {\"<key>\": <number>},\n      \"result\": <number>,\n\
    \      \"units\": \"<string>\",\n      \"assumptions\": [\"<string>\"]\n    }\n\
    \  ],\n  \"risks\": [\n    {\n      \"risk\": \"<string: specific risk description>\"\
    ,\n      \"severity\": \"<low | medium | high>\",\n      \"evidence_reference\"\
    : \"<string: specific memo section>\"\n    }\n  ],\n  \"assumptions\": [\"<string>\"\
    ],\n  \"open_questions\": [\"<string>\"],\n  \"final_output\": \"<string>\",\n\
    \  \"self_check\": {\n    \"all_required_sections_completed\": true,\n    \"all_numbers_have_sources\"\
    : true,\n    \"assumptions_labeled\": true,\n    \"missing_inputs_disclosed\"\
    : true\n  }\n}\nCRITICAL RULES: - risks[] array must contain at least 5 risk entries.\
    \ - Each risk must have a specific, descriptive risk statement (not generic).\
    \ - Each risk must cite the specific memo section in evidence_reference\n  (e.g.,\
    \ \"OCCUPANCY\", \"LEASE PROFILE\", \"DEBT TERMS\").\n- Severity must be accurately\
    \ rated:\n  * \"high\" for DSCR near/below 1.20, occupancy 6+ points below market,\n\
    \    capex over 10% of equity, lease roll >25% in 12 months\n  * \"medium\" for\
    \ below-market rents, new supply risk, rent growth below national\n  * \"low\"\
    \ for factors that are manageable or within normal range\n- Include at least one\
    \ risk from each category: financial (debt/DSCR),\n  operational (occupancy/vacancy),\
    \ market (rent growth, new supply),\n  and lease rollover.\n- Include calculations\
    \ for DSCR and at least one other quantitative risk metric. - Do not output any\
    \ text outside the JSON object.\n"
  required_inputs:
  - purchase_price: 22000000
  - loan_amount: 16500000
  - equity: 5500000
  - noi: 1430000
  - cap_rate: 0.065
  - interest_rate: 0.07
  - annual_debt_service: 1300000
  - current_occupancy: 0.88
  - market_occupancy: 0.94
  - submarket_vacancy: 0.06
  - total_units: 150
  - wa_rent: 1350
  - market_rent: 1420
  - lease_roll_12mo: 45
  - avg_lease_term: 8
  - year_built: 1998
  - capex_needs: 800000
  - rent_growth_submarket: 0.021
  - rent_growth_national: 0.035
  - new_supply: 420
  expected_outputs:
  - dscr: approximately 1.10
  - risks array with at least 5 entries
  - at least 1 high severity risk
  - at least 1 medium severity risk
  - risks from 4 categories: financial, operational, market, lease
  - each risk has non-empty evidence_reference
  required_output_schema:
    type: object
    required:
    - assignment_id
    - agent_summary
    - inputs_used
    - missing_inputs
    - claims
    - calculations
    - risks
    - assumptions
    - open_questions
    - final_output
    - self_check
  deterministic_checks:
  - name: assignment_id_exact
    description: assignment_id equals "cre_memo_risk_assessment_v1"
  - name: risks_has_at_least_5
    description: risks array has length >= 5
  - name: each_risk_has_severity
    description: Every risks[].severity is one of low, medium, high
  - name: each_risk_has_evidence
    description: Every risks[].evidence_reference is non-empty
  - name: has_high_severity_risk
    description: At least one risk has severity "high"
  - name: has_medium_severity_risk
    description: At least one risk has severity "medium"
  - name: has_low_severity_risk
    description: At least one risk has severity "low"
  - name: four_risk_categories_covered
    description: Risks cover financial, operational, market, and lease categories
  - name: calculations_has_dscr
    description: calculations contains DSCR calculation
  - name: dscr_is_high_risk
    description: DSCR of ~1.10 is flagged as high severity risk
  math_checks:
  - formula_id: dscr
    formula: noi / annual_debt_service
    inputs:
      noi: 1430000
      annual_debt_service: 1300000
    expected_result: 1.1
    tolerance: 0.01
  - formula_id: occupancy_gap
    formula: market_occupancy - current_occupancy
    inputs:
      market_occupancy: 0.94
      current_occupancy: 0.88
    expected_result: 0.06
    tolerance: 0.001
  - formula_id: lease_roll_pct
    formula: 45 / 150
    expected_result: 0.3
    tolerance: 0.001
  - formula_id: capex_to_equity
    formula: 800000 / 5500000
    expected_result: 0.1455
    tolerance: 0.001
  evidence_checks:
  - name: memo_sections_cited
    description: All relevant memo sections appear in inputs_used
  - name: each_risk_cites_source
    description: Every risk evidence_reference matches a memo section
  - name: no_generic_risk_descriptions
    description: Risk descriptions reference specific numbers from the memo
  flag_rules:
  - flag_id: fewer_than_5_risks
    severity: propolis
    condition: risks array has fewer than 5 entries
  - flag_id: missing_severity
    severity: jelly
    condition: Any risk is missing severity or has invalid severity value
  - flag_id: missing_evidence_reference
    severity: jelly
    condition: Any risk has empty evidence_reference
  - flag_id: no_high_severity_risk
    severity: jelly
    condition: No risk has severity "high" despite clear high-risk indicators
  - flag_id: missing_dscr_calc
    severity: propolis
    condition: calculations array is missing DSCR calculation
  - flag_id: dscr_not_flagged_high
    severity: jelly
    condition: DSCR of ~1.10 is not flagged as a high-severity risk
  - flag_id: math_result_incorrect
    severity: jelly
    condition: Any math check result deviates beyond tolerance
  severity_mapping:
    honey: Risk description could be more specific but categories are covered
    jelly: Missing severity on a risk, or DSCR not flagged as high severity
    propolis: Fewer than 5 risks identified, or missing DSCR calculation
  receipt_type: eval_receipt
  recommended_human_review: required
  sample_submission_shape:
    assignment_id: cre_memo_risk_assessment_v1
    agent_summary: Identified 6 material risks across financial, operational, market,
      and lease categories. DSCR of 1.10x is below threshold.
    inputs_used:
    - 'Purchase Price: $22,000,000'
    - 'Loan Amount: $16,500,000'
    - 'NOI: $1,430,000'
    - 'Annual Debt Service: $1,300,000'
    - 'Current Occupancy: 88%'
    - 'Market Occupancy: 94%'
    - 'WA Rent: $1,350/month'
    - 'Market Rent: $1,420/month'
    - 'Lease Roll: 45 units (30%)'
    - 'CapEx Needs: $800,000'
    - 'Submarket Rent Growth: 2.1%'
    - 'New Supply: 420 units'
    missing_inputs: []
    claims:
    - claim: DSCR of 1.10x is below the 1.20x minimum threshold.
      evidence_reference: DEBT TERMS
      confidence: provided
    - claim: Occupancy is 600 basis points below market.
      evidence_reference: OCCUPANCY
      confidence: provided
    - claim: 30% of leases roll in the next 12 months with only 8 months average term
        remaining.
      evidence_reference: LEASE PROFILE
      confidence: provided
    calculations:
    - name: Debt Service Coverage Ratio
      formula: noi / annual_debt_service
      inputs:
        noi: 1430000
        annual_debt_service: 1300000
      result: 1.1
      units: ratio
      assumptions:
      - NOI and debt service per memo.
    - name: CapEx to Equity Ratio
      formula: capex_needs / equity
      inputs:
        capex_needs: 800000
        equity: 5500000
      result: 0.1455
      units: ratio
      assumptions:
      - CapEx needs per assessment.
    - name: Occupancy Gap
      formula: market_occupancy - current_occupancy
      inputs:
        market_occupancy: 0.94
        current_occupancy: 0.88
      result: 0.06
      units: percentage points
      assumptions: []
    risks:
    - risk: DSCR of 1.10x is below the 1.20x lending threshold, indicating thin debt
        coverage and limited margin for NOI decline.
      severity: high
      evidence_reference: DEBT TERMS
    - risk: Current occupancy of 88% is 600 basis points below market occupancy of
        94%, indicating operational underperformance or competitive pressure.
      severity: high
      evidence_reference: OCCUPANCY
    - risk: 30% of leases (45 units) roll in the next 12 months with only 8 months
        average term remaining, creating significant re-leasing risk in a softening
        market.
      severity: high
      evidence_reference: LEASE PROFILE
    - risk: CapEx needs of $800,000 represent 14.5% of equity investment, reducing
        cash-on-cash returns and requiring additional capital.
