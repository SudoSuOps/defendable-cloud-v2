[project]
name = "defendablecloud-cli"
version = "0.1.0"
description = "DefendableCloud CLI — drive the proof vault from your terminal. Eval Runs · receipts · hash-chained verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — Swarm and Bee LLC" }
authors = [{ name = "Swarm and Bee LLC", email = "build@defendableos.com" }]
keywords = ["defendablecloud", "ai", "agentic", "proof-of-execution", "receipts", "rulebook"]
dependencies = [
    "typer>=0.12,<1.0",
    "httpx>=0.27,<1.0",
    "rich>=13.7,<14.0",
]

[project.scripts]
defendable = "defendablecloud_cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "respx>=0.21,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defendablecloud_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
